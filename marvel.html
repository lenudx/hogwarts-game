<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>漫威宇宙模拟器</title>
<style>
:root {
  --bg-deep: #070a12;
  --bg-mid: #10151f;
  --bg-light: #161d2b;
  --border-dim: #232c3d;
  --border-light: #1a2130;
  --border-glow: #3a465c;
  --text-main: #e6eaf2;
  --text-dim: #8a94a8;
  --text-faint: #525c70;
  --accent: #ed1d24;
  --accent-gold: #ffc72c;
  --accent-blue: #4a9eff;
  --accent-cyan: #22d3ee;
  --success: #34c759;
  --danger: #ff3b30;
  --accent-glow: rgba(237,29,36,0.15);
  --app-brightness: 100%;
  --app-contrast: 100%;
  --app-blur: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  color: var(--text-main); font-size: 14px;
  background-color: var(--bg-deep);
  background-image: radial-gradient(circle at 50% 0%, #131c2e 0%, #070a12 80%);
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
button, input, textarea, select { font-family: inherit; font-size: 13px; }
button {
  cursor: pointer; border-radius: 10px; border: 1px solid var(--border-dim);
  background: var(--bg-light); color: var(--text-main);
  padding: 7px 12px; transition: 0.2s; touch-action: manipulation; user-select: none;
}
button:active { transform: scale(0.96); background: #1d2638; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary {
  background: linear-gradient(135deg, #2a1113, #3d1418);
  border-color: var(--accent); color: #ff6b70; font-weight: 600;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 10px rgba(237,29,36,0.15);
}
button.primary:hover { background: linear-gradient(135deg, #3d1418, #521a20); color: #ff8a8f; }
button.danger { border-color: rgba(255,59,48,0.35); color: var(--danger); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 6px;
  background: var(--border-dim); border-radius: 3px; outline: none; margin: 8px 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
  box-shadow: 0 2px 6px rgba(237,29,36,0.5); border: 2px solid #fff;
}

/* ===== Header ===== */
header {
  flex-shrink: 0; display: flex; align-items: center;
  padding: 6px 10px; background: var(--bg-mid);
  border-bottom: 1px solid var(--border-dim); gap: 8px; z-index: 10;
}
.header-left, .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.header-info .h-line {
  font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.header-info .h-line span { color: var(--accent-gold); font-weight: 600; }
.header-info .h-line .h-label { color: var(--text-faint); font-weight: 400; }

/* ===== Main ===== */
main { flex: 1; display: flex; overflow: hidden; position: relative; }
#sidebar {
  width: 250px; flex-shrink: 0; background: var(--bg-mid);
  border-right: 1px solid var(--border-dim); overflow-y: auto; padding: 10px;
  transition: 0.25s; z-index: 20;
}
#sidebar.hidden {
  transform: translateX(-100%); position: absolute; top: 0; bottom: 0; left: 0;
  box-shadow: 5px 0 20px rgba(0,0,0,0.5);
}
#main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#story {
  flex: 1; overflow-y: auto; padding: 16px;
  filter: brightness(var(--app-brightness)) contrast(var(--app-contrast)) blur(var(--app-blur));
  transition: filter 0.2s;
}

/* ===== 消息气泡 ===== */
.msg {
  max-width: 92%; margin-bottom: 14px; line-height: 1.7;
  animation: fadeIn 0.3s ease; word-break: break-word; white-space: pre-wrap;
  position: relative;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg.assistant {
  margin-right: auto; background: var(--bg-mid);
  border: 1px solid var(--border-dim); border-top-left-radius: 4px; border-radius: 16px;
  padding: 16px 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.msg.user {
  margin-left: auto; background: linear-gradient(135deg, #1e2a45, #182238);
  border: 1px solid #2d3f63; border-top-right-radius: 4px; border-radius: 16px;
  padding: 12px 16px; color: #b9d4ff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
}
.msg.system {
  margin: 0 auto; text-align: center; font-size: 12px; color: var(--text-dim);
  background: rgba(255,255,255,0.03); border: 1px solid var(--border-dim);
  border-radius: 20px; padding: 8px 16px; max-width: 95%;
}

/* ===== 选项 ===== */
#options {
  flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 0 16px 8px; max-height: 140px; overflow-y: auto;
}
#options button {
  text-align: left; padding: 10px 14px 10px 30px; position: relative;
  font-size: 13px; border-radius: 12px;
}
#options button::before {
  content: "▸"; position: absolute; left: 12px; color: var(--accent); font-size: 13px;
}

/* ===== 输入栏 ===== */
#input-bar {
  flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px 16px;
  background: transparent; border-top: 1px solid var(--border-dim); align-items: flex-end;
}
#user-input {
  flex: 1; min-height: 44px; max-height: 100px; line-height: 1.5;
  padding: 12px 16px; background: var(--bg-light);
  border: 1px solid var(--border-dim); border-radius: 22px;
  color: var(--text-main); outline: none; resize: none;
}
#user-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
#send-btn { height: 44px; flex-shrink: 0; padding: 0 24px; border-radius: 22px; }

/* ===== 卡片 / 属性 ===== */
.card {
  background: var(--bg-light); border: 1px solid var(--border-dim);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.card h4 { font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; gap: 8px; }
.kv .k { color: var(--text-dim); flex-shrink: 0; }
.kv .v { text-align: right; word-break: break-all; }
.bar-row { margin: 6px 0; }
.bar-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.bar { height: 8px; background: var(--border-dim); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.bar.hp > i { background: linear-gradient(90deg, #ed1d24, #ff5a60); }
.bar.energy > i { background: linear-gradient(90deg, #4a9eff, #7bc0ff); }
.tag {
  display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 10px;
  background: var(--bg-deep); color: var(--text-dim);
  border: 1px solid var(--border-dim); margin: 2px 4px 2px 0;
}
.rel { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.rel .v.pos { color: var(--success); font-weight: 600; }
.rel .v.neg { color: var(--danger); font-weight: 600; }

/* ===== 弹窗 ===== */
.modal {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
  display: none; align-items: center; justify-content: center; z-index: 100;
  padding: 16px; backdrop-filter: blur(4px);
}
.modal.show { display: flex; }
.modal-box {
  background: var(--bg-mid); border: 1px solid var(--border-dim);
  border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border-dim); flex-shrink: 0;
}
.modal-head h3 { font-size: 16px; color: var(--text-main); font-weight: 600; }
.settings-tabs {
  display: flex; border-bottom: 1px solid var(--border-dim);
  flex-shrink: 0; background: var(--bg-light); overflow-x: auto;
}
.settings-tabs button {
  flex: 1; min-width: 68px; border: none; background: transparent;
  border-radius: 0; padding: 12px 6px; font-size: 13px; color: var(--text-dim);
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.settings-tabs button.active {
  color: var(--accent); border-bottom-color: var(--accent); font-weight: 600;
}
.modal-body { overflow-y: auto; padding: 16px; flex: 1; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px 12px; background: var(--bg-light);
  border: 1px solid var(--border-dim); border-radius: 10px;
  color: var(--text-main); outline: none; transition: 0.2s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* ===== 音乐播放器 ===== */
.music-player { background: var(--bg-light); border: 1px solid var(--border-dim); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.music-info { text-align: center; margin-bottom: 10px; }
.music-info .title { font-size: 14px; font-weight: 600; color: var(--accent-gold); }
.music-info .artist { font-size: 11px; color: var(--text-dim); }
.music-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
.music-controls button { width: 36px; height: 36px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
.music-controls button.play-btn { width: 46px; height: 46px; font-size: 20px; background: var(--accent); color: #fff; border: none; }
.progress-container, .volume-container { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
.volume-container { margin-top: 6px; }
.playlist { max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--border-dim); padding-top: 8px; }
.playlist-item { display: flex; justify-content: space-between; padding: 6px; font-size: 12px; border-radius: 6px; cursor: pointer; }
.playlist-item:hover { background: rgba(237,29,36,0.08); }
.playlist-item.active { color: var(--accent); background: rgba(237,29,36,0.1); }
.playlist-item .delete-btn { color: var(--danger); cursor: pointer; padding: 0 4px; }

/* ===== 预设条目 ===== */
.preset-entry { background: var(--bg-light); border: 1px solid var(--border-dim); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
.preset-entry .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.preset-entry .entry-head input { flex: 1; margin-right: 6px; font-size: 12px; }
.preset-entry .entry-controls { display: flex; gap: 4px; }
.preset-entry .entry-controls button { padding: 2px 6px; font-size: 11px; }
.preset-entry textarea { font-size: 11px; font-family: monospace; width: 100%; margin-top: 4px; }

/* ===== Loading ===== */
.loading { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.3s infinite; }
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

/* ===== 消息版本徽章 ===== */
.msg-ver-badge {
  position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--text-dim);
  background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 10px;
  pointer-events: none; font-weight: 600; letter-spacing: 1px;
}

/* ===== 长按菜单 ===== */
.msg-menu-overlay {
  position: fixed; inset: 0; z-index: 2200; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(4px);
}
.msg-menu-overlay.show { display: flex; }
.msg-menu-box {
  background: var(--bg-mid); border: 1px solid var(--border-dim);
  border-radius: 16px; min-width: 240px; max-width: 320px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.msg-menu-title {
  padding: 14px 18px 10px; font-size: 11px; color: var(--text-dim);
  letter-spacing: 2px; border-bottom: 1px solid var(--border-dim);
}
.msg-menu-box button {
  display: block; width: 100%; padding: 14px 18px; background: transparent;
  border: none; border-bottom: 1px solid var(--border-light);
  color: var(--text-main); font-size: 14px; text-align: left; border-radius: 0;
}
.msg-menu-box button:last-child { border-bottom: none; }
.msg-menu-box button:hover { background: var(--bg-light); }
.msg-menu-box button.danger { color: var(--danger); }
.msg-menu-box button.cancel { color: var(--text-dim); text-align: center; }

/* ===== 开场动画 ===== */
#intro-anim {
  position: fixed; inset: 0; z-index: 2500;
  background: radial-gradient(circle at 50% 40%, #131c2e 0%, #070a12 70%);
  display: none; align-items: center; justify-content: center; overflow: hidden;
}
#intro-anim.show { display: flex; }
#intro-anim::before {
  content: ''; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 20% 30%, rgba(237,29,36,0.12) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(74,158,255,0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,199,44,0.06) 0%, transparent 50%);
  animation: introDrift 22s ease-in-out infinite alternate; pointer-events: none;
}
@keyframes introDrift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-3%,-2%) scale(1.08); } }
#intro-text-wrap { position: relative; z-index: 2; max-width: 620px; padding: 0 28px; text-align: center; }
#intro-text {
  font-size: 20px; line-height: 2.1; color: var(--text-main);
  letter-spacing: 2px; white-space: pre-wrap; min-height: 5em;
}
#intro-text .cursor {
  display: inline-block; width: 10px; height: 20px; background: var(--accent);
  margin-left: 2px; vertical-align: -3px; animation: introBlink 0.9s steps(2) infinite;
  box-shadow: 0 0 10px rgba(237,29,36,0.7);
}
@keyframes introBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
#intro-enter {
  margin-top: 44px; font-size: 14px; letter-spacing: 6px; color: var(--accent);
  background: transparent; border: 1px solid var(--accent);
  padding: 12px 32px; border-radius: 30px; cursor: pointer; opacity: 0;
  transition: opacity 1.2s ease, background 0.3s, box-shadow 0.3s; pointer-events: none;
}
#intro-enter.show { opacity: 1; pointer-events: auto; }
#intro-enter:hover { background: rgba(237,29,36,0.12); box-shadow: 0 0 24px rgba(237,29,36,0.4); }
#intro-skip {
  position: absolute; right: 20px; top: 20px; z-index: 3;
  font-size: 11px; color: var(--text-faint); background: transparent;
  border: none; cursor: pointer; letter-spacing: 2px; padding: 8px;
}
#intro-skip:hover { color: var(--text-main); }

/* ===== 侧栏 ===== */
.cc-sidebar-photo-wrap { text-align: center; margin-bottom: 10px; }
.cc-sidebar-photo { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--border-dim); object-fit: cover; background: var(--bg-light); cursor: pointer; }
.cc-sidebar-photo-empty { width: 84px; height: 84px; border-radius: 50%; border: 2px dashed var(--border-dim); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-faint); cursor: pointer; background: var(--bg-light); }
.cc-sidebar-timeline { font-size: 10px; color: var(--text-dim); text-align: center; padding: 8px; background: var(--bg-light); border-radius: 8px; margin-bottom: 8px; line-height: 1.5; }
.cc-sidebar-timeline .cur { color: var(--accent-gold); font-weight: 600; }

/* ===== 折叠区块 ===== */
.cc-sec { border: 1px solid var(--border-dim); border-radius: 12px; margin-bottom: 8px; overflow: hidden; background: var(--bg-mid); }
.cc-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg-light); cursor: pointer; user-select: none; }
.cc-sec-head h4 { font-size: 12px; color: var(--text-main); letter-spacing: 0.5px; font-weight: 600; }
.cc-sec-head .arrow { color: var(--text-dim); transition: transform .2s; font-size: 11px; }
.cc-sec.open .cc-sec-head .arrow { transform: rotate(90deg); }
.cc-sec-body { display: none; padding: 12px 14px; border-top: 1px solid var(--border-light); }
.cc-sec.open .cc-sec-body { display: block; }
.cc-row { display: flex; padding: 6px 0; border-bottom: 1px dashed var(--border-light); font-size: 12px; gap: 8px; }
.cc-row:last-child { border-bottom: none; }
.cc-row .cc-k { color: var(--text-dim); flex-shrink: 0; min-width: 70px; }
.cc-row .cc-v { color: var(--text-main); flex: 1; word-break: break-word; white-space: pre-wrap; font-weight: 500; }
.cc-row .cc-v.empty { color: var(--text-faint); font-style: italic; font-weight: normal; }

/* ===== 响应式 ===== */
@media (min-width: 821px) {
  .only-mobile { display: none; }
  #sidebar { position: static; transform: none !important; }
}
@media (max-width: 480px) {
  .msg.assistant { padding: 14px 15px; font-size: 14px; }
  #story { padding: 12px; }
  #options { padding: 0 12px 6px; }
  header { padding: 6px 8px; gap: 6px; }
  .header-info .h-line { font-size: 10px; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-left">
      <button class="only-mobile" onclick="window.toggleSidebar()">☰</button>
    </div>
    <div class="header-info">
      <div class="h-line"><span id="ui-header-year">--</span> · <span id="ui-header-scene">未知</span></div>
      <div class="h-line"><span class="h-label">在场：</span><span id="ui-header-actors">你</span></div>
    </div>
   <div class="header-right">
  <button onclick="window.openShop()" title="商店">🛒</button>
  <button onclick="window.openModal('modal-settings')">⚙</button>
</div>
  </header>

  <main>
    <aside id="sidebar" class="hidden">
      <div id="cc-sidebar-body"></div>
    </aside>

    <div id="main-content">
      <div id="story"></div>
      <div id="options"></div>
      <div id="input-bar">
        <textarea id="user-input" rows="1" placeholder="你想做什么？（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="primary" id="send-btn" onclick="window.onSend()">发送</button>
      </div>
    </div>
  </main>
</div>

<!-- 消息长按菜单 -->
<div class="msg-menu-overlay" id="msg-menu-overlay" onclick="if(event.target===this) window.hideMesMenu()">
  <div class="msg-menu-box" onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()">
    <div class="msg-menu-title" id="msg-menu-title">◈ 消息操作</div>
    <button id="menu-btn-regen" onclick="window.menuRegen()">🔁 再说一个（重新生成）</button>
    <button id="menu-btn-edit" onclick="window.menuEdit()">✏️ 修改内容</button>
    <button onclick="window.menuDelete()" class="danger">🗑 删除这条消息</button>
    <button onclick="window.hideMesMenu()" class="cancel" type="button">取消</button>
  </div>
</div>

<!-- 开场动画 -->
<div id="intro-anim">
  <button id="intro-skip" onclick="window.skipIntroAnim()">跳过 ↦</button>
  <div id="intro-text-wrap">
    <div id="intro-text"></div>
    <button id="intro-enter" onclick="window.finishIntroAnim()">睁 开 眼</button>
  </div>
</div>

<!-- 建档 -->
<div class="modal" id="modal-create">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-head"><h3 id="cc-create-title">📝 建立档案</h3></div>
    <div class="modal-body" id="cc-create-body"></div>
  </div>
</div>

<!-- 商店 -->
<div class="modal" id="modal-shop">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-head">
      <h3>🛒 黑市与商店</h3>
      <div style="display:flex;gap:6px;">
        <button class="primary" onclick="window.refreshShop()" style="padding:5px 10px;font-size:11px;">🔄 刷新 ($10)</button>
        <button onclick="window.closeModal('modal-shop')">关闭</button>
      </div>
    </div>
    <div class="modal-body" id="shop-body"></div>
  </div>
</div>
<!-- 设置 -->
<div class="modal" id="modal-settings">
  <div class="modal-box">
    <div class="modal-head"><h3>⚙ 系统设置</h3><button onclick="window.closeModal('modal-settings')">关闭</button></div>
    <div class="settings-tabs">
      <button class="active" onclick="window.switchSettingsTab('tab-api')">API</button>
      <button onclick="window.switchSettingsTab('tab-world')">世界书</button>
      <button onclick="window.switchSettingsTab('tab-preset')">预设</button>
      <button onclick="window.switchSettingsTab('tab-beautify')">美化</button>
      <button onclick="window.switchSettingsTab('tab-music')">音乐</button>

const DEFAULT_PRESETS = [{

      content: '当前游戏状态：\n{{state}}\n\n相关设定（世界书）：\n{{worldbook}}' },
    { id: uid(), name: '文风禁令', enabled: true, role: 'system',

    { id: uid(), name: '输出格式', enabled: true, role: 'system',

// ==================== 全局状态 ====================
let apiProfiles = LS.get('mv_api_profiles', DEFAULT_API_PROFILES);
let activeApiProfileId = LS.get('mv_active_api_profile', apiProfiles[0]?.id || 'default');
let worldbooks = LS.get('mv_worldbooks', DEFAULT_WORLDBOOKS);

let history = LS.get('mv_history', []);
let displayHistory = LS.get('mv_display', []);
let busy = false;

let playlist = LS.get('mv_playlist', []);
let currentTrackIndex = -1;
let isPlaying = false;
let audio = new Audio();
let beautifySettings = LS.get('mv_beautify', { brightness: 100, contrast: 100, blur: 0, wallpaper: '' });

// 数据安全兜底
if (!gameState || !gameState.stats) gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
if (!Array.isArray(apiProfiles) || apiProfiles.length === 0) apiProfiles = DEFAULT_API_PROFILES;
if (!Array.isArray(worldbooks) || worldbooks.length === 0) worldbooks = DEFAULT_WORLDBOOKS;
if (!Array.isArray(presets) || presets.length === 0) presets = DEFAULT_PRESETS;
if (!presets[0].prompts) presets = DEFAULT_PRESETS;
if (!Array.isArray(gameState.achievements)) gameState.achievements = [];
if (!Array.isArray(gameState.usedCodes)) gameState.usedCodes = [];
if (!gameState.characters) gameState.characters = {};
if (!gameState.relationsTags) gameState.relationsTags = {};

if (Array.isArray(displayHistory)) {
  displayHistory.forEach(m => {
    if (m && m.text !== undefined && !m.versions) {
      m.versions = [m.text];
      m.activeVersion = 0;
      delete m.text;
    }
  });
}

// ==================== 弹窗控制 ====================
window.toggleSidebar = () => { $('sidebar').classList.toggle('hidden'); };
window.openModal = (id) => {
  const modalEl = $(id);
  if (modalEl) modalEl.classList.add('show');
  try {
    if(id === 'modal-settings') {
      try { renderApiProfiles(); } catch(e) { console.error(e); }
      try { renderWorldbookSelect(); renderWorldList(); } catch(e) { console.error(e); }
      try { renderPresetSelect(); renderPresetList(); } catch(e) { console.error(e); }
      try { renderBeautifyUI(); } catch(e) { console.error(e); }
    }
  } catch (err) {
    console.error("弹窗渲染出错:", err);
  }
};
window.closeModal = (id) => $(id).classList.remove('show');
window.switchSettingsTab = (tabId) => {
  document.querySelectorAll('.settings-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

    tabPane.classList.add('active');
    try {
      if (tabId === 'tab-music') renderMusicPlaylist();

    } catch(e) { console.error(e); }

// ==================== 顶栏渲染 ====================
window.renderStatus = () => {
  const s = gameState;
  let yearStr = '现代', timeStr = '未知';
  if (s.time) {
    const m = s.time.match(/(\d{4}年|\d{4}年?)/);
    if (m) yearStr = m[1];
    else yearStr = s.time.split('·')[0].trim();
    const tm = s.time.match(/·\s*(.+)$/);
    timeStr = tm ? tm[1].trim() : (s.time.replace(/^\d{4}年\s*/, '') || s.time);
  }
  const elYear = $('ui-header-year'); if (elYear) elYear.textContent = yearStr;
  const elScene = $('ui-header-scene'); if (elScene) elScene.textContent = s.scene || '未知';
  let actors = s.actors || ['你'];
  if (!Array.isArray(actors)) actors = [actors];
  const elActors = $('ui-header-actors'); if (elActors) elActors.textContent = actors.join('、');
  window.renderCharSidebar();

// ==================== 消息渲染 ====================
function makeMsgEl(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  return d;
}
function getMsgText(m) {
  if (m.versions && Array.isArray(m.versions)) return m.versions[m.activeVersion || 0] || '';
  return m.text || '';
}
function ensureVersions(m) {
  if (!m.versions) { m.versions = [m.text || '']; m.activeVersion = 0; delete m.text; }
  if (typeof m.activeVersion !== 'number') m.activeVersion = 0;
}

window.pushDisplay = (role, text) => {
  const entry = { role, versions: [text], activeVersion: 0, t: Date.now() };
  displayHistory.push(entry);
  if (displayHistory.length > 200) displayHistory = displayHistory.slice(-200);
  const el = makeMsgEl(role, text);
  const idx = displayHistory.length - 1;
  el.dataset.idx = idx;
  attachMsgGestures(el, idx);
  $('story').appendChild(el);
  $('story').scrollTop = $('story').scrollHeight;
  LS.set('mv_display', displayHistory);
};

window.renderStory = () => {
  const box = $('story');
  box.innerHTML = '';
  if (!displayHistory.length) {
    box.innerHTML = '<div style="text-align:center;color:var(--text-faint);font-size:12px;padding:40px 10px;">还没有开始。</div>';
    return;
  }
  displayHistory.forEach((m, i) => {
    ensureVersions(m);
    const el = makeMsgEl(m.role, getMsgText(m));
    el.dataset.idx = i;
    if (m.role === 'assistant' && m.versions.length > 1) {
      const badge = document.createElement('span');
      badge.className = 'msg-ver-badge';
      badge.textContent = (m.activeVersion + 1) + ' / ' + m.versions.length;
      el.appendChild(badge);
    }
    attachMsgGestures(el, i);
    box.appendChild(el);
  });
  requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
};

window.showLoading = () => {
  window.hideLoading();
  const d = document.createElement('div');
  d.className = 'msg assistant loading';
  d.id = 'loading-msg';
  d.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  $('story').appendChild(d);
  $('story').scrollTop = $('story').scrollHeight;
};
window.hideLoading = () => { const e = $('loading-msg'); if (e) e.remove(); };

window.renderOptions = (opts) => {
  const box = $('options');
  box.innerHTML = '';
  (opts || []).forEach(o => {
    const b = document.createElement('button');
    b.textContent = o;
    b.onclick = () => { box.innerHTML = ''; window.sendAction(o); };
    box.appendChild(b);
  });
};

// ==================== 长按手势 ====================
function attachMsgGestures(el, idx) {
  let startX = 0, startY = 0, longPressTimer = null, moved = false, didTrigger = false;
  const cancelLong = () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } };
  const onStart = (e) => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    moved = false; didTrigger = false;
    cancelLong();
    longPressTimer = setTimeout(() => {
      if (!moved) {
        didTrigger = true;
        if (navigator.vibrate) navigator.vibrate(30);
        window.showMesMenu(idx);
      }
    }, 520);
  };
  const onMove = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { moved = true; cancelLong(); }
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      if (!didTrigger) { didTrigger = true; window.swipeMsg(idx, dx < 0 ? 1 : -1); }
    }
  };
  const onEnd = () => { cancelLong(); };
  el.addEventListener('touchstart', onStart, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: true });
  el.addEventListener('touchend', onEnd, { passive: true });
  el.addEventListener('touchcancel', onEnd, { passive: true });
  el.addEventListener('mousedown', onStart);
  el.addEventListener('mousemove', onMove);
  el.addEventListener('mouseup', onEnd);
  el.addEventListener('mouseleave', onEnd);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

// ==================== 消息菜单 ====================
let menuTargetIdx = -1;

window.showMesMenu = (idx) => {
  if (idx < 0 || !displayHistory[idx]) return;
  menuTargetIdx = idx;
  const m = displayHistory[idx];
  const title = $('msg-menu-title');

window.menuDelete = () => {

window.menuEdit = () => {

  if (idx < 0 || !displayHistory[idx]) return;
  const m = displayHistory[idx];
  ensureVersions(m);

window.menuRegen = async () => {
  const idx = menuTargetIdx;
  if (idx < 0 || !displayHistory[idx]) return;
  const m = displayHistory[idx];
  if (m.role !== 'assistant') { alert('只能对 AI 叙事的回复重新生成。'); return; }
  ensureVersions(m);
  window.hideMesMenu();

  let playerIdx = idx - 1;
  while (playerIdx >= 0 && displayHistory[playerIdx].role !== 'user') playerIdx--;
  if (playerIdx < 0) { alert('找不到对应的玩家输入。'); return; }
  const playerText = getMsgText(displayHistory[playerIdx]);

  const context = displayHistory.slice(0, idx)
    .filter(x => x.role === 'assistant' || x.role === 'user')
    .map(x => (x.role === 'user' ? '玩家：' : '') + getMsgText(x))
    .slice(-10).join('\n\n');

  window.showLoading();
  try {
    const apiProfile = apiProfiles.find(p => p.id === activeApiProfileId);
    let raw;
    if (!apiProfile || !apiProfile.key) {
      await new Promise(r => setTimeout(r, 800));
      raw = JSON.stringify({ narration: `[模拟模式] 这是重新生成的版本（${m.versions.length + 1}）。请先在 ⚙ 里填 API。`, state_changes: {}, options: [] });
    } else {
      const messages = [
        { role: 'system', content: buildSystemPrompt(playerText) },
        { role: 'user', content: `【重新生成】最近剧情：\n${context}\n\n玩家行动：${playerText}\n\n请给出与之前不同的描写角度或情节走向。` }
      ];
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);
      const res = await fetch(apiProfile.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiProfile.key },
        body: JSON.stringify({ model: apiProfile.model, messages, temperature: apiProfile.temperature }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const json = await res.json();
      raw = json?.choices?.[0]?.message?.content;
      if (!raw) throw new Error('接口返回格式异常');
    }
    window.hideLoading();

    let data;
    try {
      let cleanStr = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
      const firstBrace = cleanStr.indexOf('{'), lastBrace = cleanStr.lastIndexOf('}');
      if (firstBrace >= 0 && lastBrace > firstBrace) cleanStr = cleanStr.slice(firstBrace, lastBrace + 1);
      data = JSON.parse(cleanStr);
    } catch(e) {
      data = { narration: raw, state_changes: {}, options: [] };
    }

    const newText = data.narration || data.text || '（无叙述）';
    m.versions.push(newText);
    m.activeVersion = m.versions.length - 1;
    applyStateChanges(data.state_changes, data.npc_profiles);
    LS.set('mv_display', displayHistory);
    window.renderStory();
    if (data.options) window.renderOptions(data.options);
  } catch(err) {
    window.hideLoading();
    window.pushDisplay('system', '⚠ 重新生成失败：' + err.message);
  }
};

window.swipeMsg = (idx, dir) => {

// ==================== 状态应用 ====================
function applyStateChanges(c, npcProfiles) {
  if (!c) return;
  const st = gameState.stats;
  if (typeof c.hp === 'number') st.hp = clamp(st.hp + c.hp, 0, st.maxHp);
  if (typeof c.energy === 'number') st.energy = clamp(st.energy + c.energy, 0, st.maxEnergy);
  if (typeof c.money === 'number') st.money = Math.max(0, st.money + c.money);
  if (typeof c.maxHp === 'number') st.maxHp = Math.max(1, st.maxHp + c.maxHp);
  if (typeof c.maxEnergy === 'number') st.maxEnergy = Math.max(1, st.maxEnergy + c.maxEnergy);
  ['strength','agility','intellect','charisma'].forEach(k => {
    if (typeof c[k] === 'number') st[k] = Math.max(1, st[k] + c[k]);
  });
  if (c.scene) gameState.scene = c.scene;
  if (c.time) gameState.time = c.time;
  if (c.name) gameState.name = c.name;
  if (Array.isArray(c.inventory_add)) c.inventory_add.forEach(i => { if(!gameState.inventory.includes(i)) gameState.inventory.push(i); });
  if (Array.isArray(c.inventory_remove)) gameState.inventory = gameState.inventory.filter(i => !c.inventory_remove.includes(i));
  if (c.relations) {
    for (const [n, v] of Object.entries(c.relations)) {
      gameState.relations[n] = Math.min(1000, Math.max(0, (gameState.relations[n] || 0) + v));
    }
  }
  if (Array.isArray(c.actors)) gameState.actors = c.actors;
  if (c.relation_tags && typeof c.relation_tags === 'object') {
    for (const [n, tags] of Object.entries(c.relation_tags)) {
      if (Array.isArray(tags)) gameState.relationsTags[n] = tags;
    }
  }
  if (npcProfiles && typeof npcProfiles === 'object') {
    for (const [n, p] of Object.entries(npcProfiles)) {
      if (!gameState.characters[n]) gameState.characters[n] = { name: n };
      Object.assign(gameState.characters[n], p);
    }
  }
  LS.set('mv_state', gameState);
  window.renderStatus();
}

function formatState() {
  const s = gameState, st = s.stats;
  const relStr = Object.entries(s.relations).map(([k,v]) => `${k}(${getRelationLabel(v)} ${v}/1000)`).join('、') || '无';
  return `姓名：${s.name}\n性别：${s.charCard?.gender || '未定'}\n代号：${s.charCard?.codename || '无'}\n身份：${s.charCard?.identity || '未定'}\n当前场景：${s.scene}\n游戏内时间：${s.time}\n在场人物：${(s.actors || ['你']).join('、')}\n生命值：${Math.round(st.hp)}/${st.maxHp}\n能量：${Math.round(st.energy)}/${st.maxEnergy}\n力量：${st.strength} 敏捷：${st.agility} 智力：${st.intellect} 魅力：${st.charisma}\n财产：$${st.money}\n随身物品：${s.inventory.join('、') || '无'}\n人物关系：${relStr}`;
}

function matchWorldbook(text) {
  const wb = worldbooks.find(w => w.id === activeWorldbookId);
  if (!wb) return '（未启用世界书）';
  const hits = [];
  wb.entries.forEach(e => {
    if (!e.enabled) return;
    if (e.constant) { hits.push(e); return; }
    if ((e.keywords || []).some(k => k && text.includes(k.trim()))) hits.push(e);
  });
  return hits.length ? hits.map(e => `【${e.name}】\n${e.content}`).join('\n\n') : '（本次没有触发额外设定）';
}

window.isCheatingAttempt = (text) => {
  const cleanText = text.replace(/\s/g, '');
  const moneyKeys = ['金钱', '钱', '美元', '美金', '金币', '财富'];
  const relationKeys = ['好感', '好感度', '好感增加', '加好感'];
  const attrKeys = ['属性', '生命', '血量', '能量', '力量', '敏捷', '智力', '魅力', '数值'];
  const giveKeys = ['给我', '送我', '奖励我', '增加我的', '给我加', '系统给', '无视规则', '拉满', '加满', '改满', '调满', '修改', '作弊', '开挂', '控制台', '指令', '后台', '管理员', '一键'];

  const hasMoney = moneyKeys.some(k => cleanText.includes(k));
  const hasRelation = relationKeys.some(k => cleanText.includes(k));
  const hasAttr = attrKeys.some(k => cleanText.includes(k));
  const hasGive = giveKeys.some(k => cleanText.includes(k));

  const bracketMatch = text.match(/[\(\[\{【].*?[\)\]\}】]/g);
  let bracketCheat = false;
  if (bracketMatch) {
    for (let b of bracketMatch) {
      if (hasGive ||
          (moneyKeys.some(k => b.includes(k)) && giveKeys.some(k => b.includes(k))) ||
          (relationKeys.some(k => b.includes(k)) && giveKeys.some(k => b.includes(k))) ||
          (attrKeys.some(k => b.includes(k)) && giveKeys.some(k => b.includes(k)))) {
        bracketCheat = true;
      }
    }
  }
  return (hasMoney && hasGive) || (hasRelation && hasGive) || (hasAttr && hasGive) || bracketCheat;
};

window.sendAction = async (text) => {
  if (busy) return;
  busy = true;
  window._busySince = Date.now();
  $('send-btn').disabled = true;
  $('user-input').disabled = true;
  $('options').innerHTML = '';

  window.showLoading();

  try {
    let raw;
    const apiProfile = apiProfiles.find(p => p.id === activeApiProfileId);
    if (!apiProfile || !apiProfile.key) {
      await new Promise(r => setTimeout(r, 800));
      raw = JSON.stringify({
        narration: `[模拟模式] 你刚才说了："${text}"。\n\n去点右上角的 ⚙ 设置填上 API 就能开始真正的冒险了。`,
        state_changes: { energy: -2 },
        options: ["去填写 API", "继续随便按按"]
      });
    } else {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);
      let res;
      try {
        res = await fetch(apiProfile.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiProfile.key },
          body: JSON.stringify({ model: apiProfile.model, messages, temperature: apiProfile.temperature }),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeoutId);
      }
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch(e){}
        throw new Error('HTTP ' + res.status + ' · ' + detail.slice(0, 200));
      }
      const json = await res.json();
      raw = json?.choices?.[0]?.message?.content;
      if (!raw) throw new Error('接口返回格式异常');
    }

    window.hideLoading();
    history.push({ role: 'assistant', content: raw });
    LS.set('mv_history', history);

    let data;
    try {
      let cleanStr = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
      const firstBrace = cleanStr.indexOf('{'), lastBrace = cleanStr.lastIndexOf('}');
      if (firstBrace >= 0 && lastBrace > firstBrace) cleanStr = cleanStr.slice(firstBrace, lastBrace + 1);
      data = JSON.parse(cleanStr);
    } catch(e) {
      data = { narration: raw, state_changes: {}, options: [] };
    }

    window.pushDisplay('assistant', data.narration || data.text || '（无叙述）');

    if (data.state_changes) {
      const sysMsg = [];
      const c = data.state_changes;
      if (c.scene) sysMsg.push(`场景：${c.scene}`);
      if (c.time) sysMsg.push(`时间：${c.time}`);
      if (c.hp) sysMsg.push(`生命：${c.hp > 0 ? '+' : ''}${c.hp}`);
      if (c.energy) sysMsg.push(`能量：${c.energy > 0 ? '+' : ''}${c.energy}`);
      if (c.money) sysMsg.push(`金钱：${c.money > 0 ? '+' : ''}$${c.money}`);
      if (c.inventory_add && c.inventory_add.length) sysMsg.push(`获得：${c.inventory_add.join('、')}`);
      if (c.relations) {
        for (const [k, v] of Object.entries(c.relations)) sysMsg.push(`好感：${k} ${v > 0 ? '+' : ''}${v}`);
      }
      if (sysMsg.length > 0) window.pushDisplay('system', '📌 ' + sysMsg.join(' | '));
    }

    applyStateChanges(data.state_changes, data.npc_profiles);

    if (Array.isArray(data.achievement_add)) {
      data.achievement_add.forEach(a => {
        if (!a || !a.title) return;
        if (!gameState.achievements.find(x => x.title === a.title)) {
          gameState.achievements.push({ title: a.title, desc: a.desc || '', t: Date.now() });
        }
      });
      LS.set('mv_state', gameState);
    }

    window.renderOptions(data.options);
  } catch(err) {
    window.hideLoading();
    window.pushDisplay('system', '⚠ ' + err.message);
    history.pop();
    LS.set('mv_history', history);
  } finally {
    busy = false;
    window._busySince = 0;
    $('send-btn').disabled = false;
    $('user-input').disabled = false;
  }
};

  const modelListDiv = $('model-list');
  modelListDiv.innerHTML = '拉取中...';
  try {
    let baseUrl = url.replace(/\/chat\/completions.*$/, '');

    const models = data.data || data.models || [];
    if (models.length === 0) { modelListDiv.innerHTML = '未找到可用模型'; return; }
    modelListDiv.innerHTML = `找到 ${models.length} 个模型，点击选择：<br>` + models.map(m => `<span class="tag" style="cursor:pointer;" onclick="document.getElementById('cfg-model').value='${m.id}'">${m.id}</span>`).join(' ');

window.renderMusicPlaylist = () => {
  const box = $('music-playlist'); if (!box) return;

  box.innerHTML = playlist.map((item, index) => `
    <div class="playlist-item ${index === currentTrackIndex ? 'active' : ''}" onclick="window.playTrack(${index})">
      <span>${esc(item.name)}</span>
      <span class="delete-btn" onclick="event.stopPropagation(); window.removeMusic(${index})">✕</span>
    </div>
  `).join('');
  if (playlist.length === 0) box.innerHTML = '<div style="font-size:11px;color:var(--text-faint);text-align:center;padding:10px;">歌单为空</div>';
};
window.addMusic = () => {
  const name = $('music-name').value.trim();
  const url = $('music-url').value.trim();
  if (!url) return alert('请输入音乐链接');
  playlist.push({ name: name || '未知歌曲', url });
  LS.set('mv_playlist', playlist);
  $('music-name').value = '';
  $('music-url').value = '';
  if (playlist.length === 1) window.playTrack(0);
  window.renderMusicPlaylist();
};
window.removeMusic = (index) => {
  playlist.splice(index, 1);
  LS.set('mv_playlist', playlist);
  if (currentTrackIndex === index) {
    audio.pause(); currentTrackIndex = -1; isPlaying = false;
    $('music-title').textContent = '暂无播放';
    $('music-play-btn').textContent = '▶';
  } else if (currentTrackIndex > index) currentTrackIndex--;
  window.renderMusicPlaylist();
};
window.playTrack = (index) => {
  if (index < 0 || index >= playlist.length) return;
  currentTrackIndex = index;
  const track = playlist[index];
  audio.src = track.url;
  audio.play().catch(() => window.pushDisplay('system', '⚠ 音乐播放失败'));
  isPlaying = true;
  $('music-title').textContent = track.name;
  $('music-artist').textContent = '播放中...';
  $('music-play-btn').textContent = '⏸';
  window.renderMusicPlaylist();
};
window.togglePlay = () => {
  if (playlist.length === 0) return alert('请先添加音乐');
  if (currentTrackIndex === -1) { window.playTrack(0); return; }
  if (isPlaying) {
    audio.pause(); isPlaying = false;
    $('music-play-btn').textContent = '▶';
    $('music-artist').textContent = '暂停';
  } else {
    audio.play(); isPlaying = true;
    $('music-play-btn').textContent = '⏸';
    $('music-artist').textContent = '播放中...';
  }
};
window.prevTrack = () => { if (playlist.length === 0) return; let i = currentTrackIndex - 1; if (i < 0) i = playlist.length - 1; window.playTrack(i); };
window.nextTrack = () => { if (playlist.length === 0) return; let i = (currentTrackIndex + 1) % playlist.length; window.playTrack(i); };
window.seekMusic = (value) => { if (audio.duration) audio.currentTime = (value / 100) * audio.duration; };
window.setVolume = (value) => { audio.volume = value / 100; };
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    const progress = $('music-progress');
    if (progress && document.activeElement !== progress) progress.value = percent;
    $('music-current').textContent = formatTime(audio.currentTime);
    $('music-duration').textContent = formatTime(audio.duration);
  }
});
audio.addEventListener('ended', () => { window.nextTrack(); });
function formatTime(seconds) {
  if (isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

window.renderBeautifyUI = () => {
  const b = $('ui-brightness'); if (b) b.value = beautifySettings.brightness;
  const vb = $('val-brightness'); if (vb) vb.textContent = beautifySettings.brightness + '%';
  const c = $('ui-contrast'); if (c) c.value = beautifySettings.contrast;
  const vc = $('val-contrast'); if (vc) vc.textContent = beautifySettings.contrast + '%';
  const bl = $('ui-blur'); if (bl) bl.value = beautifySettings.blur;
  const vbl = $('val-blur'); if (vbl) vbl.textContent = beautifySettings.blur + 'px';
  const wp = $('cfg-wallpaper'); if (wp) wp.value = beautifySettings.wallpaper || '';
  applyFilter('brightness', beautifySettings.brightness);
  applyFilter('contrast', beautifySettings.contrast);
  applyFilter('blur', beautifySettings.blur);
  if (beautifySettings.wallpaper) {
    document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(10,15,25,0.85) 0%, rgba(7,10,18,0.97) 80%), url('${beautifySettings.wallpaper}')`;
  }
};
window.applyFilter = (type, value) => {
  if (type === 'brightness') {
    document.documentElement.style.setProperty('--app-brightness', value + '%');
    const el = $('val-brightness'); if (el) el.textContent = value + '%';
    beautifySettings.brightness = parseInt(value);
  } else if (type === 'contrast') {
    document.documentElement.style.setProperty('--app-contrast', value + '%');
    const el = $('val-contrast'); if (el) el.textContent = value + '%';
    beautifySettings.contrast = parseInt(value);
  } else if (type === 'blur') {
    document.documentElement.style.setProperty('--app-blur', value + 'px');
    const el = $('val-blur'); if (el) el.textContent = value + 'px';
    beautifySettings.blur = parseInt(value);

window.loadSave = (id) => {
  if (!confirm('读取此存档？当前未保存的进度会丢失。')) return;
  const s = getSaves().find(x => x.id === id);
  if (!s) { alert('存档不存在。'); return; }
  const d = s.data || {};
  if (d.gameState) gameState = d.gameState;
  if (Array.isArray(d.history)) history = d.history;
  if (Array.isArray(d.displayHistory)) displayHistory = d.displayHistory;
  LS.set('mv_state', gameState);
  LS.set('mv_history', history);
  LS.set('mv_display', displayHistory);
  window.closeModal('modal-settings');
  window.renderStatus();
  window.renderStory();
  alert('已读取：' + s.name);
};

window.exportSave = (id) => {
  const s = getSaves().find(x => x.id === id);
  if (!s) return;
  const data = { type: 'marvel-save', version: 1, name: s.name, subtitle: s.subtitle, ts: s.ts, data: s.data };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'marvel-save-' + s.name.replace(/[\\/:*?"<>|]/g, '_') + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

window.deleteSave = (id) => {
  if (!confirm('确定删除这个存档？')) return;
  setSaves(getSaves().filter(x => x.id !== id));
  window.renderSaveList();
};

window.importSaveFile = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || data.type !== 'marvel-save' || !data.data) { alert('格式错误：不是漫威存档文件。'); return; }
      const saves = getSaves();
      saves.push({
        id: 'save_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        name: (data.name || '导入存档') + ' (导入)',
        subtitle: data.subtitle || '',
        ts: Date.now(),
        data: data.data
      });
      setSaves(saves);
      window.renderSaveList();
      alert('已导入存档。');
    } catch(err) { alert('解析失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

window.redeemCode = () => {
  const input = $('redeem-code-input');
  const status = $('redeem-status');
  if (!input || !status) return;
  const code = input.value.trim();
  if (!code) { status.innerHTML = '<span style="color:var(--danger);">请输入卡密</span>'; return; }

  if (code === '莱茵' || code === '塔斯维尔') {
    if (!gameState.stats) gameState.stats = {};
    let menu = `👑 欢迎回来，开发者！请选择要修改的内容（输入序号）：\n\n` +
               `1. 所有属性拉满 (100)\n` +
               `2. 无限金钱 ($999999)\n` +
               `3. 所有好感度拉满 (1000)\n` +
               `4. 自由修改单项属性\n` +
               `5. 解锁全部物品\n` +
               `6. 取消`;
    let choice = prompt(menu);
    if (!choice) return;
    switch(choice.trim()) {
      case '1':
        ['strength','agility','intellect','charisma'].forEach(k => { gameState.stats[k] = 100; });
        gameState.stats.maxHp = 100; gameState.stats.hp = 100;
        gameState.stats.maxEnergy = 100; gameState.stats.energy = 100;
        window.pushDisplay('system', '👑 管理员操作：所有属性已拉满 (100)');
        break;
      case '2':
        gameState.stats.money = 999999;
        window.pushDisplay('system', '👑 管理员操作：金钱已修改为 $999999');
        break;
      case '3':
        Object.keys(gameState.relations).forEach(k => { gameState.relations[k] = 1000; });
        window.pushDisplay('system', '👑 管理员操作：所有好感度已拉满 (1000)');
        break;
      case '4': {
        let attr = prompt("请输入要修改的属性名（hp, maxHp, energy, maxEnergy, money, strength, agility, intellect, charisma）：");
        if (!attr) return;
        if (gameState.stats[attr] === undefined) { alert("属性不存在！"); return; }
        let val = parseInt(prompt("请输入新的数值："));
        if (isNaN(val)) { alert("请输入数字！"); return; }
        gameState.stats[attr] = val;
        window.pushDisplay('system', `👑 管理员操作：属性【${attr}】已修改为 ${val}`);
        break;
      }
      case '5':
        gameState.inventory = ['振金盾牌', '雷神之锤', '纳米战甲', '无限手套', '方舟反应炉'];
        window.pushDisplay('system', '👑 管理员操作：已解锁全套神装');
        break;
      default: return;
    }
    LS.set('mv_state', gameState);
    window.renderStatus();
    window.renderCharSidebar();
    input.value = '';
    status.innerHTML = '<span style="color:var(--success);">✅ 开发者特权已执行！</span>';
    return;
  }

  if (!gameState.usedCodes) gameState.usedCodes = [];
  if (gameState.usedCodes.includes(code)) {
    status.innerHTML = '<span style="color:var(--danger);">❌ 该卡密已被使用过</span>';
    return;
  }

  if (REDEEM_CODES[code]) {
    const reward = REDEEM_CODES[code];
    gameState.stats.money += reward.money;
    gameState.usedCodes.push(code);
    LS.set('mv_state', gameState);
    window.renderStatus();
    status.innerHTML = `<span style="color:var(--success);">✅ 兑换成功！获得 $${reward.money}（${reward.desc}）</span>`;
    input.value = '';
    window.pushDisplay('system', `🎁 系统提示：成功使用兑换码【${code}】，获得 $${reward.money}！`);
    return;
  }

  status.innerHTML = '<span style="color:var(--danger);">❌ 无效的卡密</span>';
};

            <span style="font-size:11px;color:var(--text-dim);">(${items.length})</span>
          </div>
          <span style="color:var(--text-dim);font-size:11px;transition:transform 0.2s;transform:rotate(${isOpen ? 90 : 0}deg);">▶</span>
        </div>
        ${isOpen ? `<div style="padding:10px;">${items.map(it => {
          const canAfford = money >= it.price;
          return `

                <div style="font-size:12px;color:${canAfford ? 'var(--accent-gold)' : 'var(--danger)'};margin-top:4px;font-weight:600;">$${it.price.toLocaleString()}</div>
              </div>
              <button class="${canAfford ? 'primary' : ''}" style="padding:6px 12px;font-size:11px;flex-shrink:0;" ${canAfford ? '' : 'disabled'} onclick="window.buyShopItem(${cIdx}, '${esc(it.name).replace(/'/g, "\\'")}')">${canAfford ? '购买' : '缺钱'}</button>

        }).join('')}</div>` : ''}

window.buyShopItem = (catIdx, itemName) => {
  const cat = gameState.shops[catIdx];
  if (!cat) return;
  const item = cat.items.find(x => x.name === itemName);
  if (!item) return;
  if (gameState.stats.money < item.price) return alert('金钱不够！');

  gameState.stats.money -= item.price;

  if (item.effect) {
    const st = gameState.stats;
    if (item.effect.hp) st.hp = Math.min(st.maxHp, st.hp + item.effect.hp);
    if (item.effect.energy) st.energy = Math.min(st.maxEnergy, st.energy + item.effect.energy);
    if (item.effect.strength) st.strength = Math.max(1, st.strength + item.effect.strength);
    if (item.effect.agility) st.agility = Math.max(1, st.agility + item.effect.agility);
    if (item.effect.intellect) st.intellect = Math.max(1, st.intellect + item.effect.intellect);
    if (item.effect.charisma) st.charisma = Math.max(1, st.charisma + item.effect.charisma);
  }

  if (!gameState.inventory.includes(item.name)) gameState.inventory.push(item.name);
  cat.items = cat.items.filter(x => x.name !== itemName);

  LS.set('mv_state', gameState);
  window.renderShop();
  window.renderStatus();
  window.pushDisplay('system', `✅ 购买了【${item.name}】，花费 $${item.price.toLocaleString()}`);
};

window.refreshShop = () => {
  const currentDate = (gameState.time || '').split('·')[0].trim();
  if (gameState.lastShopRefreshDate !== currentDate) {
    gameState.shopRefreshCount = 5;
    gameState.lastShopRefreshDate = currentDate;
  }
  if (gameState.shopRefreshCount <= 0) {
    return alert('今天的刷新次数已用完（每天最多 5 次）。');
  }
  if (gameState.stats.money < 10) {
    return alert('金钱不够！刷新商店需要 $10。');
  }

  gameState.stats.money -= 10;
  gameState.shopRefreshCount--;

  gameState.shops = JSON.parse(JSON.stringify(SHOP_DATA));

  LS.set('mv_state', gameState);
  window.renderShop();
  window.renderStatus();
  window.pushDisplay('system', `🔄 商店已刷新，花费 $10。今日剩余 ${gameState.shopRefreshCount} 次`);
};

let ccCreateStep = 'timeline';
let ccCreateData = {};

window.openCreateModal = () => {
  ccCreateData = {};
  if (gameState.charCard && gameState.charCard.created) {
    ccCreateData.timeline = gameState.charCard.timeline || 'modern';
    ccCreateData.identityType = gameState.charCard.identityType || 'hero';
    ccCreateStep = 'form';
  } else {
    ccCreateStep = 'timeline';
  }
  $('cc-create-title').textContent = '📝 建立/修改档案';
  renderCreateStep();
  window.openModal('modal-create');
};

function renderCreateStep() {
  const box = $('cc-create-body');
  if (!box) return;

  if (ccCreateStep === 'timeline') {
    box.innerHTML = `
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;line-height:1.6;">

        <button onclick="window.ccPickTimeline('${t.id}')" style="width:100%;text-align:left;padding:14px;background:var(--bg-light);border:1px solid var(--border-dim);border-radius:12px;cursor:pointer;margin-bottom:10px;">
          <div style="font-size:14px;color:var(--accent);font-weight:600;">${t.name}</div>
          <div style="font-size:11px;color:var(--text-dim);margin:4px 0 6px;">${t.range}</div>
          <div style="font-size:12px;color:var(--text-main);line-height:1.5;">${t.desc}</div>
        </button>
      `).join('')}
    `;
    return;
  }

  if (ccCreateStep === 'identity') {
    const tl = TIMELINES.find(t => t.id === ccCreateData.timeline);
    box.innerHTML = `
      <div style="font-size:12px;color:var(--accent-cyan);margin-bottom:6px;">时代：${tl.name} · ${tl.range}</div>

          <div style="font-size:24px;margin-bottom:8px;">🦸</div>
          <div style="font-size:14px;color:var(--accent);font-weight:600;">英雄 / 觉醒者</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">拥有超能力或顶尖装备</div>
        </button>
        <button onclick="window.ccPickIdentity('civilian')" style="padding:20px 10px;background:var(--bg-light);border:1px solid var(--border-dim);border-radius:12px;cursor:pointer;">
          <div style="font-size:24px;margin-bottom:8px;">👤</div>
          <div style="font-size:14px;color:var(--accent);font-weight:600;">普通人 / 特工</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">没有超能力，靠智慧与勇气</div>
        </button>
      </div>
      <button onclick="window.ccCreateBack()" style="width:100%;margin-top:14px;padding:8px;font-size:12px;">← 返回选择时代</button>
    `;
    return;
  }

  if (ccCreateStep === 'form') {
    const tl = TIMELINES.find(t => t.id === ccCreateData.timeline);
    const isHero = ccCreateData.identityType === 'hero';

    box.innerHTML = `
      <div style="font-size:11px;color:var(--accent-cyan);margin-bottom:10px;">
        ${tl.name} · ${isHero ? '英雄 / 觉醒者' : '普通人 / 特工'}
      </div>

      <div class="field"><label>姓名</label><input id="cc-cr-name" placeholder="真实姓名" value="${esc(c.name || '')}"></div>
      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>性别</label><input id="cc-cr-gender" placeholder="男 / 女 / 其他" value="${esc(c.gender || '')}"></div>
        <div style="flex:1;"><label>代号 / 英雄名</label><input id="cc-cr-codename" placeholder="可空" value="${esc(c.codename || '')}"></div>
      </div>

      <div class="field"><label>能力 / 超能力</label><input id="cc-cr-power" placeholder="如：超级力量 / 魔法 / 无" value="${esc(c.power || '')}"></div>
      <div class="field"><label>所属组织</label><input id="cc-cr-affiliation" placeholder="如：复仇者联盟 / 神盾局 / 无" value="${esc(c.affiliation || '')}"></div>

      <div class="field" style="display:flex;gap:6px;">

      </div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>出生年份（${birthHint}）</label><input id="cc-cr-birthyear" type="number" placeholder="${tl.birthRange[0]}" value="${esc(c.birthYear || '')}"></div>
        <div style="flex:1;"><label>生日（月-日）</label><input id="cc-cr-birthday" placeholder="03-15" value="${esc(c.birthday || '')}"></div>
      </div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>MBTI</label><input id="cc-cr-mbti" placeholder="INTJ" value="${esc(c.mbti || '')}"></div>
        <div style="flex:1;"><label>星座</label><input id="cc-cr-zodiac" placeholder="双鱼座" value="${esc(c.zodiac || '')}"></div>
      </div>

      <div class="field"><label>身高</label><input id="cc-cr-height" placeholder="175cm" value="${esc(c.height || '')}"></div>
      <div class="field"><label>外貌</label><textarea id="cc-cr-appearance" rows="2" placeholder="发色、瞳色、体态、特殊特征">${esc(c.appearance || '')}</textarea></div>

      ${!isHero ? `
        <div class="field"><label>职业</label>
          <select id="cc-cr-occupation" style="width:100%;">
            <option value="">请选择</option>
            ${OCCUPATIONS.map(o => `<option ${c.occupation===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      ` : ''}

      <div style="display:flex;gap:6px;margin-top:10px;">
        <button onclick="window.ccCreateBack()" style="flex:1;padding:10px;">← 返回</button>
        <button class="primary" onclick="window.ccConfirmCreate()" style="flex:2;padding:10px;">保存档案</button>
      </div>
    `;
    return;
  }
}

window.ccPickTimeline = (id) => { ccCreateData.timeline = id; ccCreateStep = 'identity'; renderCreateStep(); };
window.ccPickIdentity = (type) => { ccCreateData.identityType = type; ccCreateStep = 'form'; renderCreateStep(); };
window.ccCreateBack = () => {
  if (gameState.charCard && gameState.charCard.created) {
    window.closeModal('modal-create');
    return;
  }
  if (ccCreateStep === 'form') ccCreateStep = 'identity';
  else if (ccCreateStep === 'identity') ccCreateStep = 'timeline';
  renderCreateStep();
};

function ccGetCurrentYear() {
  if (gameState.time) { const m = gameState.time.match(/(\d{4})/); if (m) return parseInt(m[1]); }
  return 2012;
}

function getRelationLabel(v) {
  v = Number(v) || 0;
  if (v < 150) return '陌生人';
  if (v < 260) return '朋友';
  if (v < 500) return '好友';
  if (v < 700) return '挚友';
  if (v < 800) return '暧昧';
  if (v < 900) return '恋人';
  return '灵魂伴侣';
}

      <div class="cc-sec-body">
        ${row('能力', c.power)}
        ${row('所属组织', c.affiliation)}
        ${row('职业', c.occupation)}
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>🧬 性格 & 外貌</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        ${row('MBTI', c.mbti)}
        ${row('星座', c.zodiac)}
        ${row('身高', c.height)}
        ${row('外貌', c.appearance)}
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>🎒 物品</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">${gameState.inventory.length ? gameState.inventory.map(i => `<span class="tag">${esc(i)}</span>`).join('') : '<div style="color:var(--text-faint);font-size:11px;">空空如也</div>'}</div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>💗 状态</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        <div class="bar-row"><div class="bar-label"><span>生命值</span><span>${Math.round(st.hp)}/${st.maxHp}</span></div><div class="bar hp"><i style="width:${clamp(st.hp/st.maxHp*100,0,100)}%"></i></div></div>
        <div class="bar-row"><div class="bar-label"><span>能量</span><span>${Math.round(st.energy)}/${st.maxEnergy}</span></div><div class="bar energy"><i style="width:${clamp(st.energy/st.maxEnergy*100,0,100)}%"></i></div></div>
        ${row('力量', st.strength)}
        ${row('敏捷', st.agility)}
        ${row('智力', st.intellect)}
        ${row('魅力', st.charisma)}
        ${row('金钱', '$' + (st.money || 0))}
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>👥 人物关系</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">${Object.keys(gameState.relations).length ? Object.entries(gameState.relations).map(([k,v]) => {
        const label = getRelationLabel(v);
        const tags = (gameState.relationsTags && gameState.relationsTags[k]) ? ` [${gameState.relationsTags[k].join('·')}]` : '';
        return `<div class="rel" style="cursor:pointer;" onclick="window.openNpcDetail('${esc(k)}')">
          <span>${esc(k)} / ${label}${tags}</span>
          <span class="v ${v>=0?'pos':'neg'}">(${v}/1000)</span>
        </div>`;
      }).join('') : '<div style="color:var(--text-faint);font-size:11px;">还没有结识任何人</div>'}</div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>🏆 成就</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">${(gameState.achievements || []).length ? gameState.achievements.map(a => `
        <div class="cc-row" style="flex-direction:column;align-items:stretch;">
          <div style="font-size:12px;color:var(--accent-cyan);font-weight:600;">${esc(a.title)}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${esc(a.desc || '')}</div>
        </div>
      `).join('') : '<div style="color:var(--text-faint);font-size:11px;">还没有获得成就</div>'}</div>
    </div>
  `;
};

// ==================== 确认建档 ====================
window.ccConfirmCreate = () => {
  const c = gameState.charCard;
  const tl = TIMELINES.find(t => t.id === ccCreateData.timeline);
  const isHero = ccCreateData.identityType === 'hero';
  const isEdit = c.created;

  c.timeline = ccCreateData.timeline;
  c.identityType = ccCreateData.identityType;
  c.name = $('cc-cr-name').value.trim() || '未命名';
  c.gender = $('cc-cr-gender').value.trim();
  c.codename = $('cc-cr-codename').value.trim();
  c.power = $('cc-cr-power').value.trim();
  c.affiliation = $('cc-cr-affiliation').value.trim();
  c.blood = $('cc-cr-blood').value.trim();
  c.family = $('cc-cr-family').value.trim();
  c.birthYear = $('cc-cr-birthyear').value.trim();
  c.birthday = $('cc-cr-birthday').value.trim();
  c.mbti = $('cc-cr-mbti').value.trim();
  c.zodiac = $('cc-cr-zodiac').value.trim();
  c.height = $('cc-cr-height').value.trim();
  c.appearance = $('cc-cr-appearance').value.trim();

  if (!isHero) {
    const occEl = $('cc-cr-occupation');
    c.occupation = occEl ? occEl.value : '';
  } else {
    c.occupation = '';
  }

  if (!isEdit) {
    const by = parseInt(c.birthYear);
    const midYear = Math.floor((tl.birthRange[0] + tl.birthRange[1]) / 2) + 25;
    const year = by ? (by + 25) : midYear;
    gameState.time = year + '年 · 白天';
    gameState.scene = '纽约 · 曼哈顿';
    gameState.stats.money = 1000;
  }

  c.created = true;
  gameState.name = c.name;
  gameState.timeline = c.timeline;

  LS.set('mv_state', gameState);
  window.closeModal('modal-create');
  window.renderStatus();
  window.renderCharSidebar();

  if (isEdit) {
    window.pushDisplay('system', '📝 角色档案已成功更新！');
  } else {
    const opening = isHero
      ? `（游戏开始）我的角色是 ${c.name}${c.codename ? '（代号' + c.codename + '）' : ''}，一名${tl.name}的${c.power || '觉醒者'}。请根据这个时代的背景，描述我能力觉醒后的开场。注意：绝对不许出现不属于这个时代的人或物！`
      : `（游戏开始）我的角色是 ${c.name}，一名生活在${tl.name}的${c.occupation || '普通人'}。请根据这个时代的背景，描述我日常生活的开场。注意：绝对不许出现不属于这个时代的人或物！`;
    window.sendAction(opening);
  }
};

// ==================== NPC 档案弹窗 ====================
window.openNpcDetail = (name) => {
  if (!gameState.characters[name]) {
    gameState.characters[name] = {
      name, gender: '待补充', age: '待补充', identity: '待补充',
      outfit: '待补充', opinion: '暂时还没有深入了解，不知全貌。', otherRelations: '暂无信息'
    };
  }
  const c = gameState.characters[name];
  const affinity = gameState.relations[name] || 0;
  const level = getRelationLabel(affinity);
  const tags = (gameState.relationsTags && gameState.relationsTags[name]) ? gameState.relationsTags[name].join(' · ') : '无特殊关系';

  alert(
    `【${c.name}】\n` +
    `性别：${c.gender}\n` +
    `年岁：${c.age}\n` +
    `身份：${c.identity}\n` +
    `衣着：${c.outfit}\n` +
    `关系：${level}（${affinity}/1000）${tags !== '无特殊关系' ? ' · ' + tags : ''}\n\n` +
    `对{{user}}的看法：\n${c.opinion}\n\n` +
    `与其他人关系：\n${c.otherRelations}`
  );
};

// ==================== 开场动画 ====================
const INTRO_SCRIPT = [
  { t: '世界正在改变。', pause: 900 },
  { t: '而你，站在十字路口。', pause: 1400 },
  { t: '\n钢铁、魔法、基因、宇宙——', pause: 1000 },
  { t: '无数条道路在你面前展开。', pause: 1600 },
  { t: '\n\n选择你的时代，', pause: 1000 },
  { t: '选择你的身份，', pause: 900 },
  { t: '选择你要成为的那个人。', pause: 1800 },
  { t: '\n\n然后，睁开眼。', pause: 1500 }
];

let introAnimTimers = [];
let introAnimRunning = false;

window.playIntroAnim = () => {
  const wrap = $('intro-anim');
  const textEl = $('intro-text');
  const enterBtn = $('intro-enter');
  if (!wrap || !textEl) return;

  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  textEl.textContent = '';
  enterBtn.classList.remove('show');
  wrap.classList.add('show');
  introAnimRunning = true;

  let accumulated = '';
  let totalDelay = 0;

  INTRO_SCRIPT.forEach((line) => {
    const chars = line.t.split('');
    chars.forEach((ch, i) => {
      const delay = totalDelay + i * 85;
      introAnimTimers.push(setTimeout(() => {
        if (!introAnimRunning) return;
        accumulated += ch;
        textEl.innerHTML = esc(accumulated) + '<span class="cursor"></span>';
      }, delay));
    });
    totalDelay += chars.length * 85 + line.pause;
  });

  introAnimTimers.push(setTimeout(() => {
    if (!introAnimRunning) return;
    enterBtn.classList.add('show');
  }, totalDelay + 400));
};

window.skipIntroAnim = () => {
  introAnimRunning = false;
  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  window.finishIntroAnim();
};

window.finishIntroAnim = () => {
  introAnimRunning = false;
  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  const wrap = $('intro-anim');
  if (wrap) {
    wrap.style.transition = 'opacity 1.2s ease';
    wrap.style.opacity = '0';
    setTimeout(() => {
      wrap.classList.remove('show');
      wrap.style.opacity = '';
      wrap.style.transition = '';
      if (!gameState.charCard.created) window.openCreateModal();
    }, 1200);
  }
};

// ==================== 重开与初始化 ====================
window.resetGame = () => {
  if (!confirm('确定要清空进度重新开始吗？（API、世界书、预设都将保留）')) return;
  gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
  gameState.charCard = JSON.parse(JSON.stringify(DEFAULT_CHARCARD));
  history = [];
  displayHistory = [];
  LS.set('mv_state', gameState);
  LS.set('mv_history', history);
  LS.set('mv_display', displayHistory);
  window.closeModal('modal-settings');
  window.renderStatus();
  window.renderStory();
  window.renderOptions([]);
  window.openCreateModal();
};

window.addEventListener('DOMContentLoaded', () => {
  try {
    window.renderStatus();
    window.renderStory();

    if (beautifySettings.wallpaper) {
      document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(10,15,25,0.85) 0%, rgba(7,10,18,0.97) 80%), url('${beautifySettings.wallpaper}')`;
    }
    document.documentElement.style.setProperty('--app-brightness', beautifySettings.brightness + '%');
    document.documentElement.style.setProperty('--app-contrast', beautifySettings.contrast + '%');
    document.documentElement.style.setProperty('--app-blur', beautifySettings.blur + 'px');

    audio.volume = 1.0;

    if (displayHistory.length === 0) {
      if (!gameState.charCard.created) {
        window.playIntroAnim();
      } else {
        window.pushDisplay('system', '👋 欢迎回来。在下方输入框写下你的行动。');
      }
    }

    const ta = $('user-input');
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        window.onSend();
      }
    });

    if (!document.getElementById('cc-sidebar-photo')) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.id = 'cc-sidebar-photo';
      inp.style.display = 'none';
      inp.onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
          gameState.charCard.photo = ev.target.result;
          LS.set('mv_state', gameState);
          window.renderCharSidebar();
        };
        r.readAsDataURL(f);
      };
      document.body.appendChild(inp);
    }
  } catch (err) {
    console.error("初始化失败:", err);
  }
});

window.onerror = function(msg, url, line) {
  console.error("❌ 错误: " + msg + " | 行号: " + line);
  // 不 return false，让浏览器也记录
};
</script>
