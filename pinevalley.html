<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Pine Valley · 2015</title>
<style>
:root{
  --bg:#0a0a0a; --panel:#141414; --panel2:#1c1c1c; --border:#262626;
  --text:#e5e5e5; --muted:#808080; --accent:#7fff9e; --accent2:#8ea6ff;
  --danger:#ff5a6e; --gold:#e6c760; --link:#7ac0ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px;line-height:1.6;}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:6px;
  transition:.15s;touch-action:manipulation;}
button:active{transform:scale(.97);}
button.primary{background:linear-gradient(135deg,#2e6b3f,#1a4527);border-color:#3a8f52;color:#c8ffd6;font-weight:700;}
button.danger{border-color:#5a2a35;color:var(--danger);}
input,textarea{font-family:inherit;font-size:14px;background:#0d0d0d;color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:9px 12px;outline:none;width:100%;}
input:focus,textarea:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== 开场动画 ===== */
#intro{position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;}
#intro.hide{display:none;}
#intro .glitch{font-size:30px;color:var(--accent);letter-spacing:8px;text-shadow:0 0 10px var(--accent);}
#intro .sub{font-size:11px;color:#555;margin-top:16px;letter-spacing:4px;}
#intro .loading{margin-top:40px;width:260px;height:3px;background:#111;border:1px solid #222;overflow:hidden;}
#intro .loading::after{content:'';display:block;height:100%;width:0;background:var(--accent);animation:load 1.6s linear forwards;}
@keyframes load{to{width:100%;}}
#intro .log{margin-top:24px;font-size:10px;color:#444;height:100px;width:280px;overflow:hidden;font-family:'Courier New',monospace;}
#intro .log div{opacity:0;transition:opacity .2s;}

/* ===== 建档 ===== */
#create{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1800;display:none;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
#create.show{display:flex;}
#create .box{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:22px;position:relative;}
#create .box::before{content:'>> 新用户注册 <<';position:absolute;top:-10px;left:18px;
  background:var(--bg);padding:0 8px;font-size:11px;color:var(--accent);letter-spacing:2px;}
#create h2{font-size:15px;color:var(--accent);margin-bottom:6px;letter-spacing:2px;}
#create .tip{font-size:11px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
#create .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:1px;}
.field .hint{font-size:10px;color:#444;margin-top:4px;}

/* ===== 顶栏 ===== */
#top-bar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#0d0d0d;border-bottom:1px solid var(--border);z-index:100;min-height:48px;}
#top-bar .menu-btn{font-size:20px;padding:4px 10px;background:transparent;border:none;color:var(--accent);}
#top-bar .brand{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:2px;}
#top-bar .meta{margin-left:auto;font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center;}
#top-bar .meta b{color:var(--accent2);font-weight:400;}
#top-bar .cfg-btn{padding:5px 10px;font-size:14px;background:transparent;border:1px solid var(--border);color:var(--text);}

/* ===== 主布局：全屏对话 ===== */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#chat-wrapper{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;}

/* 消息（酒馆兼容 class） */
.mes{display:flex;flex-direction:column;width:100%;}
.mes[is_user="true"]{align-items:flex-end;}
.mes[is_user="false"]{align-items:flex-start;}
.mes_block{max-width:88%;background:#141414;border:1px solid #222;border-radius:8px;padding:11px 14px;position:relative;}
.mes[is_user="true"] .mes_block{background:linear-gradient(135deg,#1a3a25,#0f2418);border-color:#2a5038;}
.mes[is_user="false"] .mes_block{background:#141414;border-color:#222;border-left:3px solid var(--accent);}
.ch_name{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;}
.name_text{font-size:11px;color:var(--accent2);font-weight:700;letter-spacing:1px;}
.mes[is_user="true"] .name_text{color:#c8ffd6;}
.timestamp{font-size:10px;color:var(--muted);}
.mes_text{font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--text);}
.mes.system{align-items:center;}
.mes.system .mes_block{background:#0d0d0d;border-color:#1a1a1a;border-style:dashed;
  color:var(--muted);font-size:11px;padding:6px 14px;border-radius:20px;text-align:center;max-width:90%;}
.mes.thinking .mes_block{color:var(--muted);font-style:italic;}
.dots{display:inline-flex;gap:3px;align-items:center;}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:bt 1.2s infinite;}
.dots i:nth-child(2){animation-delay:.15s;}
.dots i:nth-child(3){animation-delay:.3s;}
@keyframes bt{0%,60%,100%{opacity:.2;}30%{opacity:1;}}

/* 输入栏（酒馆兼容 ID） */
#send_form{flex-shrink:0;display:flex;gap:8px;padding:10px 12px 14px;background:#0d0d0d;
  border-top:1px solid var(--border);align-items:flex-end;}
#send_textarea{flex:1;min-height:42px;max-height:140px;resize:none;padding:10px 14px;
  line-height:1.5;font-size:14px;background:#141414;border:1px solid var(--border);border-radius:20px;}
#send_but{padding:0 20px;height:42px;flex-shrink:0;border-radius:20px;font-weight:700;}

/* ===== 侧栏抽屉 ===== */
#sidebar{position:absolute;top:0;bottom:0;left:0;width:280px;background:#0d0d0d;
  border-right:1px solid var(--border);overflow-y:auto;z-index:200;
  transform:translateX(-100%);transition:transform .25s ease;box-shadow:8px 0 30px rgba(0,0,0,.7);}
#sidebar.open{transform:translateX(0);}
#sideMask{display:none;position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:190;}
#sideMask.show{display:block;}

.side-head{padding:14px;border-bottom:1px solid var(--border);background:#0a0a0a;position:sticky;top:0;z-index:2;}
.side-head .nm{font-size:15px;color:var(--accent);font-weight:700;}
.side-head .sub{font-size:11px;color:var(--muted);margin-top:3px;}
.side-body{padding:12px;}
.side-sec{margin-bottom:16px;}
.side-sec h4{font-size:10px;color:var(--accent2);letter-spacing:2px;margin-bottom:8px;
  padding-bottom:4px;border-bottom:1px dashed #222;}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;gap:8px;}
.kv .k{color:var(--muted);flex-shrink:0;}
.kv .v{color:var(--text);text-align:right;word-break:break-all;}
.bar-row{margin:8px 0;}
.bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;}
.bar-label b{color:var(--text);font-weight:400;}
.bar{height:5px;background:#0a0a0a;border-radius:3px;overflow:hidden;}
.bar>i{display:block;height:100%;transition:width .5s;}
.bar.stam>i{background:linear-gradient(90deg,#1a8f4a,#4ee87a);}
.bar.ins>i{background:linear-gradient(90deg,#5a3fb8,#a88aff);}
.bar.susp>i{background:linear-gradient(90deg,#8f2a35,#ff5a6e);}

.fn-list{display:flex;flex-direction:column;gap:6px;}
.fn-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#141414;
  border:1px solid #222;border-radius:6px;color:var(--text);text-align:left;font-size:13px;position:relative;}
.fn-btn:active{background:#1c1c1c;}
.fn-btn .ic{font-size:16px;width:22px;text-align:center;}
.fn-btn .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:700;}

/* ===== 全屏面板 ===== */
.panel{position:fixed;inset:0;background:var(--bg);z-index:1500;display:none;flex-direction:column;}
.panel.show{display:flex;}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0d0d0d;
  border-bottom:1px solid var(--border);flex-shrink:0;}
.panel-head .close{font-size:16px;padding:5px 12px;color:var(--accent);cursor:pointer;
  background:transparent;border:1px solid var(--border);border-radius:6px;}
.panel-head h2{font-size:14px;color:var(--accent);letter-spacing:2px;flex:1;}
.panel-body{flex:1;overflow-y:auto;padding:14px;}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1600;display:none;
  align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;
  max-width:540px;max-height:92vh;display:flex;flex-direction:column;}
.modal-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:8px;}
.modal-head h3{font-size:13px;color:var(--accent);letter-spacing:2px;}
.modal-body{padding:14px;overflow-y:auto;flex:1;}

/* ===== 通用小组件 ===== */
.chat-item{display:flex;gap:10px;padding:11px;border-bottom:1px solid #141414;cursor:pointer;align-items:center;}
.chat-item:active{background:#141414;}
.chat-item .av{width:44px;height:44px;border-radius:8px;background:#1c1c1c;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);
  flex-shrink:0;border:1px solid #2a2a2a;}
.chat-item .info{flex:1;min-width:0;}
.chat-item .info .nm{font-size:13px;color:var(--accent2);font-weight:700;}
.chat-item .info .pv{font-size:11px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

.forum-post{background:#141414;border:1px solid #222;border-radius:6px;padding:11px;margin-bottom:8px;cursor:pointer;}
.forum-post:active{background:#1c1c1c;}
.forum-post .pt{font-size:13px;color:var(--link);font-weight:700;margin-bottom:5px;}
.forum-post .pm{font-size:10px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.forum-post .pv{font-size:12px;color:#aaa;margin-top:6px;line-height:1.5;}
.reply{background:#0d0d0d;border-left:2px solid var(--accent2);padding:8px 10px;margin-bottom:6px;
  font-size:12px;line-height:1.6;border-radius:0 4px 4px 0;}
.reply .rn{color:var(--accent);font-weight:700;font-size:11px;}
.reply .rc{color:var(--text);margin-top:3px;}

.char-card{background:#141414;border:1px solid #222;border-radius:8px;padding:14px;margin-bottom:10px;}
.char-card .cc-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.char-card .cc-av{width:50px;height:50px;border-radius:8px;background:#1c1c1c;
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);
  border:1px solid #2a2a2a;flex-shrink:0;}
.char-card .cc-name{font-size:14px;color:var(--accent);font-weight:700;}
.char-card .cc-tag{font-size:10px;color:var(--muted);margin-top:3px;}
.char-card .cc-sec{margin-top:10px;padding-top:10px;border-top:1px dashed #222;}
.char-card .cc-sec .lbl{font-size:10px;color:var(--accent2);letter-spacing:1.5px;margin-bottom:5px;}
.char-card .cc-sec .txt{font-size:12px;color:#aaa;line-height:1.6;}

.clue{background:#141414;border:1px solid #222;border-left:3px solid var(--gold);
  border-radius:6px;padding:11px;margin-bottom:8px;}
.clue .ct{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:5px;}
.clue .cc{font-size:12px;color:#aaa;line-height:1.6;}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:40px 10px;line-height:1.8;}

.preset-item{background:#141414;border:1px solid #222;border-radius:8px;padding:12px;margin-bottom:10px;}
.preset-item.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(127,255,158,.2) inset;}
.preset-group{font-size:10px;color:var(--muted);letter-spacing:2px;margin:14px 0 8px;}
.preset-group:first-child{margin-top:0;}

/* 移动端：消息占满 */
@media (max-width:520px){
  .mes_block{max-width:92%;}
  #chat{padding:12px 10px;gap:12px;}
}
</style>
</head>
<body>
<!-- 开场动画 -->
<div id="intro">
  <div class="glitch">松 林 谷</div>
  <div class="sub">PINE VALLEY · 2015</div>
  <div class="loading"></div>
  <div class="log" id="introLog"></div>
</div>

<!-- 建档 -->
<div id="create">
  <div class="box">
    <h2>新用户注册</h2>
    <div class="tip">检测到新设备接入松林谷留言板。<br>请先登记你的基本信息，系统将为你建立档案。</div>
    <div class="field">
      <label>姓名</label>
      <input id="cr-name" placeholder="你叫什么？" maxlength="12">
    </div>
    <div class="row">
      <div class="field">
        <label>性别</label>
        <input id="cr-gender" placeholder="男 / 女 / 其他" maxlength="8">
      </div>
      <div class="field">
        <label>年龄</label>
        <input id="cr-age" type="number" placeholder="16" min="10" max="30">
      </div>
    </div>
    <div class="field">
      <label>外貌特征</label>
      <input id="cr-appearance" placeholder="发色、身高、明显特征..." maxlength="40">
    </div>
    <div class="field">
      <label>当前穿着</label>
      <input id="cr-outfit" placeholder="破洞牛仔裤、黑卫衣..." maxlength="40">
    </div>
    <div class="field">
      <label>你来松林谷的原因</label>
      <input id="cr-reason" placeholder="转学 / 找亲戚 / 查一件事..." maxlength="40">
    </div>
    <button class="primary" style="width:100%;padding:12px;margin-top:8px;font-size:14px;" onclick="confirmCreate()">建档进入</button>
  </div>
</div>

<div id="app">

  <!-- 顶栏（酒馆风格） -->
  <div id="top-bar">
    <button class="menu-btn" onclick="openSide()">☰</button>
    <div class="brand">PINE VALLEY</div>
    <div class="meta">
      <span>DAY <b id="tDay">1</b></span>
      <span id="tTime">上午</span>
      <span>$<b id="tMoney">50</b></span>
    </div>
    <button class="cfg-btn" onclick="openModal('modal-api')">⚙</button>
  </div>

  <!-- 主区域 -->
  <div id="main">

    <div id="sideMask" onclick="closeSide()"></div>

    <!-- 左侧栏（全功能） -->
    <aside id="sidebar"></aside>

    <!-- 主对话流（酒馆风格） -->
    <div id="chat-wrapper">
      <div id="chat"></div>
      <div id="send_form">
        <textarea id="send_textarea" placeholder="输入你的行动或对话...（Enter 发送 / Shift+Enter 换行）" rows="1"></textarea>
        <button class="primary" id="send_but" onclick="sendChat()">发送</button>
      </div>
    </div>

  </div>
</div>

<!-- ============ 全屏面板：短信列表 ============ -->
<div class="panel" id="panel-sms">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-sms')">◂</button>
    <h2>短信</h2>
  </div>
  <div class="panel-body" id="sms-body"></div>
</div>

<!-- 短信对话 -->
<div class="panel" id="panel-chat">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-chat')">◂</button>
    <h2 id="chat-title">短信</h2>
  </div>
  <div class="panel-body" style="display:flex;flex-direction:column;">
    <div id="sms-stream" style="flex:1;display:flex;flex-direction:column;gap:8px;"></div>
    <div style="display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--bg);padding-top:10px;">
      <input id="smsInput" placeholder="发送消息..." style="flex:1;">
      <button class="primary" onclick="sendSMS()">发送</button>
    </div>
  </div>
</div>

<!-- 论坛 -->
<div class="panel" id="panel-forum">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-forum')">◂</button>
    <h2>PINE VALLEY BBS</h2>
    <button class="primary" style="padding:6px 12px;font-size:11px;" onclick="newPost()">+发帖</button>
  </div>
  <div class="panel-body" id="forum-body"></div>
</div>

<!-- 帖子详情 -->
<div class="panel" id="panel-thread">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-thread')">◂</button>
    <h2 style="font-size:12px;" id="thread-title">帖子</h2>
  </div>
  <div class="panel-body" id="thread-body"></div>
</div>

<!-- 角色卡 -->
<div class="panel" id="panel-chars">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-chars')">◂</button>
    <h2>角色档案</h2>
  </div>
  <div class="panel-body" id="chars-body"></div>
</div>

<!-- 角色详情 -->
<div class="panel" id="panel-char">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-char')">◂</button>
    <h2 id="char-title">角色</h2>
  </div>
  <div class="panel-body" id="char-body"></div>
</div>

<!-- 线索板 -->
<div class="panel" id="panel-clues">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-clues')">◂</button>
    <h2>线索板</h2>
  </div>
  <div class="panel-body" id="clues-body"></div>
</div>

<!-- 地图 -->
<div class="panel" id="panel-map">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-map')">◂</button>
    <h2>松林谷地图</h2>
  </div>
  <div class="panel-body" id="map-body"></div>
</div>

<!-- 日记 -->
<div class="panel" id="panel-diary">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-diary')">◂</button>
    <h2>日记</h2>
  </div>
  <div class="panel-body" id="diary-body"></div>
</div>

<!-- 设置 -->
<div class="panel" id="panel-save">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-save')">◂</button>
    <h2>存档 / 读档</h2>
  </div>
  <div class="panel-body" id="save-body"></div>
</div>
<div class="panel" id="panel-settings">
  <div class="panel-head">
    <button class="close" onclick="closePanel('panel-settings')">◂</button>
    <h2>设置</h2>
  </div>
  <div class="panel-body">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button onclick="openModal('modal-api')">⚙ API 配置</button>
      <button onclick="openModal('modal-wb')">📖 世界书管理</button>
      <button onclick="openModal('modal-preset')">🎭 AI 预设</button>
      <button onclick="openModal('modal-theme')">🎨 美化 / 主题导入</button>
      <button class="danger" onclick="resetGame()">↺ 重置游戏</button>
    </div>
  </div>
</div>

<!-- ============ API 弹窗 ============ -->
<div class="modal" id="modal-api">
  <div class="modal-box">
    <div class="modal-head"><h3>API 配置</h3><button onclick="closeModal('modal-api')">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>接口地址</label><input id="cfg-url" placeholder="https://.../v1/chat/completions"></div>
      <div class="field"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
      <div class="field"><label>模型名</label><input id="cfg-model" placeholder="gpt-4o-mini"></div>
      <div class="field"><label>温度</label><input id="cfg-temp" type="number" step="0.1" min="0" max="2"></div>
      <button class="primary" style="width:100%;padding:10px;" onclick="saveApi()">保存</button>
    </div>
  </div>
</div>

<!-- ============ 世界书弹窗 ============ -->
<div class="modal" id="modal-wb">
  <div class="modal-box">
    <div class="modal-head">
      <h3>世界书</h3>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">

function renderChat(){
  const box = $('chat');

    box.innerHTML = '<div class="empty">还没有开始。在下方输入你的第一个行动。</div>';
    return;
  }
  box.innerHTML = S.chatLog.map(m=>{
    if(m.role==='narration')
      return `<div class="mes" is_user="false"><div class="mes_block"><div class="ch_name"><span class="name_text">◈ 叙事</span><span class="timestamp">${fmtTime(m.t)}</span></div><div class="mes_text">${esc(m.text)}</div></div></div>`;
    if(m.role==='player')
      return `<div class="mes" is_user="true"><div class="mes_block"><div class="ch_name"><span class="name_text">▶ 你</span><span class="timestamp">${fmtTime(m.t)}</span></div><div class="mes_text">${esc(m.text)}</div></div></div>`;
    if(m.role==='system')
      return `<div class="mes system"><div class="mes_block"><div class="mes_text">${esc(m.text)}</div></div></div>`;
    if(m.role==='thinking')
      return `<div class="mes thinking" is_user="false"><div class="mes_block"><span class="dots"><i></i><i></i><i></i></span> AI 正在生成...</div></div>`;
    return '';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendChat(){
  const inp = $('send_textarea');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = ''; inp.style.height = 'auto';

  S.chatLog.push({ role:'player', text, t:now() });
  S.chatLog.push({ role:'thinking', t:now() });
  save();
  renderChat();

  const context = S.chatLog
    .filter(m=>m.role==='narration'||m.role==='player')
    .slice(-10)
    .map(m=>(m.role==='player'?'玩家：':'')+m.text)
    .join('\n\n');

  const reply = await callAI(
    `【主剧情场景】
玩家：${S.player.name}（${S.player.gender}，${S.player.age}岁，外貌：${S.player.appearance}，穿着：${S.player.outfit}，来因：${S.player.reason}）
现在是第 ${S.day} 天 ${TIME_LABELS[S.timeIndex]}。

最近剧情：
${context}

玩家行动：${text}

请生成一段 200-400 字的沉浸式叙事，第二人称「你」，推进剧情或回应玩家行动。NPC 的反应要符合人设。如果玩家行动揭示新线索或接触新角色，在 JSON 返回 clue_add 或 char_update。`
  );

  S.chatLog = S.chatLog.filter(m=>m.role!=='thinking');
  const replyText = reply.reply || '（没有回应）';
  S.chatLog.push({ role:'narration', text:replyText, t:now() });
  applyChanges(reply.state_changes);
  if(reply.clue_add) addClue(reply.clue_add);
  if(reply.char_update) updateChar(reply.char_update);
  save();
  renderChat(); renderSidebar(); renderTop();
}

function openChat(name){

async function sendSMS(name){
  if(!name) name = $('smsInput').dataset.target;
  const inp = $('smsInput');

  inp.value = '';
  if(!S.phone.messages[name]) S.phone.messages[name] = [];
  S.phone.messages[name].push({ from:'me', text, t:now() });
  save();
  openChat(name);

  const reply = await callAI(
    `【短信场景】玩家（${S.player.name}）给 ${name} 发短信：「${text}」。以 ${name} 身份用短信口吻回复，简短、真实、2015 年美国高中生语气。第一次对话在 char_update 返回 { "name":"${name}", "known":true }。`
  );
  const replyText = reply.reply || '（无回复）';
  S.phone.messages[name].push({ from:name, text:replyText, t:now() });

  if(reply.clue_add) addClue(reply.clue_add);
  if(reply.char_update) updateChar(reply.char_update);

function updateChar(up){
  if(!up || !up.name) return;
  const c = S.chars[up.name];
  if(!c) return;
  if(up.known) c.known = true;
  if(typeof up.goodwill === 'number') c.goodwill = Math.max(-100, Math.min(100, c.goodwill + up.goodwill));
  if(typeof up.suspicion === 'number') c.suspicion = Math.max(0, Math.min(100, c.suspicion + up.suspicion));
  if(typeof up.progress === 'number') c.progress = Math.max(0, Math.min(100, c.progress + up.progress));
  if(up.secret && up.secret !== c.secret) c.secret = up.secret;
  save();
}

function createSave(){
  const def = '第' + S.day + '天 ' + TIME_LABELS[S.timeIndex] + ' · ' + S.player.name;
  const name = prompt('存档名称：', def);
  if(name === null) return;
  const saves = getSaves();
  saves.push({
    id: 'save_' + now() + '_' + Math.random().toString(36).slice(2,6),
    name: name.trim() || def,
    ts: now(),
    data: JSON.parse(JSON.stringify(S))
  });
  setSaves(saves);
  renderSaveList();
  alert('已存档。');
}

function loadSave(id){
  if(!confirm('读取此存档？当前没保存的进度会丢。')) return;
  const s = getSaves().find(x=>x.id===id);
  if(!s){ alert('存档不存在。'); return; }
  S = JSON.parse(JSON.stringify(s.data));
  if(!Array.isArray(S.clues)) S.clues = [];
  if(!S.phone) S.phone = { messages:{}, forum:[] };
  if(!S.chars) S.chars = JSON.parse(JSON.stringify(DEF_CHARS));
  else Object.keys(DEF_CHARS).forEach(k=>{ if(!S.chars[k]) S.chars[k] = JSON.parse(JSON.stringify(DEF_CHARS[k])); });
  if(!S.flags) S.flags = {};
  if(!Array.isArray(S.chatLog)) S.chatLog = [];
  save();
  closePanel('panel-save');
  renderAll();
  alert('已读取：' + s.name);
}

function deleteSave(id){
  if(!confirm('删除此存档？无法恢复。')) return;
  setSaves(getSaves().filter(x=>x.id!==id));
  renderSaveList();
}

function exportSave(id){
  const s = getSaves().find(x=>x.id===id);
  if(!s) return;
  const data = { type:'pinevalley-save', version:1, name:s.name, ts:s.ts, state:s.data };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pv-save-' + s.name.replace(/[\\/:*?"<>|]/g,'_') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importSaveFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || data.type !== 'pinevalley-save' || !data.state){
        alert('格式错误：不是松林谷存档文件。');
        return;
      }
      const saves = getSaves();
      saves.push({
        id: 'save_' + now() + '_' + Math.random().toString(36).slice(2,6),
        name: (data.name || '导入存档') + ' (导入)',
        ts: now(),
        data: data.state
      });
      setSaves(saves);
      renderSaveList();
      alert('已导入存档。');
    }catch(err){ alert('解析失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ==================== 时间推进 ==================== */
function advanceTime(){
  S.timeIndex++;
  if(S.timeIndex > 3){
    S.timeIndex = 0; S.day++;
    S.stats.stamina = S.stats.maxStamina;
    S.stats.insight = Math.min(S.stats.maxInsight, S.stats.insight + 30);
  }
  if(!S.flags.log) S.flags.log = [];
  S.flags.log.push({ day:S.day, time:TIME_LABELS[S.timeIndex], text:'时间推进至 '+TIME_LABELS[S.timeIndex]+'。' });
  save();
  renderTop(); renderSidebar(); closeSide();
  maybeRandomEvent();
}

async function maybeRandomEvent(){
  if(!settings.apiKey) return;
  if(Math.random() < 0.55) return;
  const pool = Object.values(S.chars).filter(c=>c.known);
  if(!pool.length) return;
  const c = pool[Math.floor(Math.random()*pool.length)];
  if(!S.phone.messages[c.name]) S.phone.messages[c.name] = [];
  const reply = await callAI(
    `【随机事件】松林谷第 ${S.day} 天 ${TIME_LABELS[S.timeIndex]}。${c.name} 突然给玩家 ${S.player.name} 发短信。符合角色性格（${c.tag}）。JSON 返回，reply 字段为短信内容。`
  );
  if(reply.reply){
    S.phone.messages[c.name].push({ from:c.name, text:reply.reply, t:now() });
    if(reply.clue_add) addClue(reply.clue_add);
    if(reply.char_update) updateChar(reply.char_update);
    applyChanges(reply.state_changes);
    save(); renderSidebar();
  }
}

function applyChanges(c){
  if(!c || typeof c!=='object') return;
  const st = S.stats;
  const num = v => typeof v==='number' && !isNaN(v);
  if(num(c.stamina)) st.stamina = Math.max(0, Math.min(st.maxStamina, st.stamina + c.stamina));
  if(num(c.insight)) st.insight = Math.max(0, Math.min(st.maxInsight, st.insight + c.insight));
  if(num(c.money)) st.money = Math.max(0, st.money + c.money);
  if(num(c.suspicion)) st.suspicion = Math.max(0, Math.min(100, st.suspicion + c.suspicion));
  save();
}

function getActivePreset(){ return presets.find(p=>p.id===activePresetId) || presets[0]; }

function buildSystemPrompt(){
  const stateStr = `第 ${S.day} 天 ${TIME_LABELS[S.timeIndex]}。
玩家：${S.player.name}，${S.player.gender}，${S.player.age}岁。
外貌：${S.player.appearance}。穿着：${S.player.outfit}。来因：${S.player.reason}。
精力 ${Math.round(S.stats.stamina)}/${S.stats.maxStamina}，洞察 ${Math.round(S.stats.insight)}/${S.stats.maxInsight}，金钱 $${S.stats.money}，可疑度 ${S.stats.suspicion}%。
已知线索：${S.clues.map(c=>c.title).join('、') || '无'}。
已知角色：${Object.values(S.chars).filter(c=>c.known).map(c=>c.name).join('、') || '无'}。`;
  const wbStr = worldbook.filter(w=>w.enabled).map(w=>`【${w.name}】${w.content}`).join('\n');
  const p = getActivePreset();
  return (p.system||'').replace(/\{\{state\}\}/g, stateStr).replace(/\{\{worldbook\}\}/g, wbStr);
}

async function callAI(userMessage){
  if(!settings.apiKey){
    return { reply:'[模拟模式] 请先在设置 ⚙ API 里填写接口地址和 Key。', state_changes:{}, clue_add:null, char_update:null };
  }
  try{
    const res = await fetch(settings.apiUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+settings.apiKey },
      body: JSON.stringify({
        model: settings.model,
        messages: [
          { role:'system', content: buildSystemPrompt() },
          { role:'user', content: userMessage }
        ],
        temperature: getActivePreset().temperature || 0.85
      })
    });
    if(!res.ok){
  let detail = '';
  try { detail = await res.text(); } catch(e){}
  throw new Error('HTTP ' + res.status + ' · ' + detail.slice(0, 300));
}
    const json = await res.json();
    let raw = json?.choices?.[0]?.message?.content || '';
    raw = raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
    if(a>=0 && b>a) raw = raw.slice(a,b+1);
    try{ return JSON.parse(raw); }
    catch(e){ return { reply:raw, state_changes:{}, clue_add:null, char_update:null }; }
  }catch(err){
    return { reply:'[连接失败] '+err.message, state_changes:{}, clue_add:null, char_update:null };
  }
}

/* ==================== 弹窗 ==================== */
function openModal(id){
  if(id==='modal-api'){
    $('cfg-url').value = settings.apiUrl;
    $('cfg-key').value = settings.apiKey;
    $('cfg-model').value = settings.model;
    $('cfg-temp').value = getActivePreset().temperature || 0.85;
  }
  if(id==='modal-wb') renderWBList();
  if(id==='modal-preset') renderPresetList();
  if(id==='modal-theme') $('theme-css').value = LS.get('pv_theme_css','');
  $(id).classList.add('show');
}
function closeModal(id){ $(id).classList.remove('show'); }
function saveApi(){
  settings.apiUrl = $('cfg-url').value.trim();
  settings.apiKey = $('cfg-key').value.trim();
  settings.model = $('cfg-model').value.trim() || 'gpt-4o-mini';
  const t = parseFloat($('cfg-temp').value);
  if(!isNaN(t)) getActivePreset().temperature = t;
  save();
  closeModal('modal-api');
  alert('API 已保存。');
}

/* ==================== 世界书 ==================== */
function renderWBList(){
  $('wb-list').innerHTML = worldbook.map((w,i)=>`
    <div style="background:#141414;border:1px solid #222;border-radius:6px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <input value="${esc(w.name)}" onchange="wbUpdate(${i},'name',this.value)" style="flex:1;font-size:12px;">
        <label style="font-size:11px;color:#888;white-space:nowrap;"><input type="checkbox" ${w.enabled?'checked':''} onchange="wbUpdate(${i},'enabled',this.checked)"> 启用</label>
        <button class="danger" style="padding:2px 8px;font-size:11px;" onclick="wbDelete(${i})">删</button>
      </div>
      <textarea rows="3" onchange="wbUpdate(${i},'content',this.value)" style="font-size:12px;">${esc(w.content)}</textarea>
      <input value="${esc((w.keywords||[]).join(','))}" placeholder="关键词，逗号分隔" onchange="wbUpdate(${i},'keywords',this.value.split(',').map(s=>s.trim()).filter(Boolean))" style="margin-top:6px;font-size:12px;">
    </div>
  `).join('');
}
function wbUpdate(i,k,v){ worldbook[i][k]=v; save(); }
function wbDelete(i){ if(confirm('删除？')){ worldbook.splice(i,1); save(); renderWBList(); } }
function addWB(){ worldbook.push({ id:'wb'+now(), name:'新条目', enabled:true, constant:false, keywords:[], content:'' }); save(); renderWBList(); }

function exportWB(){
  const data = JSON.stringify({ entries: worldbook }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'pinevalley-worldbook.json'; a.click();
  URL.revokeObjectURL(url);
}

function importWB(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      let arr = null;
      if(Array.isArray(data)) arr = data;
      else if(data && Array.isArray(data.entries)) arr = data.entries;
      else if(data && data.entries && typeof data.entries === 'object'){
        arr = Object.keys(data.entries).map(k => {
          const e = data.entries[k];
          if(!e || typeof e !== 'object') return null;
          return {
            name: e.comment || (e.key && e.key[0]) || k,
            enabled: !e.disable,
            constant: !!e.constant,
            keywords: e.key || [],
            content: String(e.content || '').replace(/\{\{char\}\}/g,'').replace(/\{\{user\}\}/g,'')
          };
        }).filter(Boolean);
      }
      if(!arr || !arr.length){ alert('格式错误：未识别到世界书条目。'); return; }
      arr.forEach(w=>{
        if(!w.id) w.id = 'wb'+now()+Math.random();
        if(typeof w.enabled !== 'boolean') w.enabled = true;
        if(typeof w.constant !== 'boolean') w.constant = false;
        if(!Array.isArray(w.keywords)) w.keywords = [];
        if(typeof w.content !== 'string') w.content = '';
        if(!w.name) w.name = '导入条目';
        worldbook.push(w);
      });
      save(); renderWBList();
      alert('已导入 '+arr.length+' 条世界书。');
    }catch(err){ alert('解析失败：'+err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ==================== 预设（多分组 + 酒馆格式导入） ==================== */
function renderPresetList(){
  const box = $('preset-list');
  const groups = {};
  presets.forEach(p=>{
    const g = p.group || '未分组';
    if(!groups[g]) groups[g] = [];
    groups[g].push(p);
  });
  let html = '';
  Object.keys(groups).forEach(gname=>{
    html += `<div class="preset-group">▸ ${esc(gname)}</div>`;
    html += groups[gname].map(p=>`
      <div class="preset-item ${p.id===activePresetId?'active':''}">
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
          <input value="${esc(p.name)}" onchange="presetUpdate('${p.id}','name',this.value)" style="flex:1;font-size:12px;">
          <input value="${esc(p.group||'')}" placeholder="分组" onchange="presetUpdate('${p.id}','group',this.value)" style="width:90px;font-size:11px;">
          ${p.id===activePresetId
            ? '<span style="color:var(--accent);font-size:11px;white-space:nowrap;">● 使用中</span>'
            : `<button style="padding:3px 10px;font-size:11px;" onclick="presetActivate('${p.id}')">启用</button>`}
          <button class="danger" style="padding:3px 10px;font-size:11px;" onclick="presetDelete('${p.id}')">删</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
          <label style="font-size:11px;color:#888;">温度</label>
          <input type="number" step="0.1" min="0" max="2" value="${p.temperature??0.85}" onchange="presetUpdate('${p.id}','temperature',parseFloat(this.value))" style="width:70px;font-size:11px;">
        </div>
        <textarea rows="6" onchange="presetUpdate('${p.id}','system',this.value)" style="font-size:11px;font-family:monospace;">${esc(p.system)}</textarea>
      </div>
    `).join('');
  });
  box.innerHTML = html || '<div class="empty">还没有预设。</div>';
}
function presetUpdate(id,k,v){ const p = presets.find(x=>x.id===id); if(p){ p[k]=v; save(); } }
function presetActivate(id){ activePresetId = id; save(); renderPresetList(); }
function presetDelete(id){
  if(presets.length<=1) return alert('至少保留一个预设');
  if(!confirm('删除？')) return;
  presets = presets.filter(x=>x.id!==id);
  if(activePresetId===id) activePresetId = presets[0].id;
  save(); renderPresetList();
}
function addPreset(){
  presets.push({
    id:'p'+now(), group:'未分组', name:'新预设', temperature:0.85,
    system: presets[0]?.system || '你是叙事AI。'
  });
  save(); renderPresetList();
}

function exportPresets(){
  const data = JSON.stringify(presets, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'pinevalley-presets.json'; a.click();
  URL.revokeObjectURL(url);
}
function importPresets(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      let arr = JSON.parse(ev.target.result);
      if(!Array.isArray(arr) && arr && Array.isArray(arr.presets)) arr = arr.presets;
      if(!Array.isArray(arr) && arr && Array.isArray(arr.prompts)){
        const system = arr.prompts
          .filter(p=>p && (p.role==='system' || p.name==='main' || p.name==='System Prompt') && p.content)
          .map(p=>p.content).join('\n\n');
        arr = [{
          name: arr.name || '导入酒馆预设',
          group: '酒馆导入',
          temperature: arr.temperature ?? 0.85,
          system: system || '（未提取到 system prompt）'
        }];
      }
      if(!Array.isArray(arr)){ alert('格式错误：需要预设数组。'); return; }
      arr.forEach(p=>{
        if(!p.id) p.id = 'p'+now()+Math.random();
        if(!p.name) p.name = '导入预设';
        if(!p.group) p.group = '导入';
        if(!p.system) p.system = '';
        if(typeof p.temperature !== 'number') p.temperature = 0.85;
        presets.push(p);
      });
      save(); renderPresetList();
      alert('已导入 '+arr.length+' 个预设。');
    }catch(err){
      const txt = ev.target.result;
      if(txt.trim()){
        presets.push({ id:'p'+now(), group:'导入', name:'导入预设', temperature:0.85, system:txt });
        save(); renderPresetList();
        alert('已作为文本导入 1 个预设。');
      } else alert('解析失败：'+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ==================== 美化 / 主题（酒馆兼容） ==================== */
function applyTheme(){
  const css = $('theme-css').value.trim();
  const font = $('theme-font').value.trim();
  LS.set('pv_theme_css', css);
  LS.set('pv_theme_font', font);
  let finalCSS = '';
  if(font) finalCSS += `@import url("${font}");\n`;
  finalCSS += css;
  $('user-theme').textContent = finalCSS;
  alert('主题已应用。');
}

function resetTheme(){
  if(!confirm('重置主题？')) return;
  LS.del('pv_theme_css');
  LS.del('pv_theme_font');
  $('theme-css').value = '';
  $('theme-font').value = '';
  $('user-theme').textContent = '';
}

function exportTheme(){
  const data = {
    name: 'Pine Valley Theme',
    custom_css: $('theme-css').value,
    font_url: $('theme-font').value
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'pinevalley-theme.json'; a.click();
  URL.revokeObjectURL(url);
}

function importTheme(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const raw = ev.target.result;
    try{
      const data = JSON.parse(raw);
      if(data && data.custom_css){
        $('theme-css').value = data.custom_css;
        $('theme-font').value = data.font_url || '';
        applyTheme();
        alert('已导入酒馆主题 JSON（custom_css 字段）。');
        return;
      }
    }catch(err){}
    $('theme-css').value = raw;
    applyTheme();
    alert('已作为纯 CSS 导入。');
  };
  reader.readAsText(file);
  e.target.value = '';
}

function restoreTheme(){
  const css = LS.get('pv_theme_css','');
  const font = LS.get('pv_theme_font','');
  let finalCSS = '';
  if(font) finalCSS += `@import url("${font}");\n`;
  finalCSS += css;
  $('user-theme').textContent = finalCSS;
}

/* ==================== 重置 ==================== */
function resetGame(){
  if(!confirm('清空所有进度、重新建立角色档案？')) return;
  S = JSON.parse(JSON.stringify(DEF_STATE));
  S.created = false;
  save();
  $('intro').classList.add('hide');
  $('create').classList.add('show');
  document.querySelectorAll('.panel.show').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'));
}

/* ==================== 启动 ==================== */
document.addEventListener('DOMContentLoaded', () => {
  restoreTheme();
  runIntro();

  document.querySelectorAll('.modal').forEach(m=>{
    m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); });
  });

  const ta = $('send_textarea');
  ta.addEventListener('keydown', e => {
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      sendChat();
    }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  });

  const sms = $('smsInput');
  if(sms) sms.addEventListener('keydown', e => {
    if(e.key==='Enter') sendSMS();
  });
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'));
    document.querySelectorAll('.panel.show').forEach(p=>p.classList.remove('show'));
    closeSide();
  }
});
