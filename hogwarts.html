<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霍格沃茨模拟器</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #060913; --bg-mid: #0d1424; --bg-light: #18233d;
  --border-dim: #1e2a45; --border-glow: #3b5b8c;
  --text-main: #c8d4ee; --text-dim: #7a8dae; --text-faint: #4c5e7d;
  --accent-blue: #5c9cff; --accent-cyan: #66ccff;
  --accent-glow: rgba(92, 156, 255, 0.25);
  --success: #4a9d7a; --danger: #b5544a;
  --app-brightness: 100%; --app-contrast: 100%; --app-blur: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Crimson Text', Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
  color: var(--text-main); font-size: 14px; background-color: var(--bg-deep);
  background-image: radial-gradient(circle at 50% 0%, #1a2848 0%, #0a0f1c 80%);
  -webkit-font-smoothing: antialiased;
}
/* ★ 关键修复：滤镜只加在内容区，不要加在 body 上，防止手机卡死 */
#app { 
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; 
  filter: brightness(var(--app-brightness)) contrast(var(--app-contrast)) blur(var(--app-blur));
  transition: filter 0.2s;
}
button, input, textarea, select { font-family: inherit; font-size: 13px; }
button {
  cursor: pointer; border-radius: 6px; border: 1px solid var(--border-dim);
  background: rgba(13, 20, 36, 0.85); color: var(--text-main);
  padding: 7px 12px; transition: 0.2s; touch-action: manipulation; user-select: none;
}
button:active { transform: scale(0.96); }
button:hover { border-color: var(--border-glow); background: rgba(24, 35, 61, 0.9); }
button.primary {
  background: linear-gradient(135deg, #1a3a6b, #2a5a9c);
  border-color: var(--accent-blue); color: #fff; font-weight: 600;
  font-family: 'Cinzel', serif; letter-spacing: 0.5px; box-shadow: 0 0 10px var(--accent-glow);
}
button.danger { border-color: #5a2b2b; color: #e08a8a; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 6px; 
  background: var(--bg-deep); border-radius: 3px; outline: none; 
  border: 1px solid var(--border-dim); margin: 8px 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; 
  border-radius: 50%; background: var(--accent-blue); cursor: pointer;
}
header {
  flex-shrink: 0; display: flex; align-items: center;
  padding: 6px 10px; background: rgba(6, 9, 19, 0.95);
  border-bottom: 1px solid var(--border-dim); gap: 8px; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.header-info .h-line { font-size: 11px; color: var(--text-dim); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.header-info .h-line span { color: var(--accent-blue); font-family: 'Cinzel', serif; font-weight: 600; }
.header-info .h-line .h-label { color: var(--text-faint); font-family: inherit; font-weight: 400; }
main { flex: 1; display: flex; overflow: hidden; position: relative; }
#sidebar { width: 240px; flex-shrink: 0; background: rgba(9, 14, 26, 0.95); border-right: 1px solid var(--border-dim); overflow-y: auto; padding: 10px; transition: 0.25s; z-index: 20; }
#sidebar.hidden { transform: translateX(-100%); position: absolute; top: 0; bottom: 0; left: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.8); }
#main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#story { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 92%; margin-bottom: 14px; line-height: 1.8; animation: fadeIn 0.3s ease; word-break: break-word; white-space: pre-wrap; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg.assistant { margin-right: auto; background: rgba(13, 20, 36, 0.9); border: 1px solid var(--border-dim); border-left: 3px solid var(--accent-blue); border-radius: 3px 10px 10px 3px; padding: 14px 16px; }
.msg.user { margin-left: auto; background: rgba(24, 35, 61, 0.9); border: 1px solid var(--border-glow); border-radius: 10px 3px 3px 10px; padding: 10px 14px; }
.msg.system { margin: 0 auto; text-align: center; font-size: 12px; color: var(--accent-cyan); background: rgba(13, 20, 36, 0.9); border: 1px solid var(--border-glow); border-radius: 20px; padding: 6px 16px; max-width: 95%; }
#options { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; padding: 0 16px 8px; max-height: 120px; overflow-y: auto; }
#options button { text-align: left; padding: 8px 12px 8px 28px; position: relative; font-size: 12px; }
#options button::before { content: "▸"; position: absolute; left: 10px; color: var(--accent-blue); }
#input-bar { flex-shrink: 0; display: flex; gap: 8px; padding: 8px 12px 12px; background: rgba(9, 14, 26, 0.95); border-top: 1px solid var(--border-dim); align-items: flex-end; }
#user-input { flex: 1; min-height: 40px; max-height: 100px; line-height: 1.5; padding: 10px; background: rgba(6, 9, 19, 0.8); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-main); outline: none; resize: none; }
#user-input:focus { border-color: var(--accent-blue); }
#send-btn { height: 40px; flex-shrink: 0; padding: 0 16px; }
.card { background: rgba(13, 20, 36, 0.85); border: 1px solid var(--border-dim); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.card h4 { font-family: 'Cinzel', serif; font-size: 10px; color: var(--accent-blue); letter-spacing: 1.5px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; gap: 8px; }
.kv .k { color: var(--text-dim); flex-shrink: 0; } .kv .v { text-align: right; word-break: break-all; }
.bar-row { margin: 6px 0; } .bar-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.bar { height: 6px; background: rgba(6, 9, 19, 0.8); border-radius: 3px; overflow: hidden; border: 1px solid rgba(30, 42, 69, 0.5); }
.bar > i { display: block; height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.bar.mana > i { background: linear-gradient(90deg, #3a5a8a, #5a8abf); } .bar.stam > i { background: linear-gradient(90deg, #2a6a4a, #4a9d7a); }
.tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 12px; background: rgba(24, 35, 61, 0.8); border: 1px solid var(--border-dim); margin: 2px 2px 2px 0; }
.rel { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; } .rel .v.pos { color: var(--success); } .rel .v.neg { color: var(--danger); }
.modal { position: fixed; inset: 0; background: rgba(3, 6, 12, 0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
.modal.show { display: flex; }
.modal-box { background: rgba(13, 20, 36, 0.98); border: 1px solid var(--border-glow); border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border-dim); flex-shrink: 0; }
.modal-head h3 { font-family: 'Cinzel', serif; font-size: 14px; color: var(--accent-cyan); }
.settings-tabs { display: flex; border-bottom: 1px solid var(--border-dim); flex-shrink: 0; background: rgba(6, 9, 19, 0.5); overflow-x: auto; }
.settings-tabs button { flex: 1; min-width: 70px; border: none; background: transparent; border-radius: 0; padding: 10px 5px; font-size: 12px; color: var(--text-dim); border-bottom: 2px solid transparent; transition: 0.2s; white-space: nowrap; }
.settings-tabs button.active { color: var(--accent-cyan); border-bottom-color: var(--accent-blue); background: rgba(92, 156, 255, 0.05); }
.modal-body { overflow-y: auto; padding: 14px; flex: 1; }
.tab-pane { display: none; } .tab-pane.active { display: block; }
.field { margin-bottom: 12px; } .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.field input, .field textarea, .field select { width: 100%; padding: 8px; background: rgba(6, 9, 19, 0.9); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-main); outline: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent-blue); }
.music-player { background: rgba(6, 9, 19, 0.6); border: 1px solid var(--border-dim); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.music-info { text-align: center; margin-bottom: 10px; } .music-info .title { font-size: 14px; font-weight: 600; color: var(--accent-cyan); } .music-info .artist { font-size: 11px; color: var(--text-dim); }
.music-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
.music-controls button { width: 36px; height: 36px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
.music-controls button.play-btn { width: 46px; height: 46px; font-size: 20px; background: var(--accent-blue); color: #fff; }
.progress-container { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
.volume-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
.playlist { max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--border-dim); padding-top: 8px; }
.playlist-item { display: flex; justify-content: space-between; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.playlist-item:hover { background: rgba(92, 156, 255, 0.1); } .playlist-item.active { color: var(--accent-blue); background: rgba(92, 156, 255, 0.15); }
.playlist-item .delete-btn { color: var(--danger); cursor: pointer; padding: 0 4px; }
.preset-entry { background: rgba(6, 9, 19, 0.6); border: 1px solid var(--border-dim); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
.preset-entry .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.preset-entry .entry-head input { flex: 1; margin-right: 6px; font-size: 12px; }
.preset-entry .entry-controls { display: flex; gap: 4px; }
.preset-entry .entry-controls button { padding: 2px 6px; font-size: 11px; }
.preset-entry textarea { font-size: 11px; font-family: monospace; width: 100%; margin-top: 4px; }
.loading { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-cyan); animation: bounce 1.3s infinite; }
.dot:nth-child(2) { animation-delay: 0.18s; } .dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
@media (min-width: 821px) { .only-mobile { display: none; } #sidebar { position: static; transform: none !important; } }
@media (max-width: 480px) { .msg.assistant { padding: 12px 13px; font-size: 13px; } #story { padding: 12px; } #options { padding: 0 12px 6px; } header { padding: 4px 8px; } .header-info .h-line { font-size: 10px; } }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-left"><button class="only-mobile" onclick="window.toggleSidebar()">☰</button></div>
    <div class="header-info">
      <div class="h-line"><span class="h-label">年份</span><span id="ui-header-year">2000年</span> <span style="color:#4c5e7d;">|</span> <span class="h-label">时间</span><span id="ui-header-time">上午</span></div>
      <div class="h-line"><span class="h-label">地点</span><span class="h-scene" id="ui-header-scene" style="color:var(--accent-cyan);">霍格沃茨特快列车</span></div>
      <div class="h-line"><span class="h-label">在场</span><span class="h-actors" id="ui-header-actors">你</span></div>
    </div>
    <div class="header-right"><button onclick="window.openModal('modal-settings')">⚙</button></div>
  </header>

  <main>
    <aside id="sidebar" class="hidden">
      <div class="card"><div class="kv"><span class="k">姓名</span><span class="v" id="ui-name">未定</span></div><div class="kv"><span class="k">学院</span><span class="v" id="ui-house">未分院</span></div><div class="kv"><span class="k">年级</span><span class="v" id="ui-year">1 年级</span></div></div>
      <div class="card"><h4>当前</h4><div class="kv"><span class="k">场景</span><span class="v" id="ui-scene">-</span></div><div class="kv"><span class="k">时间</span><span class="v" id="ui-time">-</span></div></div>
      <div class="card"><h4>状态</h4><div class="bar-row"><div class="bar-label"><span>魔力</span><span id="ui-mana-t">0/100</span></div><div class="bar mana"><i id="ui-mana-b" style="width:0%"></i></div></div><div class="bar-row"><div class="bar-label"><span>体力</span><span id="ui-stam-t">0/100</span></div><div class="bar stam"><i id="ui-stam-b" style="width:0%"></i></div></div><div class="kv"><span class="k">加隆</span><span class="v" id="ui-galleons">💰 0</span></div></div>
      <div class="card"><h4>物品</h4><div id="ui-inventory"></div></div>
      <div class="card"><h4>人物关系</h4><div id="ui-relations"></div></div>
    </aside>

    <div id="main-content">
      <div id="story"></div>
      <div id="options"></div>
      <div id="input-bar">
        <textarea id="user-input" rows="1" placeholder="你想做什么？（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="primary" id="send-btn" onclick="window.onSend()">发送</button>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal-settings">
  <div class="modal-box">
    <div class="modal-head"><h3>⚙ 系统设置</h3><button onclick="window.closeModal('modal-settings')">关闭</button></div>
    <div class="settings-tabs">
      <button class="active" onclick="window.switchSettingsTab('tab-api')">API</button>
      <button onclick="window.switchSettingsTab('tab-world')">世界书</button>
      <button onclick="window.switchSettingsTab('tab-preset')">预设</button>
      <button onclick="window.switchSettingsTab('tab-beautify')">美化</button>
      <button onclick="window.switchSettingsTab('tab-music')">音乐</button>
    </div>
    <div class="modal-body">
      <!-- API -->
      <div class="tab-pane active" id="tab-api">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <label style="flex-shrink:0;">API 配置</label>
          <select id="api-profile-select" style="flex:1;" onchange="window.switchApiProfile(this.value)"></select>
          <button class="primary" onclick="window.newApiProfile()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deleteApiProfile()" style="padding:6px 10px;">删</button>
        </div>
        <div class="field"><label>接口地址</label><input id="cfg-url" placeholder="https://api.example.com/v1/chat/completions"></div>
        <div class="field"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
        <div class="field">
          <label>模型名</label>
          <div style="display:flex;gap:6px;">
            <input id="cfg-model" placeholder="gpt-4o-mini" style="flex:1;">
            <button onclick="window.fetchModels()" style="padding:8px;white-space:nowrap;">拉取模型</button>
          </div>
          <div id="model-list" style="margin-top:6px;font-size:11px;color:var(--text-dim);"></div>
        </div>
        <div class="field"><label>温度 (0~2)</label><input id="cfg-temp" type="number" step="0.1" min="0" max="2"></div>
        <button class="primary" style="width:100%;padding:10px" onclick="window.saveApiConfig()">保存当前 API 配置</button>
        <button class="danger" style="width:100%;padding:8px;margin-top:10px;" onclick="window.resetAllData()">⚠ 重置所有本地缓存（如果卡死点这里）</button>
      </div>

      <!-- 世界书 -->
      <div class="tab-pane" id="tab-world">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <select id="worldbook-select" style="flex:1;" onchange="window.switchWorldbook(this.value)"></select>
          <button class="primary" onclick="window.newWorldbook()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deleteWorldbook()" style="padding:6px 10px;">删</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input type="file" id="import-world-json" accept=".json" style="display:none;" onchange="window.importWorldbook(event)">
          <button style="flex:1;" onclick="document.getElementById('import-world-json').click()">📂 导入酒馆世界书 JSON</button>
          <button class="primary" onclick="window.addWorldEntry()">+ 新增条目</button>
        </div>
        <div id="world-list"></div>
      </div>

      <!-- 预设 -->
      <div class="tab-pane" id="tab-preset">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <select id="preset-select" style="flex:1;" onchange="window.switchPreset(this.value)"></select>
          <button class="primary" onclick="window.newPreset()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deletePreset()" style="padding:6px 10px;">删</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input type="file" id="import-preset-json" accept=".json" style="display:none;" onchange="window.importPreset(event)">
          <button style="flex:1;" onclick="document.getElementById('import-preset-json').click()">📂 导入酒馆预设 JSON</button>
          <button class="primary" onclick="window.addPresetEntry()">+ 新增条目</button>
        </div>
        <div id="preset-list"></div>
      </div>

      <!-- 美化 -->
      <div class="tab-pane" id="tab-beautify">
        <div class="field"><label>全局亮度</label><input type="range" id="ui-brightness" min="50" max="150" value="100" oninput="window.applyFilter('brightness', this.value)"><span id="val-brightness" style="float:right;font-size:11px;color:var(--text-dim);">100%</span></div>
        <div class="field"><label>对比度 (清晰度)</label><input type="range" id="ui-contrast" min="50" max="150" value="100" oninput="window.applyFilter('contrast', this.value)"><span id="val-contrast" style="float:right;font-size:11px;color:var(--text-dim);">100%</span></div>
        <div class="field"><label>模糊度 (氛围)</label><input type="range" id="ui-blur" min="0" max="10" value="0" oninput="window.applyFilter('blur', this.value)"><span id="val-blur" style="float:right;font-size:11px;color:var(--text-dim);">0px</span></div>
        <hr style="border:0;border-top:1px solid var(--border-dim);margin:15px 0;">
        <div class="field"><label>壁纸链接</label><input id="cfg-wallpaper" placeholder="输入图片 URL" onchange="window.applyWallpaper(this.value)"></div>
        <div class="field"><label>或上传本地图片</label><input type="file" id="wallpaper-file" accept="image/*" onchange="window.uploadWallpaper(event)"></div>
        <hr style="border:0;border-top:1px solid var(--border-dim);margin:15px 0;">
        <div class="field"><label>导入 JSON 美化 (兼容酒馆主题)</label><input type="file" id="import-css-json" accept=".json" onchange="window.importBeautifyJSON(event)"><div style="font-size:11px;color:var(--text-faint);margin-top:4px;">上传 SillyTavern 的 JSON 主题文件，系统会自动提取 CSS 并尽量适配</div></div>
        <button class="primary" style="width:100%;padding:10px" onclick="window.saveBeautify()">保存美化设置</button>
      </div>

      <!-- 音乐 -->
      <div class="tab-pane" id="tab-music">
        <div class="music-player">
          <div class="music-info"><div class="title" id="music-title">暂无播放</div><div class="artist" id="music-artist">-</div></div>
          <div class="music-controls"><button onclick="window.prevTrack()">⏮</button><button class="play-btn" id="music-play-btn" onclick="window.togglePlay()">▶</button><button onclick="window.nextTrack()">⏭</button></div>
          <div class="progress-container"><span id="music-current">0:00</span><input type="range" id="music-progress" min="0" max="100" value="0" oninput="window.seekMusic(this.value)"><span id="music-duration">0:00</span></div>
          <div class="volume-container"><span>🔊</span><input type="range" id="music-volume" min="0" max="100" value="100" oninput="window.setVolume(this.value)"></div>
          <div class="playlist" id="music-playlist"></div>
        </div>
        <div class="field"><label>添加音乐到歌单</label><input id="music-name" placeholder="歌曲名 / 歌手" style="margin-bottom:6px;"><input id="music-url" placeholder="音乐直链 (MP3/URL)"><button class="primary" style="width:100%;padding:8px;margin-top:6px;" onclick="window.addMusic()">+ 添加并播放</button></div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 全局工具 ====================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,10);
const LS = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

// ==================== 默认数据 ====================
const DEFAULT_STATE = {
  name: '你', house: '未分院', year: 1, scene: '霍格沃茨特快列车', time: '1991年9月1日 · 上午',

window.renderStatus = () => {
  const s = gameState, st = s.stats;
  $('ui-name').textContent = s.name; $('ui-house').textContent = s.house; $('ui-year').textContent = s.year + ' 年级';
  $('ui-scene').textContent = s.scene; $('ui-time').textContent = s.time;
  $('ui-mana-t').textContent = Math.round(st.mana) + '/' + st.maxMana;
  $('ui-mana-b').style.width = clamp(st.mana / st.maxMana * 100, 0, 100) + '%';
  $('ui-stam-t').textContent = Math.round(st.stamina) + '/' + st.maxStamina;
  $('ui-stam-b').style.width = clamp(st.stamina / st.maxStamina * 100, 0, 100) + '%';
  $('ui-galleons').textContent = '💰 ' + st.galleons;
  $('ui-inventory').innerHTML = s.inventory.length ? s.inventory.map(i => `<span class="tag">${esc(i)}</span>`).join('') : '<span style="color:#4c5e7d;font-size:11px">空空如也</span>';
  $('ui-relations').innerHTML = Object.keys(s.relations).length ? Object.entries(s.relations).map(([k,v]) => `<div class="rel"><span>${esc(k)}</span><span class="v ${v>=0?'pos':'neg'}">${v>=0?'+':''}${v}</span></div>`).join('') : '<span style="color:#4c5e7d;font-size:11px">还没有结识任何人</span>';

  let yearStr = '2000年'; let timeStr = '未知';
  if (s.time) {
    const match = s.time.match(/(\d{4}年)/); if (match) yearStr = match[1];
    const timeMatch = s.time.match(/·\s*(.+)$/);
    if (timeMatch) timeStr = timeMatch[1].trim(); else timeStr = s.time.replace(/^\d{4}年\d+月\d+日\s*·?\s*/, '') || s.time;

  $('ui-header-actors').textContent = actors.join('、');
};

// 提取站子模型（拉取模型列表）
window.fetchModels = async () => {
  const url = $('cfg-url').value.trim();
  const key = $('cfg-key').value.trim();
  if (!url || !key) return alert('请先填写接口地址和 API Key');
  const modelListDiv = $('model-list');
  modelListDiv.innerHTML = '拉取中...';
  try {
    let baseUrl = url.replace(/\/chat\/completions.*$/, '');
    if (baseUrl.endsWith('/v1')) baseUrl += '/models'; else baseUrl += '/v1/models';
    const res = await fetch(baseUrl, { headers: { 'Authorization': 'Bearer ' + key } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const models = data.data || data.models || [];
    if (models.length === 0) { modelListDiv.innerHTML = '未找到可用模型'; return; }
    modelListDiv.innerHTML = `找到 ${models.length} 个模型，点击选择：<br>` + models.map(m => `<span class="tag" style="cursor:pointer;" onclick="document.getElementById('cfg-model').value='${m.id}'">${m.id}</span>`).join(' ');
  } catch (err) {
    modelListDiv.innerHTML = `拉取失败：${err.message}`;
  }
};

  LS.set('hp_presets', presets); window.renderPresetList();
};

function recentContext(extra='') { return displayHistory.slice(-8).map(m => m.text).join('\n') + '\n' + (extra||''); }
function matchWorldbook(text) {
  const wb = worldbooks.find(w => w.id === activeWorldbookId); if (!wb) return '（未启用世界书）';
  const hits = [];
  wb.entries.forEach(e => { if(!e.enabled) return; if(e.constant) { hits.push(e); return; } if((e.keywords||[]).some(k => k && text.includes(k.trim()))) hits.push(e); });
  return hits.length ? hits.map(e => `【${e.name}】\n${e.content}`).join('\n\n') : '（本次没有触发额外设定）';
}
function formatState() {
  const s = gameState, st = s.stats;
  return `姓名：${s.name}\n学院：${s.house}\n年级：${s.year}年级\n当前场景：${s.scene}\n游戏内时间：${s.time}\n在场人物：${(s.actors||['你']).join('、')}\n魔力：${Math.round(st.mana)}/${st.maxMana}\n体力：${Math.round(st.stamina)}/${st.maxStamina}\n加隆：${st.galleons}\n随身物品：${s.inventory.join('、')||'无'}\n人物关系：${Object.entries(s.relations).map(([k,v])=>`${k}(${v>=0?'+':''}${v})`).join('、')||'无'}`;
}
function buildSystemPrompt(extra='') {
  const preset = presets.find(p => p.id === activePresetId) || presets[0];
  let finalPrompt = '';
  if(preset && preset.prompts) {
    preset.prompts.forEach(entry => {
      if (!entry.enabled) return;
      let content = entry.content;
      content = content.replace(/\{\{state\}\}/g, formatState()).replace(/\{\{worldbook\}\}/g, matchWorldbook(recentContext(extra)));
      finalPrompt += content + '\n\n';
    });
  }
  return finalPrompt.trim() || '你是一个文字冒险游戏GM。';
}

window.onSend = () => { const el = $('user-input'); const v = el.value.trim(); if(!v || busy) return; el.value = ''; el.style.height = 'auto'; window.sendAction(v); };
window.sendAction = async (text) => {
  if(busy) return; busy = true;
  $('send-btn').disabled = true; $('user-input').disabled = true; $('options').innerHTML = '';
  window.pushDisplay('user', text); history.push({ role: 'user', content: text });
  const messages = [{ role: 'system', content: buildSystemPrompt(text) }, ...history.slice(-10)];
  window.showLoading();

  try {
    let raw;
    const apiProfile = apiProfiles.find(p => p.id === activeApiProfileId);
    if (!apiProfile || !apiProfile.key) {
      await new Promise(r => setTimeout(r, 800));
      raw = JSON.stringify({ narration: `[模拟模式] 你刚才说了：“${text}”。\n\n由于你还没有填写 API 密钥，这是系统模拟的回复。\n\n去点右上角的 ⚙ 设置填上你的中转站和 Key，就能接入真正的 AI 了！`, state_changes: { mana: -5, stamina: -5 }, options: ["去填写 API", "继续随便按按"] });
    } else {
      const res = await fetch(apiProfile.url, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiProfile.key },
        body: JSON.stringify({ model: apiProfile.model, messages, temperature: apiProfile.temperature })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const json = await res.json(); raw = json?.choices?.[0]?.message?.content;
      if (!raw) throw new Error('接口返回格式异常');
    }

    window.hideLoading(); history.push({ role: 'assistant', content: raw }); LS.set('hp_history', history);
    let s = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) s = s.slice(a, b + 1);
    let data; try { data = JSON.parse(s); } catch(e) { data = { narration: raw, state_changes: {}, options: [] }; }
    window.pushDisplay('assistant', data.narration || data.text || '（无叙述）');
    
    if (data.state_changes) {
      const c = data.state_changes, st = gameState.stats;
      if (typeof c.mana === 'number') st.mana = clamp(st.mana + c.mana, 0, st.maxMana);
      if (typeof c.stamina === 'number') st.stamina = clamp(st.stamina + c.stamina, 0, st.maxStamina);
      if (typeof c.galleons === 'number') st.galleons = Math.max(0, st.galleons + c.galleons);
      if (c.scene) gameState.scene = c.scene; if (c.time) gameState.time = c.time;
      if (c.house) gameState.house = c.house;
      if (Array.isArray(c.inventory_add)) c.inventory_add.forEach(i => { if(!gameState.inventory.includes(i)) gameState.inventory.push(i); });
      if (c.relations) for(const [k,v] of Object.entries(c.relations)) { gameState.relations[k] = (gameState.relations[k]||0) + v; }
      if (Array.isArray(c.actors)) gameState.actors = c.actors;
      LS.set('hp_state', gameState); window.renderStatus();
    }
    window.renderOptions(data.options);
  } catch(err) {
    window.hideLoading(); window.pushDisplay('system', '⚠ ' + err.message); history.pop(); LS.set('hp_history', history);
  } finally { busy = false; $('send-btn').disabled = false; $('user-input').disabled = false; }
};

// ==================== 音乐播放器 ====================
window.renderMusicPlaylist = () => {
  const box = $('music-playlist'); if (!box) return;
  box.innerHTML = playlist.map((item, index) => `
    <div class="playlist-item ${index === currentTrackIndex ? 'active' : ''}" onclick="window.playTrack(${index})">
      <span>${esc(item.name)}</span>
      <span class="delete-btn" onclick="event.stopPropagation(); window.removeMusic(${index})">✕</span>
    </div>
  `).join('');
  if (playlist.length === 0) box.innerHTML = '<div style="font-size:11px;color:#4c5e7d;text-align:center;padding:10px;">歌单为空</div>';
};
window.addMusic = () => {
  const name = $('music-name').value.trim(); const url = $('music-url').value.trim();
  if (!url) return alert('请输入音乐链接');
  playlist.push({ name: name || '未知歌曲', url }); LS.set('hp_playlist', playlist);
  $('music-name').value = ''; $('music-url').value = '';
  if (playlist.length === 1) window.playTrack(0); window.renderMusicPlaylist();
};
window.removeMusic = (index) => {
  playlist.splice(index, 1); LS.set('hp_playlist', playlist);
  if (currentTrackIndex === index) { audio.pause(); currentTrackIndex = -1; isPlaying = false; $('music-title').textContent = '暂无播放'; $('music-play-btn').textContent = '▶'; }
  else if (currentTrackIndex > index) currentTrackIndex--;
  window.renderMusicPlaylist();
};
window.playTrack = (index) => {
  if (index < 0 || index >= playlist.length) return;
  currentTrackIndex = index; const track = playlist[index]; audio.src = track.url;
  audio.play().catch(e => window.pushDisplay('system', '⚠ 音乐播放失败'));
  isPlaying = true; $('music-title').textContent = track.name; $('music-artist').textContent = '播放中...'; $('music-play-btn').textContent = '⏸';
  window.renderMusicPlaylist();
};
window.togglePlay = () => {
  if (playlist.length === 0) return alert('请先添加音乐');
  if (currentTrackIndex === -1) { window.playTrack(0); return; }
  if (isPlaying) { audio.pause(); isPlaying = false; $('music-play-btn').textContent = '▶'; $('music-artist').textContent = '暂停'; }
  else { audio.play(); isPlaying = true; $('music-play-btn').textContent = '⏸'; $('music-artist').textContent = '播放中...'; }
};
window.prevTrack = () => { if (playlist.length === 0) return; let index = currentTrackIndex - 1; if (index < 0) index = playlist.length - 1; window.playTrack(index); };
window.nextTrack = () => { if (playlist.length === 0) return; let index = (currentTrackIndex + 1) % playlist.length; window.playTrack(index); };
window.seekMusic = (value) => { if (audio.duration) audio.currentTime = (value / 100) * audio.duration; };
window.setVolume = (value) => { audio.volume = value / 100; };
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100; const progress = $('music-progress');
    if (progress && document.activeElement !== progress) progress.value = percent;
    $('music-current').textContent = formatTime(audio.currentTime); $('music-duration').textContent = formatTime(audio.duration);
  }
});
audio.addEventListener('ended', () => { window.nextTrack(); });
function formatTime(seconds) { if (isNaN(seconds)) return '0:00'; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }

// ==================== 美化设置 ====================
window.renderBeautifyUI = () => {
  $('ui-brightness').value = beautifySettings.brightness; $('val-brightness').textContent = beautifySettings.brightness + '%';
  $('ui-contrast').value = beautifySettings.contrast; $('val-contrast').textContent = beautifySettings.contrast + '%';
  $('ui-blur').value = beautifySettings.blur; $('val-blur').textContent = beautifySettings.blur + 'px';
  $('cfg-wallpaper').value = beautifySettings.wallpaper;
  applyFilter('brightness', beautifySettings.brightness); applyFilter('contrast', beautifySettings.contrast); applyFilter('blur', beautifySettings.blur);
  if (beautifySettings.wallpaper) document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(26,40,72,0.8) 0%, rgba(10,15,28,0.95) 80%), url('${beautifySettings.wallpaper}')`;
};
window.applyFilter = (type, value) => {
  if (type === 'brightness') { document.documentElement.style.setProperty('--app-brightness', value + '%'); $('val-brightness').textContent = value + '%'; beautifySettings.brightness = parseInt(value); }
  else if (type === 'contrast') { document.documentElement.style.setProperty('--app-contrast', value + '%'); $('val-contrast').textContent = value + '%'; beautifySettings.contrast = parseInt(value); }
  else if (type === 'blur') { document.documentElement.style.setProperty('--app-blur', value + 'px'); $('val-blur').textContent = value + 'px'; beautifySettings.blur = parseInt(value); }
};
window.applyWallpaper = (url) => { if (!url) return; beautifySettings.wallpaper = url; document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(26,40,72,0.8) 0%, rgba(10,15,28,0.95) 80%), url('${url}')`; window.pushDisplay('system', '✓ 壁纸已更新'); };
window.uploadWallpaper = (event) => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { beautifySettings.wallpaper = e.target.result; document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(26,40,72,0.8) 0%, rgba(10,15,28,0.95) 80%), url('${e.target.result}')`; window.pushDisplay('system', '✓ 本地壁纸已应用'); }; reader.readAsDataURL(file); };
window.saveBeautify = () => { LS.set('hp_beautify', beautifySettings); window.pushDisplay('system', '✓ 美化设置已保存'); };
window.importBeautifyJSON = (event) => {
  const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const json = JSON.parse(e.target.result); let css = json.custom_css || json.css || json.style || '';
      if (!css) return alert('未在 JSON 中找到 CSS 美化代码');
      let adaptedCss = css.replace(/#chat\b/g, '#story').replace(/\.mes\b/g, '.msg').replace(/\.mes_block\b/g, '.msg').replace(/\.mes_text\b/g, '.msg').replace(/\.ch_name\b/g, '.msg.assistant').replace(/\.drawer-content\b/g, '.modal-box').replace(/\.menu_button\b/g, 'button');
      let styleTag = $('imported-css'); if (!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'imported-css'; document.head.appendChild(styleTag); }
      styleTag.textContent = adaptedCss; window.pushDisplay('system', '✓ JSON 美化已导入并应用');
    } catch(err) { alert('解析 JSON 失败: ' + err.message); }
  };
  reader.readAsText(file);
};

// ==================== 重开与初始化 ====================
window.resetGame = () => {
  if(!confirm('确定要清空进度重新开始吗？')) return;
  gameState = JSON.parse(JSON.stringify(DEFAULT_STATE)); history = []; displayHistory = [];
  LS.set('hp_state', gameState); LS.set('hp_history', history); LS.set('hp_display', displayHistory);
  window.renderStatus(); window.renderStory(); window.renderOptions([]);
  window.sendAction('（游戏开始）请描述我收到霍格沃茨录取通知书、在国王十字车站穿过 9¾ 站台登上特快列车的情景，作为故事的开场。');
};

window.addEventListener('DOMContentLoaded', () => {
  try {
    window.renderStatus(); window.renderStory();
    if (beautifySettings.wallpaper) document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(26,40,72,0.8) 0%, rgba(10,15,28,0.95) 80%), url('${beautifySettings.wallpaper}')`;
    document.documentElement.style.setProperty('--app-brightness', beautifySettings.brightness + '%');
    document.documentElement.style.setProperty('--app-contrast', beautifySettings.contrast + '%');
    document.documentElement.style.setProperty('--app-blur', beautifySettings.blur + 'px');
    audio.volume = 1.0;
    if(displayHistory.length === 0) {
      if(apiProfiles.find(p => p.id === activeApiProfileId)?.key) window.sendAction('（游戏开始）请描述我收到霍格沃茨录取通知书，在车站登上特快列车的情景，作为故事的开场。');
      else window.pushDisplay('system', '👋 欢迎！先点右上角「⚙」填好设置，再点重开开始游戏。');
    }
    const ta = $('user-input');
    ta.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); window.onSend(); } });
  } catch (err) {
    alert("初始化失败，可能是旧数据冲突。请点击设置里的【重置所有本地缓存】按钮。\\n错误信息: " + err.message);
  }
});

// 全局错误拦截，防止手机端白屏卡死无提示
window.onerror = function(msg, url, line, col, error) {
  alert("发生错误: " + msg + "\\n行号: " + line);
  return false;
};
</script>
