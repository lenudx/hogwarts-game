<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>霍格沃茨模拟器</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #060913; --bg-mid: #0d1424; --bg-light: #18233d;
  --border-dim: #1e2a45; --border-glow: #3b5b8c;
  --text-main: #c8d4ee; --text-dim: #7a8dae; --text-faint: #4c5e7d;
  --accent-blue: #5c9cff; --accent-cyan: #66ccff;
  --accent-glow: rgba(92, 156, 255, 0.25);
  --success: #4a9d7a; --danger: #b5544a;
  --app-brightness: 100%; --app-contrast: 100%; --app-blur: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Crimson Text', Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
  color: var(--text-main); font-size: 14px; background-color: var(--bg-deep);
  background-image: radial-gradient(circle at 50% 0%, #1a2848 0%, #0a0f1c 80%);
  -webkit-font-smoothing: antialiased;
}
/* ★ 关键修复：滤镜只加在内容区，不要加在 body 上，防止手机卡死 */
#app { 
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; 
  filter: brightness(var(--app-brightness)) contrast(var(--app-contrast)) blur(var(--app-blur));
  transition: filter 0.2s;
}
button, input, textarea, select { font-family: inherit; font-size: 13px; }
button {
  cursor: pointer; border-radius: 6px; border: 1px solid var(--border-dim);
  background: rgba(13, 20, 36, 0.85); color: var(--text-main);
  padding: 7px 12px; transition: 0.2s; touch-action: manipulation; user-select: none;
}
button:active { transform: scale(0.96); }
button:hover { border-color: var(--border-glow); background: rgba(24, 35, 61, 0.9); }
button.primary {
  background: linear-gradient(135deg, #1a3a6b, #2a5a9c);
  border-color: var(--accent-blue); color: #fff; font-weight: 600;
  font-family: 'Cinzel', serif; letter-spacing: 0.5px; box-shadow: 0 0 10px var(--accent-glow);
}
button.danger { border-color: #5a2b2b; color: #e08a8a; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 6px; 
  background: var(--bg-deep); border-radius: 3px; outline: none; 
  border: 1px solid var(--border-dim); margin: 8px 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; 
  border-radius: 50%; background: var(--accent-blue); cursor: pointer;
}
header {
  flex-shrink: 0; display: flex; align-items: center;
  padding: 6px 10px; background: rgba(6, 9, 19, 0.95);
  border-bottom: 1px solid var(--border-dim); gap: 8px; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header-info { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.header-info .h-line { font-size: 11px; color: var(--text-dim); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.header-info .h-line span { color: var(--accent-blue); font-family: 'Cinzel', serif; font-weight: 600; }
.header-info .h-line .h-label { color: var(--text-faint); font-family: inherit; font-weight: 400; }
main { flex: 1; display: flex; overflow: hidden; position: relative; }
#sidebar { width: 240px; flex-shrink: 0; background: rgba(9, 14, 26, 0.95); border-right: 1px solid var(--border-dim); overflow-y: auto; padding: 10px; transition: 0.25s; z-index: 20; }
#sidebar.hidden { transform: translateX(-100%); position: absolute; top: 0; bottom: 0; left: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.8); }
#main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#story { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 92%; margin-bottom: 14px; line-height: 1.8; animation: fadeIn 0.3s ease; word-break: break-word; white-space: pre-wrap; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg.assistant { margin-right: auto; background: rgba(13, 20, 36, 0.9); border: 1px solid var(--border-dim); border-left: 3px solid var(--accent-blue); border-radius: 3px 10px 10px 3px; padding: 14px 16px; }
.msg.user { margin-left: auto; background: rgba(24, 35, 61, 0.9); border: 1px solid var(--border-glow); border-radius: 10px 3px 3px 10px; padding: 10px 14px; }
.msg.system { margin: 0 auto; text-align: center; font-size: 12px; color: var(--accent-cyan); background: rgba(13, 20, 36, 0.9); border: 1px solid var(--border-glow); border-radius: 20px; padding: 6px 16px; max-width: 95%; }
#options { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; padding: 0 16px 8px; max-height: 120px; overflow-y: auto; }
#options button { text-align: left; padding: 8px 12px 8px 28px; position: relative; font-size: 12px; }
#options button::before { content: "▸"; position: absolute; left: 10px; color: var(--accent-blue); }
#input-bar { flex-shrink: 0; display: flex; gap: 8px; padding: 8px 12px 12px; background: rgba(9, 14, 26, 0.95); border-top: 1px solid var(--border-dim); align-items: flex-end; }
#user-input { flex: 1; min-height: 40px; max-height: 100px; line-height: 1.5; padding: 10px; background: rgba(6, 9, 19, 0.8); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-main); outline: none; resize: none; }
#user-input:focus { border-color: var(--accent-blue); }
#send-btn { height: 40px; flex-shrink: 0; padding: 0 16px; }
.card { background: rgba(13, 20, 36, 0.85); border: 1px solid var(--border-dim); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.card h4 { font-family: 'Cinzel', serif; font-size: 10px; color: var(--accent-blue); letter-spacing: 1.5px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; gap: 8px; }
.kv .k { color: var(--text-dim); flex-shrink: 0; } .kv .v { text-align: right; word-break: break-all; }
.bar-row { margin: 6px 0; } .bar-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
.bar { height: 6px; background: rgba(6, 9, 19, 0.8); border-radius: 3px; overflow: hidden; border: 1px solid rgba(30, 42, 69, 0.5); }
.bar > i { display: block; height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.bar.mana > i { background: linear-gradient(90deg, #3a5a8a, #5a8abf); } .bar.stam > i { background: linear-gradient(90deg, #2a6a4a, #4a9d7a); }
.tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 12px; background: rgba(24, 35, 61, 0.8); border: 1px solid var(--border-dim); margin: 2px 2px 2px 0; }
.rel { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; } .rel .v.pos { color: var(--success); } .rel .v.neg { color: var(--danger); }
.modal { position: fixed; inset: 0; background: rgba(3, 6, 12, 0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
.modal.show { display: flex; }
.modal-box { background: rgba(13, 20, 36, 0.98); border: 1px solid var(--border-glow); border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border-dim); flex-shrink: 0; }
.modal-head h3 { font-family: 'Cinzel', serif; font-size: 14px; color: var(--accent-cyan); }
.settings-tabs { display: flex; border-bottom: 1px solid var(--border-dim); flex-shrink: 0; background: rgba(6, 9, 19, 0.5); overflow-x: auto; }
.settings-tabs button { flex: 1; min-width: 70px; border: none; background: transparent; border-radius: 0; padding: 10px 5px; font-size: 12px; color: var(--text-dim); border-bottom: 2px solid transparent; transition: 0.2s; white-space: nowrap; }
.settings-tabs button.active { color: var(--accent-cyan); border-bottom-color: var(--accent-blue); background: rgba(92, 156, 255, 0.05); }
.modal-body { overflow-y: auto; padding: 14px; flex: 1; }
.tab-pane { display: none; } .tab-pane.active { display: block; }
.field { margin-bottom: 12px; } .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.field input, .field textarea, .field select { width: 100%; padding: 8px; background: rgba(6, 9, 19, 0.9); border: 1px solid var(--border-dim); border-radius: 6px; color: var(--text-main); outline: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent-blue); }
.music-player { background: rgba(6, 9, 19, 0.6); border: 1px solid var(--border-dim); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.music-info { text-align: center; margin-bottom: 10px; } .music-info .title { font-size: 14px; font-weight: 600; color: var(--accent-cyan); } .music-info .artist { font-size: 11px; color: var(--text-dim); }
.music-controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
.music-controls button { width: 36px; height: 36px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
.music-controls button.play-btn { width: 46px; height: 46px; font-size: 20px; background: var(--accent-blue); color: #fff; }
.progress-container { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-dim); }
.volume-container { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
.playlist { max-height: 150px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--border-dim); padding-top: 8px; }
.playlist-item { display: flex; justify-content: space-between; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.playlist-item:hover { background: rgba(92, 156, 255, 0.1); } .playlist-item.active { color: var(--accent-blue); background: rgba(92, 156, 255, 0.15); }
.playlist-item .delete-btn { color: var(--danger); cursor: pointer; padding: 0 4px; }
.preset-entry { background: rgba(6, 9, 19, 0.6); border: 1px solid var(--border-dim); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
.preset-entry .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.preset-entry .entry-head input { flex: 1; margin-right: 6px; font-size: 12px; }
.preset-entry .entry-controls { display: flex; gap: 4px; }
.preset-entry .entry-controls button { padding: 2px 6px; font-size: 11px; }
.preset-entry textarea { font-size: 11px; font-family: monospace; width: 100%; margin-top: 4px; }
.loading { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-cyan); animation: bounce 1.3s infinite; }
.dot:nth-child(2) { animation-delay: 0.18s; } .dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
@media (min-width: 821px) { .only-mobile { display: none; } #sidebar { position: static; transform: none !important; } }
@media (max-width: 480px) { .msg.assistant { padding: 12px 13px; font-size: 13px; } #story { padding: 12px; } #options { padding: 0 12px 6px; } header { padding: 4px 8px; } .header-info .h-line { font-size: 10px; } }
/* ===== 消息长按菜单 + 版本切换 ===== */
.msg { position: relative; }
.msg-ver-badge {
  position: absolute; top: 6px; right: 8px;
  font-size: 9px; color: var(--text-dim);
  background: rgba(0,0,0,0.5);
  padding: 1px 7px; border-radius: 8px;
  pointer-events: none;
  font-family: 'Cinzel', serif;
  letter-spacing: 1px;
}
.msg-menu-overlay {
  position: fixed; inset: 0; z-index: 2200;
  background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.msg-menu-overlay.show { display: flex; }
.msg-menu-box {
  background: rgba(13,20,36,0.98);
  border: 1px solid var(--border-glow);
  border-radius: 12px;
  min-width: 240px; max-width: 320px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
}
.msg-menu-title {
  padding: 12px 18px 8px;
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 2px;
  border-bottom: 1px solid var(--border-dim);
  font-family: 'Cinzel', serif;
}
.msg-menu-box button {
  display: block; width: 100%;
  padding: 14px 18px;
  background: transparent;
  border: none; border-bottom: 1px solid var(--border-dim);
  color: var(--text-main);
  font-size: 14px; text-align: left;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.msg-menu-box button:last-child { border-bottom: none; }
.msg-menu-box button:hover { background: rgba(92,156,255,0.1); }
.msg-menu-box button.danger { color: var(--danger); }
.msg-menu-box button.cancel { color: var(--text-dim); text-align: center; }
/* ===== 开场迷幻文字动画 ===== */
#intro-anim {
  position: fixed; inset: 0; z-index: 2500;
  background: radial-gradient(circle at 50% 40%, #1a1030 0%, #0a0612 60%, #000 100%);
  display: none; align-items: center; justify-content: center;
  overflow: hidden;
}
#intro-anim.show { display: flex; }
#intro-anim::before {
  content: ''; position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 20% 30%, rgba(120,80,200,0.14) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(200,120,80,0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(60,120,180,0.10) 0%, transparent 50%);
  animation: introDrift 22s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes introDrift {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-3%, -2%) scale(1.08); }
}
#intro-anim::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.55), transparent),
    radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.30), transparent),
    radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.40), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.25), transparent),
    radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.30), transparent);
  background-size: 100% 100%;
  animation: introTwinkle 5s ease-in-out infinite alternate;
  pointer-events: none;
  opacity: 0.7;
}
@keyframes introTwinkle {
  0% { opacity: 0.35; } 100% { opacity: 0.85; }
}
#intro-text-wrap {
  position: relative; z-index: 2;
  max-width: 620px; padding: 0 28px;
  text-align: center;
}
#intro-text {
  font-family: 'Crimson Text', Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
  font-size: 20px; line-height: 2.1;
  color: #e8dcff;
  letter-spacing: 2px;
  white-space: pre-wrap;
  text-shadow:
    0 0 12px rgba(180,140,255,0.5),
    0 0 30px rgba(140,100,220,0.25);
  min-height: 5em;
}
#intro-text .cursor {
  display: inline-block; width: 10px; height: 20px;
  background: #d4a9ff; margin-left: 2px; vertical-align: -3px;
  animation: introBlink 0.9s steps(2) infinite;
  box-shadow: 0 0 10px rgba(212,169,255,0.8);
}
@keyframes introBlink {
  0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; }
}
#intro-enter {
  margin-top: 44px;
  font-family: 'Cinzel', 'Crimson Text', serif;
  font-size: 14px; letter-spacing: 6px;
  color: #c9b3ff;
  background: transparent;
  border: 1px solid rgba(180,140,255,0.4);
  padding: 12px 32px;
  border-radius: 30px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 1.2s ease, background 0.3s, color 0.3s, box-shadow 0.3s;
  pointer-events: none;
  text-shadow: 0 0 8px rgba(180,140,255,0.6);
}
#intro-enter.show {
  opacity: 1; pointer-events: auto;
}
#intro-enter:hover {
  background: rgba(120,80,200,0.15);
  color: #fff;
  box-shadow: 0 0 24px rgba(180,140,255,0.4);
}
#intro-skip {
  position: absolute; right: 20px; top: 20px; z-index: 3;
  font-size: 11px; color: rgba(200,180,255,0.4);
  background: transparent; border: none; cursor: pointer;
  letter-spacing: 2px; padding: 8px;
  font-family: 'Crimson Text', serif;
}
#intro-skip:hover { color: rgba(220,200,255,0.9); }
/* ===== 侧栏人物属性 ===== */
.cc-sidebar-photo-wrap { text-align: center; margin-bottom: 10px; }
.cc-sidebar-photo { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent-blue); object-fit: cover; background: rgba(6,9,19,.8); cursor: pointer; }
.cc-sidebar-photo-empty { width: 84px; height: 84px; border-radius: 50%; border: 2px dashed var(--border-glow); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-faint); cursor: pointer; background: rgba(6,9,19,.8); }
.cc-sidebar-timeline { font-size: 10px; color: var(--text-dim); text-align: center; padding: 6px; background: rgba(13,20,36,.5); border-radius: 6px; margin-bottom: 8px; line-height: 1.5; }
.cc-sidebar-timeline .cur { color: var(--accent-cyan); font-weight: 600; }
.cc-sidebar-nick-item { display: flex; gap: 4px; padding: 3px 0; font-size: 11px; }
.cc-sidebar-nick-item .who { color: var(--text-dim); flex-shrink: 0; min-width: 56px; }
.cc-sidebar-nick-item .nick { color: var(--text-main); }
/* ===== 人物卡 ===== */
.cc-photo-wrap { text-align: center; margin-bottom: 12px; }
.cc-photo { width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--accent-blue); object-fit: cover; background: rgba(6,9,19,.8); cursor: pointer; }
.cc-photo-empty { width: 96px; height: 96px; border-radius: 50%; border: 2px dashed var(--border-glow); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: var(--text-faint); cursor: pointer; background: rgba(6,9,19,.8); }
.cc-name-line { text-align: center; margin-bottom: 6px; }
.cc-name-line .nm { font-size: 18px; color: var(--accent-cyan); font-family: 'Cinzel', serif; font-weight: 600; }
.cc-name-line .en { font-size: 12px; color: var(--text-dim); font-style: italic; margin-top: 2px; }
.cc-name-line .sub { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
.cc-sec { border: 1px solid var(--border-dim); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.cc-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(13,20,36,.85); cursor: pointer; user-select: none; }
.cc-sec-head h4 { font-family: 'Cinzel', serif; font-size: 11px; color: var(--accent-blue); letter-spacing: 1.5px; font-weight: 600; }
.cc-sec-head .arrow { color: var(--text-dim); transition: transform .2s; font-size: 11px; }
.cc-sec.open .cc-sec-head .arrow { transform: rotate(90deg); }
.cc-sec-body { display: none; padding: 10px 12px; background: rgba(6,9,19,.6); border-top: 1px solid var(--border-dim); }
.cc-sec.open .cc-sec-body { display: block; }
.cc-row { display: flex; padding: 6px 0; border-bottom: 1px dashed rgba(30,42,69,.5); font-size: 12px; gap: 8px; }
.cc-row:last-child { border-bottom: none; }
.cc-row .cc-k { color: var(--text-dim); flex-shrink: 0; min-width: 76px; }
.cc-row .cc-v { color: var(--text-main); flex: 1; word-break: break-word; white-space: pre-wrap; }
.cc-row .cc-v.empty { color: var(--text-faint); font-style: italic; }
.cc-edit-input, .cc-edit-textarea { width: 100%; padding: 6px 8px; background: rgba(6,9,19,.9); border: 1px solid var(--border-dim); border-radius: 4px; color: var(--text-main); font-size: 12px; font-family: inherit; }
.cc-edit-textarea { resize: vertical; min-height: 50px; }
.cc-nick-item { display: flex; gap: 6px; margin-bottom: 6px; }
.cc-nick-item input { flex: 1; }
.cc-nick-item button { padding: 4px 8px; font-size: 11px; }
.cc-grade-badge { display: inline-block; padding: 2px 10px; background: rgba(92,156,255,.15); border: 1px solid var(--border-glow); border-radius: 12px; font-size: 11px; color: var(--accent-cyan); margin-left: 6px; }
.cc-toolbar { display: flex; gap: 6px; margin-bottom: 12px; }
.cc-toolbar button { flex: 1; padding: 8px; font-size: 12px; }
.cc-subject-block { margin-top: 8px; padding: 8px; background: rgba(13,20,36,.5); border-radius: 6px; }
.cc-subject-block .sb-title { font-size: 11px; color: var(--accent-cyan); margin-bottom: 6px; font-weight: 600; }
.cc-subject-line { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; gap: 8px; }
.cc-subject-line .grade-input { width: 70px; padding: 3px 6px; font-size: 11px; }
.cc-grade-chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px 4px 2px 0; background: rgba(30,42,69,.6); border: 1px solid var(--border-dim); }
.cc-grade-chip.O { color: #4ade80; border-color: rgba(74,222,128,.4); }
.cc-grade-chip.E { color: #60a5fa; border-color: rgba(96,165,250,.4); }

<body>

<div id="app">
  <header>
    <div class="header-left"><button class="only-mobile" onclick="window.toggleSidebar()">☰</button></div>
    <div class="header-info">
      <div class="h-line"><span class="h-label">年份</span><span id="ui-header-year">2000年</span> <span style="color:#4c5e7d;">|</span> <span class="h-label">时间</span><span id="ui-header-time">上午</span></div>
      <div class="h-line"><span class="h-label">地点</span><span class="h-scene" id="ui-header-scene" style="color:var(--accent-cyan);">霍格沃茨特快列车</span></div>
      <div class="h-line"><span class="h-label">在场</span><span class="h-actors" id="ui-header-actors">你</span></div>
    </div>
    <div class="header-right"><button onclick="window.openModal('modal-settings')">⚙</button></div>
  </header>

  <main>
    <aside id="sidebar" class="hidden">
  <div id="cc-sidebar-body"></div>
</aside>

    <div id="main-content">
      <div id="story"></div>
      <div id="options"></div>
      <div id="input-bar">
        <textarea id="user-input" rows="1" placeholder="你想做什么？（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="primary" id="send-btn" onclick="window.onSend()">发送</button>
      </div>
    </div>
  </main>
</div>
<div class="msg-menu-overlay" id="msg-menu-overlay" onclick="window.hideMesMenu(event)">
  <div class="msg-menu-box" onclick="event.stopPropagation()">
    <div class="msg-menu-title" id="msg-menu-title">◈ 消息操作</div>
    <button onclick="window.menuRegen()">🔁 再说一个（重新生成）</button>
    <button onclick="window.menuEdit()">✏️ 修改内容</button>
    <button onclick="window.menuDelete()" class="danger">🗑 删除这条消息</button>
    <button onclick="window.hideMesMenu()" class="cancel">取消</button>
  </div>
</div>
<div id="intro-anim">
  <button id="intro-skip" onclick="window.skipIntroAnim()">跳过 ↦</button>
  <div id="intro-text-wrap">
    <div id="intro-text"></div>
    <button id="intro-enter" onclick="window.finishIntroAnim()">睁 开 眼</button>
  </div>
</div>
<div class="modal" id="modal-create">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-head"><h3 id="cc-create-title">📝 建立档案</h3></div>
    <div class="modal-body" id="cc-create-body"></div>
  </div>
</div>
<div class="modal" id="modal-settings">
  <div class="modal-box">
    <div class="modal-head"><h3>⚙ 系统设置</h3><button onclick="window.closeModal('modal-settings')">关闭</button></div>
    <div class="settings-tabs">
      <button class="active" onclick="window.switchSettingsTab('tab-api')">API</button>
      <button onclick="window.switchSettingsTab('tab-world')">世界书</button>
      <button onclick="window.switchSettingsTab('tab-preset')">预设</button>
      <button onclick="window.switchSettingsTab('tab-beautify')">美化</button>
      <button onclick="window.switchSettingsTab('tab-music')">音乐</button>
      <button onclick="window.switchSettingsTab('tab-save')">存档</button>
    </div>
    <div class="modal-body">
      <div class="tab-pane active" id="tab-api">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <label style="flex-shrink:0;">API 配置</label>
          <select id="api-profile-select" style="flex:1;" onchange="window.switchApiProfile(this.value)"></select>
          <button class="primary" onclick="window.newApiProfile()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deleteApiProfile()" style="padding:6px 10px;">删</button>
        </div>
        <div class="field"><label>接口地址</label><input id="cfg-url" placeholder="https://api.example.com/v1/chat/completions"></div>
        <div class="field"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
        <div class="field">
          <label>模型名</label>
          <div style="display:flex;gap:6px;">
            <input id="cfg-model" placeholder="gpt-4o-mini" style="flex:1;">
            <button onclick="window.fetchModels()" style="padding:8px;white-space:nowrap;">拉取模型</button>
          </div>
          <div id="model-list" style="margin-top:6px;font-size:11px;color:var(--text-dim);"></div>
        </div>
        <div class="field"><label>温度 (0~2)</label><input id="cfg-temp" type="number" step="0.1" min="0" max="2"></div>
        <button class="primary" style="width:100%;padding:10px" onclick="window.saveApiConfig()">保存当前 API 配置</button>
        <button class="danger" style="width:100%;padding:8px;margin-top:10px;" onclick="window.resetAllData()">⚠ 重置所有本地缓存（如果卡死点这里）</button>
      </div>
      <!-- 世界书 -->
      <div class="tab-pane" id="tab-world">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <select id="worldbook-select" style="flex:1;" onchange="window.switchWorldbook(this.value)"></select>
          <button class="primary" onclick="window.newWorldbook()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deleteWorldbook()" style="padding:6px 10px;">删</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input type="file" id="import-world-json" accept=".json" style="display:none;" onchange="window.importWorldbook(event)">
          <button style="flex:1;" onclick="document.getElementById('import-world-json').click()">📂 导入酒馆世界书 JSON</button>
          <button class="primary" onclick="window.addWorldEntry()">+ 新增条目</button>
        </div>
        <div id="world-list"></div>
      </div>

      <!-- 预设 -->
      <div class="tab-pane" id="tab-preset">
        <div class="field" style="display:flex;gap:6px;align-items:center;">
          <select id="preset-select" style="flex:1;" onchange="window.switchPreset(this.value)"></select>
          <button class="primary" onclick="window.newPreset()" style="padding:6px 10px;">新建</button>
          <button class="danger" onclick="window.deletePreset()" style="padding:6px 10px;">删</button>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <input type="file" id="import-preset-json" accept=".json" style="display:none;" onchange="window.importPreset(event)">
          <button style="flex:1;" onclick="document.getElementById('import-preset-json').click()">📂 导入酒馆预设 JSON</button>
          <button class="primary" onclick="window.addPresetEntry()">+ 新增条目</button>
        </div>
        <div id="preset-list"></div>
      </div>

      <!-- 美化 -->
      <div class="tab-pane" id="tab-beautify">
        <div class="field"><label>全局亮度</label><input type="range" id="ui-brightness" min="50" max="150" value="100" oninput="window.applyFilter('brightness', this.value)"><span id="val-brightness" style="float:right;font-size:11px;color:var(--text-dim);">100%</span></div>
        <div class="field"><label>对比度 (清晰度)</label><input type="range" id="ui-contrast" min="50" max="150" value="100" oninput="window.applyFilter('contrast', this.value)"><span id="val-contrast" style="float:right;font-size:11px;color:var(--text-dim);">100%</span></div>
        <div class="field"><label>模糊度 (氛围)</label><input type="range" id="ui-blur" min="0" max="10" value="0" oninput="window.applyFilter('blur', this.value)"><span id="val-blur" style="float:right;font-size:11px;color:var(--text-dim);">0px</span></div>
        <hr style="border:0;border-top:1px solid var(--border-dim);margin:15px 0;">
        <div class="field"><label>壁纸链接</label><input id="cfg-wallpaper" placeholder="输入图片 URL" onchange="window.applyWallpaper(this.value)"></div>
        <div class="field"><label>或上传本地图片</label><input type="file" id="wallpaper-file" accept="image/*" onchange="window.uploadWallpaper(event)"></div>
        <hr style="border:0;border-top:1px solid var(--border-dim);margin:15px 0;">
        <div class="field"><label>导入 JSON 美化 (兼容酒馆主题)</label><input type="file" id="import-css-json" accept=".json" onchange="window.importBeautifyJSON(event)"><div style="font-size:11px;color:var(--text-faint);margin-top:4px;">上传 SillyTavern 的 JSON 主题文件，系统会自动提取 CSS 并尽量适配</div></div>
        <button class="primary" style="width:100%;padding:10px" onclick="window.saveBeautify()">保存美化设置</button>
        <button class="danger" style="width:100%;padding:10px;margin-top:8px;" onclick="window.resetBeautify()">↺ 回到最初美化设置</button>
      </div>

<!-- 存档 -->
<div class="tab-pane" id="tab-save">
  <div style="display:flex;gap:6px;margin-bottom:12px;">
    <button class="primary" style="flex:1;padding:10px;" onclick="window.createSave()">+ 新建存档</button>
    <button style="padding:10px;" onclick="document.getElementById('save-import-input').click()">导入</button>
  </div>
  <div style="font-size:11px;color:var(--text-dim);line-height:1.7;padding:10px;background:rgba(13,20,36,.5);border:1px dashed var(--border-dim);border-radius:6px;margin-bottom:12px;">
    ▸ 存档保存在浏览器本地，清缓存会丢。<br>

    ▸ 读档会覆盖当前进度。
  </div>
  <div id="save-list"></div>
  <input type="file" id="save-import-input" accept=".json" style="display:none;" onchange="window.importSaveFile(event)">
</div>

      <!-- 音乐 -->
      <div class="tab-pane" id="tab-music">
        <div class="music-player">
          <div class="music-info"><div class="title" id="music-title">暂无播放</div><div class="artist" id="music-artist">-</div></div>
          <div class="music-controls"><button onclick="window.prevTrack()">⏮</button><button class="play-btn" id="music-play-btn" onclick="window.togglePlay()">▶</button><button onclick="window.nextTrack()">⏭</button></div>
          <div class="progress-container"><span id="music-current">0:00</span><input type="range" id="music-progress" min="0" max="100" value="0" oninput="window.seekMusic(this.value)"><span id="music-duration">0:00</span></div>
          <div class="volume-container"><span>🔊</span><input type="range" id="music-volume" min="0" max="100" value="100" oninput="window.setVolume(this.value)"></div>
          <div class="playlist" id="music-playlist"></div>
        </div>
        <div class="field"><label>添加音乐到歌单</label><input id="music-name" placeholder="歌曲名 / 歌手" style="margin-bottom:6px;"><input id="music-url" placeholder="音乐直链 (MP3/URL)"><button class="primary" style="width:100%;padding:8px;margin-top:6px;" onclick="window.addMusic()">+ 添加并播放</button></div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 全局工具 ====================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,10);
const LS = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

// ==================== 默认数据 ====================
const DEFAULT_STATE = {
  name: '你', house: '未分院', year: 1, scene: '霍格沃茨特快列车', time: '1991年9月1日 · 上午',
  stats: { mana: 100, maxMana: 100, stamina: 100, maxStamina: 100, galleons: 12 },
  inventory: ['校服', '课本'], relations: {}, flags: {}, actors: ['你']
};

const DEFAULT_API_PROFILES = [{
  id: 'default', name: '默认配置', url: 'https://api.openai.com/v1/chat/completions',
  key: '', model: 'gpt-4o-mini', temperature: 0.9
}];

const DEFAULT_WORLDBOOKS = [{
  id: 'wb_default', name: '默认世界书',
  entries: [
    { id: uid(), name: '霍格沃茨四学院', enabled: true, constant: true, keywords: ['分院', '学院', '格兰芬多', '斯莱特林'], content: '格兰芬多：勇敢、胆识。斯莱特林：野心、精明。拉文克劳：智慧、学识。赫奇帕奇：勤奋、忠诚。' },
    { id: uid(), name: '魔法咒语速查', enabled: true, constant: false, keywords: ['咒语', '施法', '荧光闪烁'], content: '荧光闪烁(Lumos)：杖尖发光。漂浮咒(Wingardium Leviosa)：让物体悬浮。除你武器(Expelliarmus)：缴械咒。' }
  ]
}];

const DEFAULT_PRESETS = [{
  id: 'p_default', name: '霍格沃茨 GM（默认）', temperature: 0.9,
  prompts: [
    { id: uid(), name: '世界观设定', enabled: true, content: '时间：1991 年，哈利·波特与同届新生入学的那一年。玩家是一名刚收到录取通知书的十一岁新生。严格遵循原著设定，不出现现代科技、网络梗、打破第四面墙的内容。', role: 'system' },
    { id: uid(), name: '主持原则', enabled: true, content: '1. 用第二人称「你」叙述，沉浸式、有画面感。\n2. 每次只推进一小段剧情，绝不替玩家做决定。\n3. 玩家做出违背设定的行动时，让世界给出合理反馈（失败、扣分、被训斥）。\n4. NPC 台词与反应要符合原著性格。', role: 'system' },
    { id: uid(), name: '状态注入', enabled: true, content: '当前游戏状态：\n{{state}}\n\n相关设定（世界书）：\n{{worldbook}}', role: 'system' },
    { id: uid(), name: '输出格式', enabled: true, content: '你必须只输出一个合法的 JSON 对象，不要输出任何其他文字，不要用 markdown 代码块包裹。\n格式如下：\n{\n  "narration": "剧情叙述正文，第二人称，200~400字，可包含 NPC 对话",\n  "state_changes": { "mana": -5, "stamina": -3, "galleons": -7, "scene": "霍格沃茨特快列车 · 车厢内", "time": "1991年9月1日 · 中午", "inventory_add": ["巧克力蛙"], "inventory_remove": [], "relations": {"罗恩·韦斯莱": 5}, "flags": {"已认识罗恩": true}, "actors": ["罗恩·韦斯莱", "你"] },\n  "options": ["观察窗外的风景", "问罗恩关于魁地奇的事", "拿出课本预习"]\n}\n说明：\n- state_changes 所有字段均可选，没变化就省略；数值字段表示「增量」，正数为增加。\n- 可用的数值字段：mana、stamina、galleons、maxMana、maxStamina。\n- 可用的字符串字段：scene、time、house、name。\n- actors 为当前场景的在场人物列表（包含玩家自己，如 "你"）。\n- options 提供 2~4 个符合当前情境的短期行动建议，每条不超过 15 字。', role: 'system' }
  ]
}];

// ==================== 全局状态（安全加载） ====================
let apiProfiles = LS.get('hp_api_profiles', DEFAULT_API_PROFILES);
let activeApiProfileId = LS.get('hp_active_api_profile', apiProfiles[0]?.id || 'default');
let worldbooks = LS.get('hp_worldbooks', DEFAULT_WORLDBOOKS);
let activeWorldbookId = LS.get('hp_active_worldbook', worldbooks[0]?.id || 'wb_default');
let presets = LS.get('hp_presets', DEFAULT_PRESETS);
let activePresetId = LS.get('hp_active_preset', presets[0]?.id || 'p_default');
let gameState = LS.get('hp_state', JSON.parse(JSON.stringify(DEFAULT_STATE)));
let history = LS.get('hp_history', []);
let displayHistory = LS.get('hp_display', []);
let busy = false;

let playlist = LS.get('hp_playlist', []);
let currentTrackIndex = -1;
let isPlaying = false;
let audio = new Audio();
let beautifySettings = LS.get('hp_beautify', { brightness: 100, contrast: 100, blur: 0, wallpaper: '' });

// 数据安全兜底：如果读取的数据被损坏，强制回退到默认值
if (!gameState || !gameState.stats) gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
if (!Array.isArray(apiProfiles) || apiProfiles.length === 0) apiProfiles = DEFAULT_API_PROFILES;
if (!Array.isArray(worldbooks) || worldbooks.length === 0) worldbooks = DEFAULT_WORLDBOOKS;
if (!Array.isArray(presets) || presets.length === 0) presets = DEFAULT_PRESETS;
if (!presets[0].prompts) presets = DEFAULT_PRESETS; // 兼容旧存档：把 text 转成 versions 数组
if (Array.isArray(displayHistory)) {
  displayHistory.forEach(m => {
    if (m && m.text !== undefined && !m.versions) {
      m.versions = [m.text];
      m.activeVersion = 0;
      delete m.text;
    }
  });
}

// ==================== 界面渲染 ====================
window.toggleSidebar = () => { $('sidebar').classList.toggle('hidden'); };
window.openModal = (id) => { 
  if(id === 'modal-settings') {
    renderApiProfiles(); renderWorldbookSelect(); renderWorldList();
    renderPresetSelect(); renderPresetList(); renderMusicPlaylist(); renderBeautifyUI(); renderSaveList();
  }
  $(id).classList.add('show'); 
};
window.closeModal = (id) => $(id).classList.remove('show');
window.switchSettingsTab = (tabId) => {
  document.querySelectorAll('.settings-tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelector(`.settings-tabs button[onclick*="${tabId}"]`).classList.add('active');
  $(tabId).classList.add('active');
};

window.renderStatus = () => {
  const s = gameState;
  let yearStr = '2000年'; let timeStr = '未知';
  if (s.time) {
    const match = s.time.match(/(\d{4}年)/); if (match) yearStr = match[1];
    const timeMatch = s.time.match(/·\s*(.+)$/);
    if (timeMatch) timeStr = timeMatch[1].trim();
    else timeStr = s.time.replace(/^\d{4}年\d+月\d+日\s*·?\s*/, '') || s.time;
  }
  $('ui-header-year').textContent = yearStr;
  $('ui-header-time').textContent = timeStr;
  $('ui-header-scene').textContent = s.scene || '未知';
  let actors = s.actors || ['你']; if (!Array.isArray(actors)) actors = [actors];
  $('ui-header-actors').textContent = actors.join('、');
  window.renderCharSidebar();
};

function makeMsgEl(role, text) { const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text; return d; }
function getMsgText(m) {
  if (m.versions && Array.isArray(m.versions)) {
    return m.versions[m.activeVersion || 0] || '';
  }
  return m.text || '';
}

function ensureVersions(m) {
  if (!m.versions) {
    m.versions = [m.text || ''];
    m.activeVersion = 0;
    delete m.text;
  }
  if (typeof m.activeVersion !== 'number') m.activeVersion = 0;
}

window.pushDisplay = (role, text) => {
  const entry = { role, versions: [text], activeVersion: 0, t: Date.now() };
  displayHistory.push(entry);
  if (displayHistory.length > 200) displayHistory = displayHistory.slice(-200);
  const el = makeMsgEl(role, text);
  const idx = displayHistory.length - 1;
  el.dataset.idx = idx;
  if (role === 'assistant') {
    attachMsgGestures(el, idx);
  }
  $('story').appendChild(el);
  $('story').scrollTop = $('story').scrollHeight;
  LS.set('hp_display', displayHistory);
};
window.renderStory = () => {
  const box = $('story');
  box.innerHTML = '';
  if (!displayHistory.length) {
    box.innerHTML = '<div style="text-align:center;color:#4c5e7d;font-size:12px;padding:40px 10px;">还没有开始。</div>';
    return;
  }

  displayHistory.forEach((m, i) => {
    ensureVersions(m);
    const text = getMsgText(m);
    const el = makeMsgEl(m.role, text);
    el.dataset.idx = i;

    if (m.role === 'assistant') {
      const verCount = m.versions.length;
      if (verCount > 1) {
        const badge = document.createElement('span');
        badge.className = 'msg-ver-badge';
        badge.textContent = (m.activeVersion + 1) + ' / ' + verCount;
        el.appendChild(badge);
      }
      attachMsgGestures(el, i);
    }
    box.appendChild(el);
  });
  requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
};

// 长按 + 滑动
function attachMsgGestures(el, idx) {
  let startX = 0, startY = 0;
  let longPressTimer = null;
  let moved = false;
  let didTrigger = false;

  const cancelLong = () => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  };

  const onStart = (e) => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    moved = false; didTrigger = false;
    cancelLong();
    longPressTimer = setTimeout(() => {
      if (!moved) {
        didTrigger = true;
        if (navigator.vibrate) navigator.vibrate(30);
        window.showMesMenu(idx);
      }
    }, 520);
  };

  const onMove = (e) => {
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      moved = true;
      cancelLong();
    }
    // 水平滑动切版本
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      if (!didTrigger) {
        didTrigger = true;
        window.swipeMsg(idx, dx < 0 ? 1 : -1);
      }
    }
  };

  const onEnd = () => { cancelLong(); };

  el.addEventListener('touchstart', onStart, { passive: true });
  el.addEventListener('touchmove', onMove, { passive: true });
  el.addEventListener('touchend', onEnd, { passive: true });
  el.addEventListener('touchcancel', onEnd, { passive: true });
  el.addEventListener('mousedown', onStart);
  el.addEventListener('mousemove', onMove);
  el.addEventListener('mouseup', onEnd);
  el.addEventListener('mouseleave', onEnd);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

      raw = JSON.stringify({ narration: `[模拟模式] 这是重新生成的版本（${m.versions.length + 1}）。请先在 ⚙ 里填 API。`, state_changes: {}, options: [] });
    } else {
      const messages = [
        { role: 'system', content: buildSystemPrompt(playerText) },
        { role: 'user', content: `【重新生成】最近剧情：\n${context}\n\n玩家行动：${playerText}\n\n请给出与之前不同的描写角度或情节走向。` }
      ];
      const controller = new AbortController();
const timeoutId = setTimeout(() => controller.abort(), 45000);
const res = await fetch(apiProfile.url, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiProfile.key },
  body: JSON.stringify({ model: apiProfile.model, messages, temperature: apiProfile.temperature }),
  signal: controller.signal
});
clearTimeout(timeoutId);
if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
const json = await res.json();
raw = json?.choices?.[0]?.message?.content;
if (!raw) throw new Error('接口返回格式异常');
    }

    window.hideLoading();
    let s = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a >= 0 && b > a) s = s.slice(a, b + 1);
    let data;
    try { data = JSON.parse(s); } catch(e) { data = { narration: raw, state_changes: {}, options: [] }; }

    const newText = data.narration || data.text || '（无叙述）';
    m.versions.push(newText);
    m.activeVersion = m.versions.length - 1;

    // 应用状态变化
    if (data.state_changes) {

      if (typeof c.mana === 'number') st.mana = clamp(st.mana + c.mana, 0, st.maxMana);
      if (typeof c.stamina === 'number') st.stamina = clamp(st.stamina + c.stamina, 0, st.maxStamina);
      if (typeof c.galleons === 'number') st.galleons = Math.max(0, st.galleons + c.galleons);
      if (c.scene) gameState.scene = c.scene;
      if (c.time) gameState.time = c.time;
      if (c.house) gameState.house = c.house;

// ==================== 提示词构建与发送 ====================
function recentContext(extra='') { return displayHistory.slice(-8).map(m => getMsgText(m)).join('\n') + '\n' + (extra||''); }
function matchWorldbook(text) {
  const wb = worldbooks.find(w => w.id === activeWorldbookId); if (!wb) return '（未启用世界书）';
  const hits = [];
  wb.entries.forEach(e => { if(!e.enabled) return; if(e.constant) { hits.push(e); return; } if((e.keywords||[]).some(k => k && text.includes(k.trim()))) hits.push(e); });
  return hits.length ? hits.map(e => `【${e.name}】\n${e.content}`).join('\n\n') : '（本次没有触发额外设定）';
}
function formatState() {
  const s = gameState, st = s.stats;
  return `姓名：${s.name}\n学院：${s.house}\n年级：${s.year}年级\n当前场景：${s.scene}\n游戏内时间：${s.time}\n在场人物：${(s.actors||['你']).join('、')}\n魔力：${Math.round(st.mana)}/${st.maxMana}\n体力：${Math.round(st.stamina)}/${st.maxStamina}\n加隆：${st.galleons}\n随身物品：${s.inventory.join('、')||'无'}\n人物关系：${Object.entries(s.relations).map(([k,v])=>`${k}(${v>=0?'+':''}${v})`).join('、')||'无'}`;
}
function buildSystemPrompt(extra='') {
  const preset = presets.find(p => p.id === activePresetId) || presets[0];
  let finalPrompt = '';
  if(preset && preset.prompts) {
    preset.prompts.forEach(entry => {
      if (!entry.enabled) return;
      let content = entry.content;
      content = content.replace(/\{\{state\}\}/g, formatState()).replace(/\{\{worldbook\}\}/g, matchWorldbook(recentContext(extra)));
      finalPrompt += content + '\n\n';
    });
  }
  return finalPrompt.trim() || '你是一个文字冒险游戏GM。';
}

        res = await fetch(apiProfile.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiProfile.key },
          body: JSON.stringify({ model: apiProfile.model, messages, temperature: apiProfile.temperature }),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeoutId);
      }
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch(e){}
        throw new Error('HTTP ' + res.status + ' · ' + detail.slice(0, 200));
      }
      const json = await res.json();
      raw = json?.choices?.[0]?.message?.content;
      if (!raw) throw new Error('接口返回格式异常');
    }

    window.hideLoading(); history.push({ role: 'assistant', content: raw }); LS.set('hp_history', history);
    let s = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    const a = s.indexOf('{'), b = s.lastIndexOf('}'); if (a >= 0 && b > a) s = s.slice(a, b + 1);
    let data; try { data = JSON.parse(s); } catch(e) { data = { narration: raw, state_changes: {}, options: [] }; }
    window.pushDisplay('assistant', data.narration || data.text || '（无叙述）');

    if (data.state_changes) {
      const c = data.state_changes, st = gameState.stats;
      if (typeof c.mana === 'number') st.mana = clamp(st.mana + c.mana, 0, st.maxMana);
      if (typeof c.stamina === 'number') st.stamina = clamp(st.stamina + c.stamina, 0, st.maxStamina);
      if (typeof c.galleons === 'number') st.galleons = Math.max(0, st.galleons + c.galleons);
      if (c.scene) gameState.scene = c.scene; if (c.time) gameState.time = c.time;
      if (c.house) gameState.house = c.house;
      if (Array.isArray(c.inventory_add)) c.inventory_add.forEach(i => { if(!gameState.inventory.includes(i)) gameState.inventory.push(i); });
      if (c.relations) for(const [k,v] of Object.entries(c.relations)) { gameState.relations[k] = (gameState.relations[k]||0) + v; }
      if (Array.isArray(c.actors)) gameState.actors = c.actors;
      LS.set('hp_state', gameState); window.renderStatus();
    }
    window.renderOptions(data.options);
  } catch(err) {
    window.hideLoading();
    window.pushDisplay('system', '⚠ ' + err.message);
    history.pop(); LS.set('hp_history', history);
  } finally {
    busy = false;
    window._busySince = 0;
    $('send-btn').disabled = false;
    $('user-input').disabled = false;
  }
};

  if (!url) return alert('请输入音乐链接');
  playlist.push({ name: name || '未知歌曲', url }); LS.set('hp_playlist', playlist);
  $('music-name').value = ''; $('music-url').value = '';
  if (playlist.length === 1) window.playTrack(0); window.renderMusicPlaylist();

window.removeMusic = (index) => {
  playlist.splice(index, 1); LS.set('hp_playlist', playlist);
  if (currentTrackIndex === index) { audio.pause(); currentTrackIndex = -1; isPlaying = false; $('music-title').textContent = '暂无播放'; $('music-play-btn').textContent = '▶'; }
  else if (currentTrackIndex > index) currentTrackIndex--;
  window.renderMusicPlaylist();
};
window.playTrack = (index) => {
  if (index < 0 || index >= playlist.length) return;
  currentTrackIndex = index; const track = playlist[index]; audio.src = track.url;
  audio.play().catch(e => window.pushDisplay('system', '⚠ 音乐播放失败'));
  isPlaying = true; $('music-title').textContent = track.name; $('music-artist').textContent = '播放中...'; $('music-play-btn').textContent = '⏸';
  window.renderMusicPlaylist();
};
window.togglePlay = () => {
  if (playlist.length === 0) return alert('请先添加音乐');
  if (currentTrackIndex === -1) { window.playTrack(0); return; }
  if (isPlaying) { audio.pause(); isPlaying = false; $('music-play-btn').textContent = '▶'; $('music-artist').textContent = '暂停'; }
  else { audio.play(); isPlaying = true; $('music-play-btn').textContent = '⏸'; $('music-artist').textContent = '播放中...'; }
};
window.prevTrack = () => { if (playlist.length === 0) return; let index = currentTrackIndex - 1; if (index < 0) index = playlist.length - 1; window.playTrack(index); };
window.nextTrack = () => { if (playlist.length === 0) return; let index = (currentTrackIndex + 1) % playlist.length; window.playTrack(index); };
window.seekMusic = (value) => { if (audio.duration) audio.currentTime = (value / 100) * audio.duration; };
window.setVolume = (value) => { audio.volume = value / 100; };
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100; const progress = $('music-progress');
    if (progress && document.activeElement !== progress) progress.value = percent;
    $('music-current').textContent = formatTime(audio.currentTime); $('music-duration').textContent = formatTime(audio.duration);
  }
});
audio.addEventListener('ended', () => { window.nextTrack(); });
function formatTime(seconds) { if (isNaN(seconds)) return '0:00'; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }

let introAnimTimers = [];
let introAnimRunning = false;

window.playIntroAnim = () => {
  const wrap = $('intro-anim');
  const textEl = $('intro-text');
  const enterBtn = $('intro-enter');
  if(!wrap || !textEl) return;

  // 清理旧状态
  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  textEl.textContent = '';
  enterBtn.classList.remove('show');
  wrap.classList.add('show');
  introAnimRunning = true;

  let accumulated = '';
  let totalDelay = 0;

  INTRO_SCRIPT.forEach((line, lineIdx) => {
    const chars = line.t.split('');
    chars.forEach((ch, i) => {
      const delay = totalDelay + i * 85;
      introAnimTimers.push(setTimeout(() => {
        if(!introAnimRunning) return;
        accumulated += ch;
        textEl.innerHTML = esc(accumulated) + '<span class="cursor"></span>';
      }, delay));
    });
    totalDelay += chars.length * 85 + line.pause;
  });

  // 动画结束后显示"睁开眼"按钮
  introAnimTimers.push(setTimeout(() => {
    if(!introAnimRunning) return;
    enterBtn.classList.add('show');
  }, totalDelay + 400));
};

window.skipIntroAnim = () => {
  introAnimRunning = false;
  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  window.finishIntroAnim();
};

window.finishIntroAnim = () => {
  introAnimRunning = false;
  introAnimTimers.forEach(t => clearTimeout(t));
  introAnimTimers = [];
  const wrap = $('intro-anim');
  if(wrap) {
    wrap.style.transition = 'opacity 1.2s ease';
    wrap.style.opacity = '0';
    setTimeout(() => {
      wrap.classList.remove('show');
      wrap.style.opacity = '';
      wrap.style.transition = '';
      // 关闭后再弹出建档
      if(!gameState.charCard.created){
        window.openCreateModal();
      }
    }, 1200);
  }
};

window.loadSave = (id) => {
  if(!confirm('读取此存档？当前未保存的进度会丢失。')) return;
  const s = getSaves().find(x=>x.id===id);
  if(!s){ alert('存档不存在。'); return; }
  const d = s.data || {};
  if(d.gameState) gameState = d.gameState;
  if(Array.isArray(d.history)) history = d.history;
  if(Array.isArray(d.displayHistory)) displayHistory = d.displayHistory;
  LS.set('hp_state', gameState);
  LS.set('hp_history', history);
  LS.set('hp_display', displayHistory);
  window.closeModal('modal-settings');
  window.renderStatus();
  window.renderStory();
  alert('已读取：' + s.name);
};

window.deleteSave = (id) => {
  if(!confirm('删除此存档？无法恢复。')) return;
  setSaves(getSaves().filter(x=>x.id!==id));
  window.renderSaveList();
};

window.exportSave = (id) => {
  const s = getSaves().find(x=>x.id===id);
  if(!s) return;
  const data = { type:'hogwarts-save', version:1, name:s.name, subtitle:s.subtitle, ts:s.ts, data:s.data };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hogwarts-save-' + s.name.replace(/[\\/:*?"<>|]/g,'_') + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

window.importSaveFile = (e) => {

  const reader = new FileReader();
  reader.onload = ev => {

        name: (data.name || '导入存档') + ' (导入)',
        subtitle: data.subtitle || '',

      setSaves(saves);
      window.renderSaveList();

          <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">在霍格沃茨就读</div>
        </button>
        <button onclick="window.ccPickIdentity('adult')" style="padding:20px 10px;background:rgba(13,20,36,.85);border:1px solid var(--border-dim);border-radius:8px;cursor:pointer;">
          <div style="font-size:22px;margin-bottom:6px;">💼</div>
          <div style="font-size:13px;color:var(--accent-cyan);">成年人</div>
          <div style="font-size:10px;color:var(--text-dim);margin-top:4px;">已毕业，有自己的职业</div>
        </button>
      </div>
      <button onclick="window.ccCreateBack()" style="width:100%;margin-top:14px;padding:8px;font-size:12px;">← 返回选择时代</button>
    `;

  }

  if (ccCreateStep === 'form') {
    const tl = TIMELINES.find(t => t.id === ccCreateData.timeline);
    const isStudent = ccCreateData.identityType === 'student';
    const birthHint = `建议 ${tl.birthRange[0]}—${tl.birthRange[1]}`;
    box.innerHTML = `
      <div style="font-size:11px;color:var(--accent-cyan);margin-bottom:10px;">
        ${tl.name} · ${isStudent ? '学生' : '成年人'}
      </div>

      <div class="field"><label>姓名</label><input id="cc-cr-name" placeholder="中文名"></div>
      <div class="field"><label>英文名</label><input id="cc-cr-en" placeholder="Latin / English"></div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>学院</label><select id="cc-cr-house" style="width:100%;">
          <option value="">未分院</option><option>格兰芬多</option><option>斯莱特林</option><option>拉文克劳</option><option>赫奇帕奇</option>
        </select></div>
        <div style="flex:1;"><label>血统</label><select id="cc-cr-blood" style="width:100%;">
          <option value="">未定</option><option>纯血</option><option>混血</option><option>麻瓜出身</option>
        </select></div>
      </div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>发色</label><input id="cc-cr-hair" placeholder="黑 / 金"></div>
        <div style="flex:1;"><label>瞳色</label><input id="cc-cr-eye" placeholder="灰蓝 / 绿"></div>
      </div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>出生年份（${birthHint}）</label><input id="cc-cr-birthyear" type="number" placeholder="${tl.birthRange[0]}"></div>
        <div style="flex:1;"><label>生日（月-日）</label><input id="cc-cr-birthday" placeholder="03-15"></div>
      </div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>守护神</label><input id="cc-cr-patronus" placeholder="牝鹿"></div>
        <div style="flex:1;"><label>宠物</label><input id="cc-cr-pet" placeholder="可空"></div>
      </div>

      <div class="field"><label>魔杖（杖身 / 杖芯 / 长度 / 柔韧度）</label><input id="cc-cr-wand" placeholder="冬青木 / 凤凰尾羽 / 11英寸 / 柔韧"></div>

      <div class="field" style="display:flex;gap:6px;">
        <div style="flex:1;"><label>MBTI</label><input id="cc-cr-mbti" placeholder="INTJ"></div>
        <div style="flex:1;"><label>星座</label><input id="cc-cr-zodiac" placeholder="双鱼座"></div>
      </div>

      <div class="field"><label>身高（毕业后）</label><input id="cc-cr-height" placeholder="175cm"></div>
      <div class="field"><label>外貌</label><textarea id="cc-cr-appearance" rows="2" placeholder="发色、瞳色、体态、特殊特征"></textarea></div>

      ${isStudent ? `
        <div class="field"><label>入学年份（不填按 11 岁入学推算）</label><input id="cc-cr-enroll" type="number" placeholder="${tl.birthRange[0]+11}"></div>
      ` : `
        <div class="field"><label>职业</label>
          <select id="cc-cr-occupation" style="width:100%;">
            <option value="">请选择</option>
            ${OCCUPATIONS.map(o => `<option>${o}</option>`).join('')}

        <div class="field"><label>工作地点 / 所属部门</label><input id="cc-cr-workplace" placeholder="如 魔法部 · 魔法法律执行司"></div>

        <div class="field"><label>职业描述</label><textarea id="cc-cr-occupationdesc" rows="2" placeholder="日常做什么、上级是谁、有哪些同事..."></textarea></div>

}

window.ccPickTimeline = (id) => { ccCreateData.timeline = id; ccCreateStep = 'identity'; renderCreateStep(); };
window.ccPickIdentity = (type) => { ccCreateData.identityType = type; ccCreateStep = 'form'; renderCreateStep(); };
window.ccCreateBack = () => {
  if (ccCreateStep === 'form') ccCreateStep = 'identity';
  else if (ccCreateStep === 'identity') ccCreateStep = 'timeline';
  renderCreateStep();
};
function ccGetCurrentYear() {
  if (gameState.time) { const m = gameState.time.match(/(\d{4})年/); if (m) return parseInt(m[1]); }
  return 1991;
}
function ccGetBirthYear() {
  const c = gameState.charCard;
  if (c.birthYear) return parseInt(c.birthYear);
  if (c.birthday) { const m = c.birthday.match(/(\d{4})/); if (m) return parseInt(m[1]); }
  return null;
}
function ccGetGrade() {
  const by = ccGetBirthYear(); if (!by) return 1;
  const g = ccGetCurrentYear() - (by + 11) + 1;
  return Math.max(1, Math.min(7, g));
}
function ccGradeCourses(g) {
  const map = {
    1: ['魔药学', '魔咒学', '魔法史', '变形术', '草药学', '天文学', '黑魔法防御术', '飞行课'],
    2: ['魔药学', '魔咒学', '魔法史', '变形术', '草药学', '天文学', '黑魔法防御术'],
    3: ['魔药学', '魔咒学', '魔法史', '变形术', '草药学', '天文学', '黑魔法防御术', '选修课（五选二）'],
    4: ['魔药学', '魔咒学', '魔法史', '变形术', '草药学', '天文学', '黑魔法防御术', '选修课'],
    5: ['魔药学', '魔咒学', '魔法史', '变形术', '草药学', '天文学', '黑魔法防御术', '选修课', 'O.W.L. 考试'],
    6: ['N.E.W.T. 课程（按成绩选修）'],
    7: ['N.E.W.T. 课程', '毕业考试']
  };
  return map[g] || [];
}

window.renderCharSidebar = () => {
  const c = gameState.charCard;
  const box = $('cc-sidebar-body');
  if(!box) return;

  const isStudent = c.identityType !== 'adult';
  const tl = TIMELINES.find(t => t.id === c.timeline) || TIMELINES[4];
  const by = ccGetBirthYear();
  const cy = ccGetCurrentYear();
  const st = gameState.stats;

  const photoHtml = c.photo
    ? `<img src="${c.photo}" class="cc-sidebar-photo" onclick="document.getElementById('cc-sidebar-photo').click()">`
    : `<div class="cc-sidebar-photo-empty" onclick="document.getElementById('cc-sidebar-photo').click()">+</div>`;

  const row = (k, v) => `<div class="cc-row"><div class="cc-k">${k}</div><div class="cc-v ${v?'':'empty'}">${v?esc(v):'（空）'}</div></div>`;

  let timelineHtml = '';
  if (isStudent) {
    const ey = c.enrollYear ? parseInt(c.enrollYear) : (by ? by + 11 : null);
    const gy = ey ? ey + 7 : null;
    const grade = ey ? Math.max(1, Math.min(7, cy - ey + 1)) : 1;
    timelineHtml = (by ? `出生 ${by} · ` : '') + (ey ? `入学 ${ey} · 毕业 ${gy}` : '（未填生日）') + `<br>当前：<span class="cur">${cy} 年 · ${grade} 年级</span>`;
  } else {
    timelineHtml = (by ? `出生 ${by} · ` : '') + `成年巫师<br>当前：<span class="cur">${cy} 年</span>`;
  }

  let coursesOrJobHtml = '';
  const ey = c.enrollYear ? parseInt(c.enrollYear) : (by ? by + 11 : null);
  const grade = ey ? Math.max(1, Math.min(7, cy - ey + 1)) : 1;

  if (isStudent) {
    for (let g = 1; g <= grade; g++) {
      coursesOrJobHtml += `<div class="cc-subject-block"><div class="sb-title">${g} 年级</div>${ccGradeCourses(g).map(s=>`<div class="cc-subject-line"><span>${s}</span></div>`).join('')}</div>`;
    }
    if (!coursesOrJobHtml) coursesOrJobHtml = '<div style="font-size:11px;color:var(--text-faint);">（未入学）</div>';
  } else {
    coursesOrJobHtml = `
      ${row('职业', c.occupation)}
      ${row('职位', c.rank)}
      ${row('工作地点', c.workplace)}
      ${row('工作年限', c.yearsWorked)}
      <div class="cc-row" style="flex-direction:column;align-items:stretch;"><div class="cc-k" style="margin-bottom:4px;">职业描述</div><div class="cc-v ${c.occupationDesc?'':'empty'}">${c.occupationDesc?esc(c.occupationDesc):'（空）'}</div></div>
    `;
  }

  const owl = isStudent && grade >= 5;
  const newt = isStudent && grade >= 6;

  box.innerHTML = `
    <div class="cc-sidebar-photo-wrap">${photoHtml}</div>
    <div class="cc-sidebar-timeline">
      <div style="color:var(--accent-cyan);font-size:11px;">${tl.name}</div>
      <div>${timelineHtml}</div>
    </div>

    <div class="cc-sec open">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>📌 基本</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        ${row('姓名', c.name)}
        ${row('英文', c.en)}
        ${row('学院', c.house)}
        ${row('血统', c.blood)}
        ${row('发色瞳色', (c.hair||'')+(c.eye?(' / '+c.eye):''))}
        ${row('生日', c.birthday)}
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>✨ 守护神 & 魔杖</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        ${row('守护神', c.patronus)}
        ${row('魔杖', c.wand)}
        ${row('宠物', c.pet)}
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>🧬 性格 & 外貌</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        ${row('MBTI', c.mbti)}
        ${row('星座', c.zodiac)}
        ${row('身高', c.height)}
        ${row('外貌', c.appearance)}
      </div>
    </div>

    ${isStudent ? `
      <div class="cc-sec">
        <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>📚 课程（随年级解锁）</h4><span class="arrow">▶</span></div>
        <div class="cc-sec-body">${coursesOrJobHtml}</div>
      </div>
    ` : `
      <div class="cc-sec open">
        <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>💼 职业</h4><span class="arrow">▶</span></div>
        <div class="cc-sec-body">${coursesOrJobHtml}</div>
      </div>
    `}

    ${owl ? `<div class="cc-sec"><div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>📝 O.W.L.（五年级）</h4><span class="arrow">▶</span></div><div class="cc-sec-body">${['魔药学','魔咒学','魔法史','变形术','草药学','天文学','黑魔法防御术','飞行课'].map(s=>`<div class="cc-subject-line"><span>${s}</span><span class="cc-grade-chip">-</span></div>`).join('')}<div class="cc-subject-block"><div class="sb-title">选修课（五选二）</div>${['神奇动物保护学','古代如尼文研究','算数占卜','麻瓜研究','占卜学'].map(s=>`<div class="cc-subject-line"><span>${s}</span><span class="cc-grade-chip">-</span></div>`).join('')}</div></div></div>` : ''}

    ${newt ? `<div class="cc-sec"><div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>📝 N.E.W.T.（六年级）</h4><span class="arrow">▶</span></div><div class="cc-sec-body">${['魔药学','魔咒学','魔法史','变形术','草药学','天文学','黑魔法防御术','飞行课'].map(s=>`<div class="cc-subject-line"><span>${s}</span><span class="cc-grade-chip">-</span></div>`).join('')}</div></div>` : ''}

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>🎒 物品</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">${gameState.inventory.length ? gameState.inventory.map(i=>`<span class="tag">${esc(i)}</span>`).join('') : '<div style="color:var(--text-faint);font-size:11px;">空空如也</div>'}</div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>💗 状态</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">
        <div class="bar-row"><div class="bar-label"><span>魔力</span><span>${Math.round(st.mana)}/${st.maxMana}</span></div><div class="bar mana"><i style="width:${clamp(st.mana/st.maxMana*100,0,100)}%"></i></div></div>
        <div class="bar-row"><div class="bar-label"><span>体力</span><span>${Math.round(st.stamina)}/${st.maxStamina}</span></div><div class="bar stam"><i style="width:${clamp(st.stamina/st.maxStamina*100,0,100)}%"></i></div></div>
        <div class="cc-row"><div class="cc-k">加隆</div><div class="cc-v">💰 ${st.galleons}</div></div>
      </div>
    </div>

    <div class="cc-sec">
      <div class="cc-sec-head" onclick="this.parentElement.classList.toggle('open')"><h4>👥 人物关系</h4><span class="arrow">▶</span></div>
      <div class="cc-sec-body">${Object.keys(gameState.relations).length ? Object.entries(gameState.relations).map(([k,v])=>`<div class="rel"><span>${esc(k)}</span><span class="v ${v>=0?'pos':'neg'}">${v>=0?'+':''}${v}</span></div>`).join('') : '<div style="color:var(--text-faint);font-size:11px;">还没有结识任何人</div>'}</div>
    </div>
  `;
};

window.ccConfirmCreate = () => {
  const c = gameState.charCard;
  const tl = TIMELINES.find(t => t.id === ccCreateData.timeline);
  const isStudent = ccCreateData.identityType === 'student';

  c.timeline = ccCreateData.timeline;
  c.identityType = ccCreateData.identityType;

  c.name = $('cc-cr-name').value.trim() || '未命名';
  c.en = $('cc-cr-en').value.trim();
  c.house = $('cc-cr-house').value;
  c.blood = $('cc-cr-blood').value;
  c.hair = $('cc-cr-hair').value.trim();
  c.eye = $('cc-cr-eye').value.trim();
  c.birthYear = $('cc-cr-birthyear').value.trim();
  c.birthday = $('cc-cr-birthday').value.trim();
  c.patronus = $('cc-cr-patronus').value.trim();
  c.pet = $('cc-cr-pet').value.trim();
  c.wand = $('cc-cr-wand').value.trim();
  c.mbti = $('cc-cr-mbti').value.trim();
  c.zodiac = $('cc-cr-zodiac').value.trim();
  c.height = $('cc-cr-height').value.trim();
  c.appearance = $('cc-cr-appearance').value.trim();

  if (isStudent) {
    const ey = parseInt($('cc-cr-enroll').value) || (parseInt(c.birthYear) + 11);
    c.enrollYear = String(ey);
    c.gradYear = String(ey + 7);
    c.occupation = ''; c.rank = ''; c.workplace = ''; c.yearsWorked = ''; c.occupationDesc = '';
    gameState.time = ey + '年9月1日 · 上午';
    gameState.scene = '霍格沃茨特快列车';
  } else {
    c.occupation = $('cc-cr-occupation').value || '';
    c.rank = $('cc-cr-rank').value.trim();
    c.workplace = $('cc-cr-workplace').value.trim();
    c.yearsWorked = $('cc-cr-yearsworked').value.trim();
    c.occupationDesc = $('cc-cr-occupationdesc').value.trim();
    c.enrollYear = ''; c.gradYear = '';
    const by = parseInt(c.birthYear);
    const midYear = Math.floor((tl.birthRange[0] + tl.birthRange[1]) / 2) + 22;
    const year = by ? (by + 22) : midYear;
    gameState.time = year + '年 · 上午';
    gameState.scene = '对角巷';
  }

  c.created = true;
  gameState.name = c.name;
  gameState.house = c.house || '未分院';

  LS.set('hp_state', gameState);
  window.closeModal('modal-create');
  window.renderStatus();

  const opening = isStudent
    ? `（游戏开始）我的角色是 ${tl.name} 的学生。请描述我收到霍格沃茨录取通知书、在国王十字车站穿过 9¾ 站台登上特快列车的情景，作为故事的开场。`
    : `（游戏开始）我的角色是一名 ${c.occupation || '巫师'}（${tl.name}）。请描述我在这个时代的日常生活开场——我的工作地点、周围同事、当下正在处理的事情。`;
  window.sendAction(opening);
};

// 创建隐藏的文件上传 input（用于侧栏头像）
window.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('cc-sidebar-photo')) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'cc-sidebar-photo'; inp.style.display = 'none';
  inp.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => { gameState.charCard.photo = ev.target.result; LS.set('hp_state', gameState); window.renderCharSidebar(); };
    r.readAsDataURL(f);
  };
  document.body.appendChild(inp);
});
// ==================== 重开与初始化 ====================
window.resetGame = () => {
  if(!confirm('确定要清空进度重新开始吗？')) return;
  gameState = JSON.parse(JSON.stringify(DEFAULT_STATE)); history = []; displayHistory = [];
  LS.set('hp_state', gameState); LS.set('hp_history', history); LS.set('hp_display', displayHistory);
  window.renderStatus(); window.renderStory(); window.renderOptions([]);
  window.sendAction('（游戏开始）请描述我收到霍格沃茨录取通知书、在国王十字车站穿过 9¾ 站台登上特快列车的情景，作为故事的开场。');
};

window.addEventListener('DOMContentLoaded', () => {
  try {
    window.renderStatus(); window.renderStory();
    if (beautifySettings.wallpaper) document.body.style.backgroundImage = `radial-gradient(circle at 50% 0%, rgba(26,40,72,0.8) 0%, rgba(10,15,28,0.95) 80%), url('${beautifySettings.wallpaper}')`;
    document.documentElement.style.setProperty('--app-brightness', beautifySettings.brightness + '%');
    document.documentElement.style.setProperty('--app-contrast', beautifySettings.contrast + '%');
    document.documentElement.style.setProperty('--app-blur', beautifySettings.blur + 'px');
    audio.volume = 1.0;
    if(displayHistory.length === 0) {
      if (!gameState.charCard.created) {
        window.playIntroAnim();
      } else {
        window.pushDisplay('system', '👋 欢迎回来。在下方输入框写下你的行动。');
      }
    }
    const ta = $('user-input');
    ta.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); window.onSend(); } });
  } catch (err) {
    alert("初始化失败，可能是旧数据冲突。请点击设置里的【重置所有本地缓存】按钮。\\n错误信息: " + err.message);
  }
});

// 全局错误拦截，防止手机端白屏卡死无提示
window.onerror = function(msg, url, line, col, error) {
  alert("发生错误: " + msg + "\\n行号: " + line);
  return false;
};
</script>
